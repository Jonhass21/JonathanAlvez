<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Bodoni;font-weight:400;font-style:normal;src:url(node_modules/@fontsource/bodoni-moda/files/bodoni-moda-latin-400-normal.woff2)}
@font-face{font-family:Bodoni;font-weight:500;font-style:normal;src:url(node_modules/@fontsource/bodoni-moda/files/bodoni-moda-latin-500-normal.woff2)}
@font-face{font-family:Bodoni;font-weight:400;font-style:italic;src:url(node_modules/@fontsource/bodoni-moda/files/bodoni-moda-latin-400-italic.woff2)}
@font-face{font-family:Bodoni;font-weight:500;font-style:italic;src:url(node_modules/@fontsource/bodoni-moda/files/bodoni-moda-latin-500-italic.woff2)}
@font-face{font-family:Jost;font-weight:300;src:url(node_modules/@fontsource/jost/files/jost-latin-300-normal.woff2)}
@font-face{font-family:Jost;font-weight:400;src:url(node_modules/@fontsource/jost/files/jost-latin-400-normal.woff2)}
html,body{margin:0;background:#000}
canvas{display:block}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920;
const C={ber:'#DB4A2B',esp:'#2E2522',pie:'#B0ABA3',are:'#C9BAA6',lin:'#EFE9DF',hue:'#F3EEE6',topo:'#8C7D70',white:'#FFFFFF'};
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const SC=[0,30,78,126,168,198]; const TOTAL=228;

// ---------- deterministic randomness ----------
function rnd(a,b=0,c=0){let h=(a*374761393+b*668265263+c*2147483647)|0;h=(h^(h>>>13))*1274126177|0;h=h^(h>>>16);return ((h>>>0)%100000)/100000;}

// ---------- path sampling ----------
function L(x1,y1,x2,y2){const d=Math.hypot(x2-x1,y2-y1),n=Math.max(2,Math.ceil(d/6)),p=[];for(let i=0;i<=n;i++)p.push([x1+(x2-x1)*i/n,y1+(y2-y1)*i/n]);return p;}
function A(cx,cy,rx,ry,a0,a1){const n=Math.max(6,Math.ceil(Math.abs(a1-a0)*Math.max(rx,ry)/6)),p=[];for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;p.push([cx+rx*Math.cos(a),cy+ry*Math.sin(a)]);}return p;}
function P(pts){let o=[];for(let i=0;i<pts.length-1;i++){const s=L(...pts[i],...pts[i+1]);o=o.concat(i?s.slice(1):s);}return o;}
function Q(p0,p1,p2){const n=60,o=[];for(let i=0;i<=n;i++){const t=i/n,u=1-t;o.push([u*u*p0[0]+2*u*t*p1[0]+t*t*p2[0],u*u*p0[1]+2*u*t*p1[1]+t*t*p2[1]]);}return o;}
function T(strokes,cx,cy,s=1){return strokes.map(st=>st.map(([x,y])=>[cx+x*s,cy+y*s]));}
function len(st){let l=0;for(let i=1;i<st.length;i++)l+=Math.hypot(st[i][0]-st[i-1][0],st[i][1]-st[i-1][1]);return l;}

// ---------- icon library (local coords) ----------
const ICON={
  figure:()=>[A(0,0,34,34,-Math.PI/2,Math.PI*1.5+0.3),A(0,120,62,72,Math.PI,Math.PI*2)],
  lupa:()=>[A(0,0,70,70,-2.4,-2.4+Math.PI*2+0.25)],
  lupaHandle:()=>[L(52,52,128,128)],
  mega:()=>[P([[-150,-35],[-100,-35],[-100,35],[-150,35],[-150,-35]]),P([[-100,-35],[120,-110],[120,110],[-100,35]]),A(120,0,22,110,0,Math.PI*2),L(-40,47,-52,140)],
  check:()=>[P([[-95,0],[-30,65],[100,-80]])],
};

// ---------- hand-drawn stroke renderer (line "boil" each frame) ----------
function sketch(strokes,prog,o){
  const {color=C.esp,w=7,f=0,seed=1,jit=1.7,alpha=1}=o;
  const lens=strokes.map(len),tot=lens.reduce((a,b)=>a+b,0);
  let rem=Math.max(0,Math.min(1,prog))*tot;
  ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle=color;ctx.lineCap='round';ctx.lineJoin='round';
  strokes.forEach((st,si)=>{
    if(rem<=0)return;
    const p1=rnd(f,seed,si)*6.28,p2=rnd(f,seed,si+50)*6.28,p3=rnd(f,seed,si+100)*6.28,p4=rnd(f,seed,si+150)*6.28;
    const pts=[];let acc=0;
    for(let i=0;i<st.length;i++){
      if(i>0)acc+=Math.hypot(st[i][0]-st[i-1][0],st[i][1]-st[i-1][1]);
      if(acc>rem)break;
      pts.push([st[i][0]+jit*(Math.sin(i*0.21+p1)*0.7+Math.sin(i*0.057+p2)*0.6),st[i][1]+jit*(Math.sin(i*0.19+p3)*0.7+Math.sin(i*0.061+p4)*0.6)]);
    }
    rem-=lens[si];
    if(pts.length<2)return;
    for(const [lw,a,off] of [[w,1,0],[Math.max(1.5,w*0.3),0.35,1.6]]){
      ctx.globalAlpha=alpha*a;ctx.lineWidth=lw;ctx.beginPath();
      pts.forEach(([x,y],i)=>{const xx=x+off*Math.sin(i*0.3+p2),yy=y+off*Math.cos(i*0.27+p3);i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy);});
      ctx.stroke();
    }
  });
  ctx.restore();
}
// small positional wobble for "hand-placed" cut-outs
function wob(f,id,amp=1.4){return [(rnd(f,id,7)-.5)*2*amp,(rnd(f,id,8)-.5)*2*amp,(rnd(f,id,9)-.5)*0.006*amp];}
function withWob(f,id,cx,cy,fn,amp){const [dx,dy,r]=wob(f,id,amp);ctx.save();ctx.translate(cx+dx,cy+dy);ctx.rotate(r);ctx.translate(-cx,-cy);fn();ctx.restore();}

function txt(s,x,y,font,color,f,id,align='center',ls='0px'){
  withWob(f,id,x,y,()=>{ctx.font=font;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='alphabetic';ctx.letterSpacing=ls;ctx.fillText(s,x,y);ctx.letterSpacing='0px';},1.1);
}
// word-by-word reveal, layout is stable
function words(s,n,y,f,id,font='400 56px Jost',color=C.esp,maxW=880,lh=76){
  ctx.font=font;const ws=s.split(' '),lines=[[]];
  ws.forEach(w=>{const cur=lines[lines.length-1];const test=[...cur,w].join(' ');if(ctx.measureText(test).width>maxW&&cur.length)lines.push([w]);else cur.push(w);});
  let k=0;
  lines.forEach((ln,li)=>{
    const full=ln.join(' ');ctx.font=font;const fw=ctx.measureText(full).width;let x=540-fw/2;
    ln.forEach((w,wi)=>{
      if(k<n){txt(w,x,y+li*lh,font,color,f,id+k,'left');}
      ctx.font=font;x+=ctx.measureText(w+' ').width;k++;
    });
  });
}
function logo(cx,base,size,color,f,id,count=5){
  const fb=`400 ${size}px Bodoni`,fs=`400 ${size*0.46}px Bodoni`,sp=size*0.13;
  ctx.font=fb;const wb=ctx.measureText('B').width;ctx.font=fs;
  const ws=['O','R','G','O'].map(c=>ctx.measureText(c).width);
  const tot=wb+size*0.06+ws.reduce((a,b)=>a+b,0)+sp*3;let x=cx-tot/2;
  if(count>0)txt('B',x,base,fb,color,f,id,'left');x+=wb+size*0.06;
  ['O','R','G','O'].forEach((c,i)=>{if(count>i+1)txt(c,x,base,fs,color,f,id+i+1,'left');x+=ws[i]+sp;});
}
function header(num,title,t,f,bg){
  logo(540,175,62,C.esp,f,900,5);
  if(t>=2)txt(num,540,330,'300 38px Jost',C.topo,f,910,'center','6px');
  if(t>=3)txt(title,540,458,'500 128px Bodoni',C.esp,f,911);
  if(t>=4)sketch([L(495,508,585,508)],(t-3)/3,{f,seed:912,w:5,color:C.ber});
}
const ease=u=>1-Math.pow(1-Math.max(0,Math.min(1,u)),3);

// ---------- scenes ----------
function scene0(t,f){
  ctx.fillStyle=C.esp;ctx.fillRect(0,0,W,H);
  logo(540,175,62,C.pie,f,900,5);
  const F='500 124px Bodoni';
  if(t>=1)txt('Marketing',540,700,F,C.hue,f,1);
  if(t>=3)txt('=',540,840,F,C.pie,f,2);
  if(t>=4)txt('Publicidad',540,990,F,C.hue,f,3);
  if(t>=6)txt('=',540,1130,F,C.pie,f,4);
  if(t>=7)txt('Ventas',540,1280,F,C.hue,f,5);
  if(t>=11)sketch([L(505,862,577,768)],(t-10)/2,{f,seed:6,w:8,color:C.hue});
  if(t>=13)sketch([L(505,1152,577,1058)],(t-12)/2,{f,seed:7,w:8,color:C.hue});
  if(t>=16)txt('¿Son lo mismo?',540,1500,'italic 400 84px Bodoni',C.pie,f,8);
}
function scene1(t,f){
  ctx.fillStyle=C.hue;ctx.fillRect(0,0,W,H);header('01','Marketing',t,f);
  const xs=[160,350,540,730,920],HY=860;
  xs.forEach((x,i)=>{
    const st=5+i*2;if(t<st)return;
    const col=(t>=34&&i!==2)?C.pie:C.esp;
    sketch(T(ICON.figure(),x,HY,1.15),(t-st)/3,{f,seed:20+i,w:7,color:col});
  });
  // magnifier sweep
  if(t>=16&&t<=35){
    let x,y=HY;
    if(t<=28)x=-160+(540+160)*ease((t-16)/12);
    else if(t<=31)x=540;
    else{const u=(t-31)/4;x=540+u*700;y=HY-u*500;}
    ctx.save();ctx.globalAlpha=0.45;ctx.fillStyle=C.white;ctx.beginPath();ctx.arc(x,y,84,0,7);ctx.fill();ctx.restore();
    sketch(T(ICON.lupa(),x,y,1.2),1,{f,seed:30,w:9});
    sketch(T(ICON.lupaHandle(),x,y,1.2),1,{f,seed:31,w:20});
  }
  if(t>=33)sketch([A(540,950,122,190,-1.9,-1.9+Math.PI*2+0.35)],(t-32)/6,{f,seed:32,w:6,color:C.esp});
  if(t>=20)words('Decide a quién le hablás, qué le decís y por qué.',t-19,1390,f,40);
}
function scene2(t,f){
  ctx.fillStyle=C.are;ctx.fillRect(0,0,W,H);header('02','Publicidad',t,f);
  const fx=540+(870-540)*ease((t-3)/6),HY=860;
  sketch(T(ICON.figure(),fx,HY,1.15),1,{f,seed:22,w:7});
  const MX=300,MY=950,MS=1.3;
  if(t>=8){const amp=(t>=17&&t<=19)?6:1.4;withWob(f,50,MX,MY,()=>sketch(T(ICON.mega(),MX,MY,MS),(t-7)/9,{f,seed:51,w:7}),amp);}
  for(let k=0;k<4;k++){
    const r=40+(t-17-k*4)*34;
    if(r>40&&r<310)sketch([A(MX+142*MS,MY,r,r,-0.42,0.42)],1,{f,seed:60+k,w:6,alpha:Math.min(1,1.15-r/520)});
  }
  if(t>=30){[-Math.PI/2,-Math.PI/2-0.75,-Math.PI/2+0.75].forEach((a,i)=>{
    sketch([L(fx+Math.cos(a)*60,HY+Math.sin(a)*60,fx+Math.cos(a)*98,HY+Math.sin(a)*98)],(t-29)/2,{f,seed:70+i,w:6});
  });}
  if(t>=20)words('Hace que te vean las personas correctas.',t-19,1390,f,80);
}
function scene3(t,f){
  ctx.fillStyle=C.lin;ctx.fillRect(0,0,W,H);header('03','Ventas',t,f);
  const HY=900,FX=260;
  sketch(T(ICON.figure(),FX,HY,1.2),1,{f,seed:22,w:7});
  const BX=700,BY=780,RX=245,RY=175;
  const bubble=[A(BX,BY,RX,RY,2.25,2.0+Math.PI*2).concat(L(BX+RX*Math.cos(2.0),BY+RY*Math.sin(2.0),410,960).slice(1)).concat(L(410,960,BX+RX*Math.cos(2.25),BY+RY*Math.sin(2.25)).slice(1))];
  if(t>=6){
    if(t>=14){ctx.save();ctx.fillStyle=C.white;ctx.globalAlpha=0.55;ctx.beginPath();ctx.ellipse(BX,BY,RX-4,RY-4,0,0,7);ctx.fill();ctx.restore();}
    sketch(bubble,(t-5)/8,{f,seed:90,w:7});
  }
  if(t>=14&&t<23){
    const rot=[0,-0.14,0.1,-0.08,0.14,-0.1,0.06,-0.12,0.08][t-14];
    ctx.save();ctx.translate(BX,BY+70);ctx.rotate(rot);ctx.font='500 260px Bodoni';ctx.fillStyle=C.esp;ctx.textAlign='center';ctx.fillText('?',0,0);ctx.restore();
  }
  if(t>=23)sketch(T(ICON.check(),BX,BY+10,1.2),(t-22)/5,{f,seed:91,w:15});
  if(t>=16)words('Convierte el interés en una decisión.',t-15,1390,f,100);
}
function scene4(t,f){
  ctx.fillStyle=C.hue;ctx.fillRect(0,0,W,H);
  logo(540,175,62,C.esp,f,900,5);
  if(t>=2)txt('04',540,330,'300 38px Jost',C.topo,f,910,'center','6px');
  if(t>=2)txt('Cuando se unen',540,450,'italic 400 92px Bodoni',C.esp,f,911);
  const xs=[220,540,860],CY=720,lab=['Estrategia','Mensaje','Cierre'];
  const icons=[
    ()=>[...T(ICON.lupa(),xs[0]-14,CY-14,0.62),...T(ICON.lupaHandle(),xs[0]-14,CY-14,0.62)],
    ()=>T(ICON.mega(),xs[1]+12,CY-8,0.5),
    ()=>T(ICON.check(),xs[2]-2,CY+6,0.62),
  ];
  xs.forEach((x,i)=>{
    const st=3+i;if(t<st)return;
    sketch([A(x,CY,112,112,-1.6,-1.6+Math.PI*2+0.2)],(t-st)/3,{f,seed:120+i,w:6,color:C.topo});
    sketch(icons[i](),(t-st-1)/3,{f,seed:130+i,w:6});
    if(t>=st+2)txt(lab[i],x,900,'400 42px Jost',C.esp,f,140+i);
  });
  if(t>=6)txt('+',380,738,'400 70px Bodoni',C.esp,f,150);
  if(t>=8)txt('+',700,738,'400 70px Bodoni',C.esp,f,151);
  const J=[540,1140];
  if(t>=11){
    sketch([Q([220,950],[220,1100],J),Q([540,950],[540,1050],J),Q([860,950],[860,1100],J)],(t-10)/5,{f,seed:160,w:6});
  }
  if(t>=16)sketch([L(540,1140,540,1250),P([[505,1212],[540,1252],[575,1212]])],(t-15)/3,{f,seed:161,w:7});
  const rs={19:68,20:48,21:48,22:48,23:48,24:48,25:120,26:320,27:700,28:1300,29:2300};
  if(t>=19){
    ctx.fillStyle=C.ber;ctx.beginPath();const [dx,dy]=wob(f,170,1.4);ctx.arc(540+dx,1340+dy,rs[t]||48,0,7);ctx.fill();
  }
  if(t>=20&&t<=26){
    ctx.font='500 116px Bodoni';const we=ctx.measureText('= ').width;ctx.font='italic 500 116px Bodoni';const wa=ctx.measureText('Acción').width;
    const x0=540-(we+wa)/2;
    txt('=',x0,1560,'500 116px Bodoni',C.esp,f,171,'left');
    txt('Acción',x0+we,1560,'italic 500 116px Bodoni',C.ber,f,172,'left');
  }
}
function scene5(t,f){
  ctx.fillStyle=C.ber;ctx.fillRect(0,0,W,H);
  const n=t<1?0:t<3?1:Math.min(5,t-1);
  logo(540,1010,300,C.white,f,200,n);
  if(t>=9)sketch([L(470,1085,610,1085)],(t-8)/3,{f,seed:210,w:3,color:C.hue,jit:1});
  if(t>=11)txt('Estrategia digital para emprendedores.',540,1170,'300 46px Jost',C.hue,f,211,'center','1px');
}
const SCN=[scene0,scene1,scene2,scene3,scene4,scene5];

// ---------- paper grain (3 variants, swapped per frame like real stop motion) ----------
const grains=[0,1,2].map(g=>{const c=document.createElement('canvas');c.width=540;c.height=960;const x=c.getContext('2d');const d=x.createImageData(540,960);
  for(let i=0;i<d.data.length;i+=4){const r=rnd(i,g,3);const v=r>0.5?255:0;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=Math.floor(Math.abs(r-0.5)*2*22);}
  x.putImageData(d,0,0);return c;});

function render(f){
  let idx=0;for(let i=0;i<SC.length;i++)if(f>=SC[i])idx=i;
  const t=f-SC[idx];
  if(idx>=1&&idx<=4&&t<3){
    SCN[idx-1](SC[idx]-1-SC[idx-1],f);
    const off=[0.6,0.2,0][t]*W,rot=[0.07,0.025,0][t];
    ctx.save();ctx.translate(off,0);ctx.translate(0,H);ctx.rotate(rot);ctx.translate(0,-H);
    ctx.shadowColor='rgba(30,20,15,0.35)';ctx.shadowBlur=50;ctx.shadowOffsetX=-14;
    ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);ctx.shadowColor='transparent';
    ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();SCN[idx](t,f);ctx.restore();
  } else SCN[idx](t,f);
  ctx.save();ctx.imageSmoothingEnabled=false;ctx.drawImage(grains[f%3],0,0,W,H);ctx.restore();
  const g=ctx.createRadialGradient(540,960,600,540,960,1250);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(40,25,20,0.14)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}
window.render=render;window.TOTAL=TOTAL;
Promise.all(['500 50px Bodoni','400 50px Bodoni','italic 400 50px Bodoni','italic 500 50px Bodoni','300 50px Jost','400 50px Jost'].map(s=>document.fonts.load(s))).then(()=>{window.ready=true;render(0);});
</script></body></html>
