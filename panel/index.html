/* ---------- Informes ----------
   El documento se exporta como imagen con html2canvas, que rasteriza lo
   que ve: por eso el informe usa colores fijos y no variables de tema. */
function semanaActual() {
  const s = weekOf(today());
  return { desde: s[0], hasta: s[6] };
}

function tareasDelInforme() {
  if (!estado.infCliente) return [];
  let items = delCliente(estado.infCliente);
  if (estado.infDesde) items = items.filter((t) => !t.fecha || t.fecha >= estado.infDesde);
  if (estado.infHasta) items = items.filter((t) => !t.fecha || t.fecha <= estado.infHasta);
  return items;
}

function docInformeHTML() {
  const c = clientePorId(estado.infCliente);
  if (!c) return "";
  const elegidas = tareasDelInforme().filter((t) => estado.infSelec.indexOf(t.key) !== -1);
  const periodo = estado.infDesde && estado.infHasta
    ? fechaLegible(estado.infDesde) + " — " + fechaLegible(estado.infHasta)
    : estado.infDesde ? "Desde " + fechaLegible(estado.infDesde) : "";
  const hechas = elegidas.filter((t) => t.done).length;

  const filas = elegidas.map((t) =>
    '<div class="doc-tarea"><div class="doc-caja ' + (t.done ? "done" : "") + '"></div>' +
      '<div class="doc-tarea-txt ' + (t.done ? "done" : "") + '">' + esc(t.texto) +
      (t.fecha ? '<div class="doc-tarea-fecha">' + esc(fechaLegible(t.fecha)) + "</div>" : "") +
      "</div></div>").join("");

  return (
    '<div class="doc" id="doc-informe">' +
      '<div class="doc-top"><div>' +
        '<div class="doc-emoji">' + esc(c.emoji || "🏢") + "</div>" +
        '<div class="doc-cli">' + esc(c.nombre) + "</div>" +
        (periodo ? '<div class="doc-periodo">' + esc(periodo) + "</div>" : "") +
      "</div>" +
      '<div class="doc-logo"><b>Jonathan Alvez</b>Informe de avance</div></div>' +
      (estado.infTexto.trim()
        ? '<div class="doc-sec"><div class="doc-lbl">Novedades</div><div class="doc-texto">' + esc(estado.infTexto.trim()) + "</div></div>"
        : "") +
      (elegidas.length
        ? '<div class="doc-sec"><div class="doc-lbl">Tareas · ' + hechas + " de " + elegidas.length + " completadas</div>" + filas + "</div>"
        : "") +
      '<div class="doc-pie"><span>Generado el ' + esc(fechaLegible(today())) + "</span><span>jonathanalvez</span></div>" +
    "</div>"
  );
}

function vistaInformes() {
  const opciones = ['<option value="">— Elegí un cliente —</option>'].concat(
    datos.clientes.map((c) =>
      '<option value="' + c.id + '"' + (estado.infCliente === c.id ? " selected" : "") + ">" + esc((c.emoji || "🏢") + " " + c.nombre) + "</option>")
  ).join("");

  const items = tareasDelInforme();
  const lista = !estado.infCliente
    ? '<div class="empty" style="padding:20px">Elegí un cliente para ver sus tareas</div>'
    : !items.length
      ? '<div class="empty" style="padding:20px">No hay tareas en ese período</div>'
      : '<div class="inf-lista">' + items.map((t) => {
          const marcada = estado.infSelec.indexOf(t.key) !== -1;
          return (
            '<button type="button" class="inf-fila" aria-pressed="' + marcada + '" data-a="inf-tarea" data-k="' + t.key + '">' +
              '<span class="caja">' + (marcada ? icon("check") : "") + "</span>" +
              '<span class="inf-fila-txt"><b>' + esc(t.texto) + "</b>" +
                "<span>" + (t.fecha ? esc(fechaLegible(t.fecha)) : "Sin fecha") + " · " + (t.done ? "Completada" : "Pendiente") + "</span></span>" +
            "</button>"
          );
        }).join("") + "</div>";

  return (
    "<header><h1>Informes</h1>" +
      '<p class="sub">Armá el resumen de un cliente y descargalo como imagen para mandárselo.</p></header>' +
    '<div class="inf-layout">' +
      '<div class="inf-editor glass">' +
        '<div class="field"><label for="inf-cli">Cliente</label>' +
          '<select id="inf-cli" data-a-change="inf-cliente">' + opciones + "</select></div>" +
        '<div class="grid2">' +
          '<div class="field"><label for="inf-desde">Desde</label>' +
            '<input id="inf-desde" type="date" value="' + esc(estado.infDesde) + '" data-a-change="inf-desde" /></div>' +
          '<div class="field"><label for="inf-hasta">Hasta</label>' +
            '<input id="inf-hasta" type="date" value="' + esc(estado.infHasta) + '" data-a-change="inf-hasta" /></div>' +
        "</div>" +
        '<div class="field"><label for="inf-texto">Novedades</label>' +
          '<textarea id="inf-texto" rows="5" placeholder="Avances, comentarios, lo que quieras contarle…" data-f="infTexto">' + esc(estado.infTexto) + "</textarea></div>" +
        '<div class="field"><span class="label">Tareas a incluir</span>' + lista + "</div>" +
        '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
          '<button type="button" class="btn btn-soft btn-sm" data-a="inf-todas">Marcar todas</button>' +
          '<button type="button" class="btn btn-soft btn-sm" data-a="inf-ninguna">Ninguna</button>' +
        "</div>" +
        '<button type="button" class="btn btn-primary btn-block" data-a="inf-descargar"' +
          (estado.infCliente ? "" : " disabled") + ">" + icon("down") + "Descargar imagen</button>" +
      "</div>" +
      '<div class="inf-vista glass">' +
        '<span class="eyebrow">Vista previa</span>' +
        '<div class="inf-marco" style="margin-top:12px">' +
          (estado.infCliente ? docInformeHTML() : '<div class="empty">Completá los datos para ver el informe</div>') +
        "</div>" +
      "</div>" +
    "</div>"
  );
}

        plural(datos.tareas.length, "tarea propia", "tareas propias") + " y " +
        plural(datos.tareasCliente.length, "tarea de cliente", "tareas de clientes") + ".</p>" +

/* ---------- navegación ---------- */
const SECC_NAV = [
  { id: "hoy", label: "Hoy", icon: "home" },
  { id: "clientes", label: "Clientes", icon: "users" },
  { id: "calendario", label: "Calendario", icon: "calendar" },
  { id: "informes", label: "Informes", icon: "report" },
  { id: "ajustes", label: "Ajustes", icon: "settings" },
];

const $view = document.getElementById("view");
const $scroll = document.getElementById("scroll");
const $search = document.getElementById("search");
const $dlg = document.getElementById("dialog");
const $fab = document.getElementById("taski-fab");
const $taski = document.getElementById("taski-panel");

document.getElementById("brand-mark").innerHTML = icon("spark");
document.getElementById("lock-mark").innerHTML = icon("lock");
$fab.innerHTML = icon("bot");

function pintarNav() {
  const activa = estado.consulta.trim() ? "" : estado.vista === "cliente" ? "clientes" : estado.vista;
  document.getElementById("nav-desktop").innerHTML = SECC_NAV.map((s) =>
    '<button type="button" data-a="ir" data-v="' + s.id + '"' +
    (activa === s.id ? ' aria-current="page"' : "") + ">" + s.label + "</button>").join("");
  document.getElementById("nav-mobile").innerHTML = SECC_NAV.map((s) =>
    '<button type="button" data-a="ir" data-v="' + s.id + '"' +
    (activa === s.id ? ' aria-current="page"' : "") + ">" + icon(s.icon) + "<span>" + s.label + "</span></button>").join("");
}

let primeraPintada = true;

function render() {
  pintarNav();
  const buscando = Boolean(estado.consulta.trim());
  $view.classList.toggle("narrow", buscando || (estado.vista !== "hoy" && estado.vista !== "informes"));

  if (buscando) $view.innerHTML = vistaBusqueda();
  else if (estado.vista === "clientes") $view.innerHTML = vistaClientes();
  else if (estado.vista === "cliente") $view.innerHTML = vistaCliente();
  else if (estado.vista === "calendario") $view.innerHTML = vistaCalendario();
  else if (estado.vista === "informes") $view.innerHTML = vistaInformes();
  else if (estado.vista === "ajustes") $view.innerHTML = vistaAjustes();
  else $view.innerHTML = vistaHoy();

  if (primeraPintada) {
    $view.classList.add("enter");
    primeraPintada = false;
    setTimeout(() => $view.classList.remove("enter"), 1400);
  }
  pintarTaski();
}

function ir(vista) {
  estado.vista = vista;
  estado.consulta = "";
  $search.value = "";
  $scroll.scrollTop = 0;
  if (vista === "informes" && !estado.infDesde) {
    const s = semanaActual();
    estado.infDesde = s.desde;
    estado.infHasta = s.hasta;
  }
  render();
}

function escenaTaski() {
  const tarjeta = (pos, tono, ico, arriba, abajo, flote, pregunta) =>
    '<button type="button" class="float-card glass ' + flote + " " + pos + '" data-a="taski-sugerencia" data-v="' + esc(pregunta) + '">' +
      '<span class="bead-icon bead-' + tono + '">' + icon(ico) + "</span>" +
      '<span class="fc-text"><span class="fc-1">' + esc(arriba) + "</span>" +
        '<span class="fc-2">' + esc(abajo) + "</span></span></button>";
  return (
    '<div class="escena"><div class="robo-wrap">' + roboSVG(190) + "</div>" +
      tarjeta("c1", "wine", "list", "¿Qué tengo hoy?", "para la jornada", "float-a", "¿Qué tengo hoy?") +
      tarjeta("c2", "gold", "doc", "¿Qué está vencido?", "sin completar", "float-b", "¿Qué está vencido?") +
      tarjeta("c3", "olive", "check", "¿Qué hice?", "esta semana", "float-c", "¿Qué hice esta semana?") +

function pintarTaski() {
  $fab.setAttribute("aria-expanded", String(taski.abierto));
  $fab.setAttribute("aria-label", taski.abierto ? "Cerrar a Taski" : "Abrir a Taski");
  $fab.innerHTML = taski.abierto ? icon("x") : icon("bot");
  $taski.hidden = !taski.abierto;
  if (!taski.abierto) return;

  const campo = $taski.querySelector("#taski-input");
  const texto = campo ? campo.value : "";

  $taski.innerHTML =
    '<div class="taski-head">' +
      '<span class="bead-icon bead-wine">' + icon("bot") + "</span>" +
      '<div><div class="taski-name">Taski</div><p class="taski-sub">Responde con tus tareas y clientes</p></div>' +
      '<button type="button" class="icon-btn" style="margin-left:auto" data-a="taski" aria-label="Cerrar">' + icon("x") + "</button>" +
    "</div>" +
    '<div class="taski-log" id="taski-log">' +
      taski.mensajes.map((m) => '<div class="msg ' + m.de + '">' + esc(m.texto) + "</div>").join("") +
    "</div>" +
    (taski.mensajes.length <= 1 ? escenaTaski() : "") +
    '<form class="taski-form" id="taski-form">' +
      '<input id="taski-input" autocomplete="off" placeholder="Preguntale algo a Taski…" aria-label="Preguntale algo a Taski" value="' + esc(texto) + '" />' +
      '<button type="submit" class="taski-send" id="taski-send" aria-label="Enviar"' + (texto.trim() ? "" : " disabled") + ">" + icon("up") + "</button>" +
    "</form>";

  const log = $taski.querySelector("#taski-log");
  log.scrollTop = log.scrollHeight;
  $taski.querySelector("#taski-form").addEventListener("submit", (e) => {
    e.preventDefault();
    preguntarATaski($taski.querySelector("#taski-input").value);
  });
}

function preguntarATaski(texto) {
  const q = texto.trim();
  if (!q) return;
  taski.mensajes.push({ de: "me", texto: q });
  taski.mensajes.push({ de: "it", texto: taskiResponde(q) });
  pintarTaski();
  const campo = $taski.querySelector("#taski-input");
  if (campo) { campo.value = ""; campo.focus(); }
  const enviar = $taski.querySelector("#taski-send");
  if (enviar) enviar.disabled = true;
}

/* ---------- descarga del informe ---------- */
async function descargarInforme() {
  const c = clientePorId(estado.infCliente);
  if (!c) return;
  const nodo = document.getElementById("doc-informe");
  if (!nodo) return;
  toast("Generando la imagen…");
  try {
    if (!window.html2canvas) {
      await new Promise((ok, mal) => {
        const s = document.createElement("script");
        s.src = "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
        s.onload = ok; s.onerror = mal;
        document.head.appendChild(s);
      });
    }
    const canvas = await window.html2canvas(nodo, { backgroundColor: "#5c1a2e", scale: 2, useCORS: true, logging: false });
    const a = document.createElement("a");
    a.download = "informe-" + c.nombre.toLowerCase().replace(/\s+/g, "-") + "-" + today() + ".png";
    a.href = canvas.toDataURL("image/png");
    a.click();
  } catch (e) {
    toast("No se pudo generar la imagen", "Revisá la conexión y probá de nuevo.");
  }
}

document.addEventListener("click", (e) => {

// Los botones de prioridad se actualizan a mano: re-renderizar movería el foco.
document.addEventListener("click", (e) => {
  const el = e.target.closest('[data-a="prioridad"]');
  if (!el) return;
  const d = el.dataset.target === "dlg" ? dlgDraft : estado.borrador;
  if (!d) return;
  d.prio = el.dataset.v;
  el.parentElement.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b === el)));
});

document.addEventListener("input", (e) => {
  const el = e.target;
  if (el.id === "captura") {
    estado.captura = el.value;
    const b = document.getElementById("captura-enviar");
    if (b) b.disabled = !el.value.trim();
    return;
  }
  if (el.id === "taski-input") {
    const b = $taski.querySelector("#taski-send");
    if (b) b.disabled = !el.value.trim();
    return;
  }
  if (el.id === "search") {
    estado.consulta = el.value;
    $scroll.scrollTop = 0;
    render();
    return;
  }
  if (el.dataset.f === "infTexto") { estado.infTexto = el.value; refrescarVista(); return; }
  const campo = el.dataset && el.dataset.f;
  if (!campo) return;
  const d = el.dataset.target === "dlg" ? dlgDraft : estado.borrador;
  if (!d) return;
  d[campo] = el.value === "" ? null : el.value;
  if (campo === "clienteId") {
    d.clienteId = el.value ? Number(el.value) : null;
    // El área es solo para tareas propias: con cliente, la tarea es de trabajo.
    const sec = document.getElementById(el.dataset.target + "-sec");
    if (sec) sec.disabled = Boolean(d.clienteId);
  }
});

document.addEventListener("change", (e) => {
  const a = e.target.dataset && e.target.dataset.aChange;
  if (!a) return;
  if (a === "inf-cliente") { estado.infCliente = e.target.value ? Number(e.target.value) : null; estado.infSelec = []; }
  if (a === "inf-desde") { estado.infDesde = e.target.value; estado.infSelec = []; }
  if (a === "inf-hasta") { estado.infHasta = e.target.value; estado.infSelec = []; }
  render();
});

/** La vista previa del informe se repinta sin tocar el textarea, para no
    perder el cursor mientras se escribe. */
function refrescarVista() {
  const marco = document.querySelector(".inf-marco");
  if (marco && estado.infCliente) marco.innerHTML = docInformeHTML();
}

document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.id === "captura") { e.preventDefault(); ACCIONES.interpretar(); return; }
  if (e.key === "Enter" && $dlg.open && e.target.tagName === "INPUT") { e.preventDefault(); ACCIONES["ok-dialogo"](); return; }
  if (e.key !== "Escape") return;
  if ($dlg.open) return;
  if (taski.abierto) { ACCIONES.taski(); return; }
  if ($search.value) { estado.consulta = ""; $search.value = ""; render(); }
});

let modoEntrada = "firebase"; // firebase | local

const ERRORES = {
  "auth/invalid-credential": "Mail o contraseña incorrectos.",
  "auth/invalid-login-credentials": "Mail o contraseña incorrectos.",
  "auth/wrong-password": "Mail o contraseña incorrectos.",
  "auth/user-not-found": "No hay ningún usuario con ese mail.",
  "auth/invalid-email": "Ese mail no tiene formato válido.",
  "auth/user-disabled": "Ese usuario está deshabilitado en Firebase.",
  "auth/too-many-requests": "Demasiados intentos. Esperá unos minutos.",
  "auth/network-request-failed": "Sin conexión con Firebase.",
  "auth/operation-not-allowed": "Falta habilitar Email/contraseña en Firebase → Authentication → Sign-in method.",
  "auth/configuration-not-found": "Falta habilitar Email/contraseña en Firebase → Authentication → Sign-in method.",
};

async function hashStr(s) {
  // crypto.subtle solo existe en contexto seguro: por http:// (abrir la app
  // por la IP del equipo, por ejemplo) no está, y esto reventaba sin aviso.
  if (!(window.crypto && window.crypto.subtle)) throw new Error("sin-cripto");
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
}

function mostrarLock(mensaje) {
  $lock.hidden = false;
  document.getElementById("app").hidden = true;
  $fab.hidden = true;
  taski.abierto = false;
  $taski.hidden = true;
  $lockErr.textContent = mensaje || "";
  $lockPass.value = "";
  // Enfocar al cargar abre el teclado del teléfono, que tapa medio
  // formulario antes de que se vea. En pantalla táctil, que enfoque la persona.
  const tactil =
    (window.matchMedia && window.matchMedia("(pointer: coarse)").matches) ||
    navigator.maxTouchPoints > 0;
  if (!tactil) (modoEntrada === "firebase" && !$lockMail.value ? $lockMail : $lockPass).focus();
}

function abrirApp(alCargar) {
  $lock.hidden = true;
  document.getElementById("app").hidden = false;
  $fab.hidden = false;
  primeraPintada = true;
  render();
  if (alCargar) alCargar();
}

function pasarAModoLocal(motivo) {
  modoEntrada = "local";
  $campoMail.hidden = true;
  $lockPass.setAttribute("aria-label", "Contraseña local");
  $lockBtn.textContent = "Entrar sin conexión";
  $lockPie.textContent = motivo;
  marcarSync("local", "Solo este equipo");
}

$lockForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  $lockErr.textContent = "";

  if (modoEntrada === "local") {
    let hash;
    try {
      hash = await hashStr($lockPass.value);
    } catch (err) {
      $lockErr.textContent =
        err && err.message === "sin-cripto"
          ? "Este navegador no puede verificar la contraseña porque la página no está en HTTPS. Abrila con https:// (o desde localhost)."
          : "No se pudo verificar la contraseña.";
      return;
    }
    if (hash !== PASS_HASH) {
      $lockErr.textContent = "Contraseña incorrecta";
      $lockPass.value = "";
      $lockPass.focus();
      return;
    }
    const local = leerLocal();
    if (local) datos = local;
    abrirApp();
    toast("Estás sin conexión", "Ves la copia de este equipo. Los cambios no viajan a la nube.");
    return;
  }

  const mail = $lockMail.value.trim();
  const clave = $lockPass.value;
  if (!mail || !clave) { $lockErr.textContent = "Completá mail y contraseña."; return; }

  if (!fb) {
    $lockErr.textContent = "Todavía no terminó de cargar la conexión con Firebase. Esperá unos segundos y probá de nuevo.";
    return;
  }

  $lockBtn.disabled = true;
  $lockBtn.textContent = "Entrando…";
  try {
    // Sin reloj, el botón se queda en «Entrando…» para siempre cuando el
    // teléfono pierde señal a mitad del pedido.
    await conLimite(
      fb.authMod.signInWithEmailAndPassword(fb.auth, mail, clave),
      ESPERA_LOGIN,
      "Firebase no respondió a tiempo. Revisá la conexión del teléfono."
    );
    // onAuthStateChanged se encarga de abrir la app.
  } catch (err) {
    const cod = err && err.code ? String(err.code) : "";
    $lockErr.textContent = ERRORES[cod] || "No se pudo entrar. " + (err && err.message ? err.message : "");
    $lockPass.value = "";
    $lockPass.focus();
  } finally {
    $lockBtn.disabled = false;
    $lockBtn.textContent = "Entrar";
  }
});

async function arrancar() {
  aplicarTema(temaGuardado());
  // Sin esto, los segundos que tarda el SDK se ven como una pantalla colgada.
  $lockPie.textContent = "Conectando con Firebase…";
  const local = leerLocal();
  if (local) datos = local;

  try {
    await cargarFirebase();
  } catch (e) {
    pasarAModoLocal("No se pudo contactar a Firebase. Podés entrar con la contraseña local y trabajar con la copia de este equipo.");
    mostrarLock();
    return;
  }

  $lockPie.textContent = "Entrás con el usuario de Firebase. La sesión queda guardada en este dispositivo.";

  fb.authMod.onAuthStateChanged(fb.auth, (user) => {
    if (user) {
      marcarSync("cargando", "Conectando");
      abrirApp();
      escucharDatos((esActualizacion) => {
        // No pisar lo que se está editando en ese momento.
        if (esActualizacion && ($dlg.open || estado.borrador)) return;
        render();
      });
    } else {
      dejarDeEscuchar();
      mostrarLock();
    }
  });
}

arrancar();

// El reloj de los recordatorios: una vez por minuto alcanza.
setTimeout(function tick() {
  if (!$dlg.open && !estado.borrador && !estado.consulta.trim() && estado.vista === "hoy" && !document.getElementById("app").hidden) render();
  setTimeout(tick, 60000);
}, 60000 - (Date.now() % 60000));
</script>
