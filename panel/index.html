<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Panel · Jonathan Alvez</title>
<meta name="description" content="Clientes, tareas, calendario e informes. Sincronizado entre dispositivos." />
<meta name="theme-color" content="#faf7f2" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#14100f" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Panel" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"

/>

<style>
  /* ============================================================
     Paleta de marca: borgoña y dorado sobre crema. El tratamiento
     es el nuevo — vidrio translúcido, auras difusas, esquinas
     squircle — pero los colores son los de siempre.
     Los semánticos (alta/media/baja, vencido) son otra familia y
     nunca hacen de acento.
     ============================================================ */
  :root {
    --canvas: #faf7f2;
    --canvas-2: #f3eee5;

    --wine: #5c1a2e;
    --wine-hover: #4a1425;
    --wine-deep: #38101c;
    --wine-ink: #7a2338;
    --wine-wash: #f7ecef;
    --wine-fg: #fdf8f4;

    --gold: #b8862f;
    --gold-bright: #d4a853;
    --gold-wash: #fbf3e4;

    --ink: #1c1810;
    --ink-body: #2a231a;
    --ink-soft: #6b6050;
    --ink-faint: #a0968a;

    --glass-a: rgba(255, 253, 250, 0.78);
    --glass-b: rgba(255, 253, 250, 0.46);
    --glass-edge: rgba(255, 255, 255, 0.72);
    /* Reemplazo opaco del vidrio donde backdrop-filter sale demasiado caro. */
    --glass-solid: #fffdfa;
    --glass-inset: inset 0 2.5px 4px rgba(255, 255, 255, 0.85);
    --ring: rgba(60, 40, 25, 0.06);
    --hairline: rgba(60, 40, 25, 0.12);
    --tint: rgba(60, 40, 25, 0.05);
    --tint-strong: rgba(60, 40, 25, 0.1);

    --aura-1: rgba(92, 26, 46, 0.2);
    --aura-2: rgba(212, 168, 83, 0.3);

    --alta: #9b2222;
    --alta-wash: #fbeeec;
    --media: #8a6012;
    --media-wash: #fdf5e6;
    --baja: #35662d;
    --baja-wash: #eef5ec;

    --shadow-sm: 0 1px 2px rgba(40, 30, 10, 0.05);
    --shadow-card: 0 12px 32px -6px rgba(92, 26, 46, 0.12);
    --shadow-lift: 0 18px 50px -12px rgba(40, 30, 10, 0.22);
    --wine-glow: 0 10px 25px -6px rgba(92, 26, 46, 0.35);
    --gold-glow: 0 8px 22px -6px rgba(184, 134, 47, 0.35);

    --r-sm: 12px;
    --r-md: 16px;
    --r-lg: 20px;
    --r-xl: 24px;

    --robo-a: #fffdfa;
    --robo-b: #f2e8dd;
    --robo-borde: rgba(92, 26, 46, 0.16);
    --robo-panel: #e6d6c4;
    --robo-linea: #c9b49e;

    --font-display: "DM Serif Display", Georgia, serif;
    --font-sans: "Inter", "DM Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --canvas: #14100f;
      --canvas-2: #1c1715;
      --wine: #8c2f44;
      --wine-hover: #a03a51;
      --wine-deep: #6d2235;
      --wine-ink: #eaa8b6;
      --wine-wash: #2a161c;
      --wine-fg: #fff6f8;
      --gold: #d4a853;
      --gold-bright: #e3bd76;
      --gold-wash: #2a2114;
      --ink: #f7f1e8;
      --ink-body: #ece4d8;
      --ink-soft: #a79a8e;
      --ink-faint: #6f6558;
      --glass-a: rgba(255, 245, 235, 0.08);
      --glass-b: rgba(255, 245, 235, 0.035);
      --glass-edge: rgba(255, 240, 225, 0.13);
      --glass-solid: #221c19;
      --glass-inset: inset 0 1.5px 2px rgba(255, 245, 235, 0.1);
      --ring: rgba(255, 240, 225, 0.06);
      --hairline: rgba(255, 240, 225, 0.11);
      --tint: rgba(255, 240, 225, 0.06);
      --tint-strong: rgba(255, 240, 225, 0.12);
      --aura-1: rgba(140, 47, 68, 0.28);
      --aura-2: rgba(180, 140, 70, 0.2);
      --alta: #f0908c;
      --alta-wash: #2e1817;
      --media: #e0b263;
      --media-wash: #2b2214;
      --baja: #86c07a;
      --baja-wash: #1a2618;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.45);
      --shadow-card: 0 12px 32px -6px rgba(0, 0, 0, 0.55);
      --shadow-lift: 0 18px 50px -12px rgba(0, 0, 0, 0.7);
      --robo-a: #2a2220;
      --robo-b: #1d1716;
      --robo-borde: rgba(255, 240, 225, 0.15);
      --robo-panel: #3a2e2a;
      --robo-linea: #574641;
      --robo-a: #2a2220;
    --robo-b: #1d1716;
    --robo-borde: rgba(255, 240, 225, 0.15);
    --robo-panel: #3a2e2a;
    --robo-linea: #574641;
    --wine-glow: 0 10px 25px -6px rgba(140, 47, 68, 0.5);
      --gold-glow: 0 8px 22px -6px rgba(212, 168, 83, 0.35);
    }
  }

  :root[data-theme="dark"] {
    --canvas: #14100f;
    --canvas-2: #1c1715;
    --wine: #8c2f44;
    --wine-hover: #a03a51;
    --wine-deep: #6d2235;
    --wine-ink: #eaa8b6;
    --wine-wash: #2a161c;
    --wine-fg: #fff6f8;
    --gold: #d4a853;
    --gold-bright: #e3bd76;
    --gold-wash: #2a2114;
    --ink: #f7f1e8;
    --ink-body: #ece4d8;
    --ink-soft: #a79a8e;
    --ink-faint: #6f6558;
    --glass-a: rgba(255, 245, 235, 0.08);
    --glass-b: rgba(255, 245, 235, 0.035);
    --glass-edge: rgba(255, 240, 225, 0.13);
    --glass-solid: #221c19;
    --glass-inset: inset 0 1.5px 2px rgba(255, 245, 235, 0.1);
    --ring: rgba(255, 240, 225, 0.06);
    --hairline: rgba(255, 240, 225, 0.11);
    --tint: rgba(255, 240, 225, 0.06);
    --tint-strong: rgba(255, 240, 225, 0.12);
    --aura-1: rgba(140, 47, 68, 0.28);
    --aura-2: rgba(180, 140, 70, 0.2);
    --alta: #f0908c;
    --alta-wash: #2e1817;
    --media: #e0b263;
    --media-wash: #2b2214;
    --baja: #86c07a;
    --baja-wash: #1a2618;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.45);
    --shadow-card: 0 12px 32px -6px rgba(0, 0, 0, 0.55);
    --shadow-lift: 0 18px 50px -12px rgba(0, 0, 0, 0.7);
    --wine-glow: 0 10px 25px -6px rgba(140, 47, 68, 0.5);
    --gold-glow: 0 8px 22px -6px rgba(212, 168, 83, 0.35);
  }

  /* ---------- base ---------- */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--canvas);
    color: var(--ink-body);
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.5;
    letter-spacing: -0.2px;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
  button { cursor: pointer; background: none; border: 0; }
  :focus-visible { outline: 2px solid var(--wine); outline-offset: 2px; border-radius: 8px; }
  .num, time { font-variant-numeric: tabular-nums; }
  ::selection { background: rgba(92, 26, 46, 0.16); }
  [hidden] { display: none !important; }

  /* ---------- aura ---------- */
  .aura { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .aura i { position: absolute; display: block; border-radius: 50%; }
  .aura .a1 { top: -24%; right: -12%; width: 540px; height: 540px; background: var(--aura-1); filter: blur(120px); }
  .aura .a2 { bottom: -28%; left: -16%; width: 480px; height: 480px; background: var(--aura-2); filter: blur(120px); }
  .aura .a3 { bottom: -6%; right: 18%; width: 380px; height: 380px; background: var(--aura-2); filter: blur(120px); opacity: .55; }

  /* ---------- vidrio ---------- */
  .glass {
    background: linear-gradient(to bottom right, var(--glass-a), var(--glass-b));
    backdrop-filter: blur(20px) saturate(1.4);
    -webkit-backdrop-filter: blur(20px) saturate(1.4);
    border: 1px solid var(--glass-edge);
    box-shadow: var(--glass-inset), 0 0 0 1px var(--ring), var(--shadow-card);
  }
  .glass-deep {
    background: linear-gradient(to bottom right, var(--glass-a), var(--glass-b));
    backdrop-filter: blur(50px) saturate(1.6);
    -webkit-backdrop-filter: blur(50px) saturate(1.6);
    border: 1px solid var(--glass-edge);
    box-shadow: var(--glass-inset), 0 0 0 1px var(--ring), var(--shadow-lift);
  }

  /* ---------- candado ---------- */
  .lock {
    position: fixed; inset: 0; z-index: 200;
    display: grid; place-items: center; padding: 20px;
    background: var(--canvas);
  }
  .lock-box {
    position: relative; z-index: 1;
    width: min(360px, 100%); padding: 30px 26px;
    border-radius: var(--r-xl); text-align: center;
  }
  .lock-mark {
    width: 54px; height: 54px; margin: 0 auto 16px; border-radius: 16px;
    display: grid; place-items: center; color: var(--gold-bright);
    background: linear-gradient(to bottom right, var(--wine), var(--wine-deep));
    box-shadow: var(--wine-glow);
  }
  .lock-mark .ic { width: 26px; height: 26px; }
  .lock-title { font-family: var(--font-display); font-size: 26px; color: var(--ink); line-height: 1.1; }
  .lock-sub { margin-top: 6px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); }
  .lock-field { margin-top: 12px; }
  .lock-field:first-of-type { margin-top: 22px; }
  .lock-field input {
    width: 100%; height: 46px; padding: 0 14px; text-align: center;
    border-radius: var(--r-sm); border: 1px solid var(--hairline);
    background: var(--canvas); font-size: 16px; color: var(--ink);
  }
  .lock-field input[type="password"] { letter-spacing: .18em; }
  .lock-field input[type="password"]::placeholder { letter-spacing: 0; }
  .lock-field input:focus { outline: none; border-color: var(--wine); box-shadow: 0 0 0 3px var(--wine-wash); }
  .lock-error { margin-top: 12px; min-height: 18px; font-size: 12.5px; line-height: 1.5; color: var(--alta); }
  .lock-pie { margin-top: 14px; font-size: 11.5px; line-height: 1.55; color: var(--ink-faint); }
  .lock-pie button { font-size: 11.5px; font-weight: 700; color: var(--wine-ink); text-decoration: underline; text-underline-offset: 2px; }

  /* ---------- estructura ---------- */
  .app { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100%; }

  .navbar {
    position: fixed; top: 14px; left: 0; right: 0; z-index: 50;
    display: flex; justify-content: center; padding-inline: 16px; pointer-events: none;
    animation: drop-in .6s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .navbar-inner {
    pointer-events: auto; width: 100%; max-width: 1220px;
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px 8px 16px; border-radius: var(--r-md);
  }
  .brand { display: flex; align-items: center; gap: 9px; white-space: nowrap; }
  .brand-mark {
    width: 30px; height: 30px; border-radius: 9px; flex: none;
    display: grid; place-items: center; color: var(--gold-bright);
    background: linear-gradient(to bottom right, var(--wine), var(--wine-deep));
    box-shadow: var(--shadow-sm);
  }
  .brand-mark .ic { width: 16px; height: 16px; }
  .brand-txt { display: flex; flex-direction: column; line-height: 1.05; }
  .brand-txt b { font-family: var(--font-display); font-weight: 400; font-size: 17px; color: var(--ink); }
  .brand-txt span { font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint); }

  .navlinks { display: none; align-items: center; gap: 2px; margin-inline: auto; }
  .navlinks button {
    padding: 7px 13px; border-radius: 10px;
    font-size: 13.5px; font-weight: 500; color: var(--ink-soft);
    transition: color .18s, background .18s;
  }
  .navlinks button:hover { color: var(--ink); background: var(--tint); }
  .navlinks button[aria-current="page"] { color: var(--wine-ink); background: var(--wine-wash); font-weight: 600; }

  .navtools { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .search { position: relative; width: 150px; }
  .search .ic { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--ink-faint); pointer-events: none; }
  .search input {
    width: 100%; height: 36px; padding: 0 12px 0 33px;
    border-radius: var(--r-sm); border: 1px solid var(--tint-strong);
    background: var(--tint); font-size: 13.5px; color: var(--ink-body);
    transition: border-color .18s, background .18s;
  }
  .search input::placeholder { color: var(--ink-faint); }
  .search input:focus { outline: none; border-color: var(--wine); background: var(--canvas); }

  .sync {
    display: none; align-items: center; gap: 6px; flex: none;
    padding: 0 10px; height: 30px; border-radius: 999px;
    font-size: 11.5px; font-weight: 600; color: var(--ink-faint); background: var(--tint);
  }
  .sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-faint); flex: none; }
  .sync[data-estado="online"] { color: var(--baja); background: var(--baja-wash); }
  .sync[data-estado="online"] i { background: var(--baja); animation: latido 2.4s ease-in-out infinite; }
  .sync[data-estado="local"] { color: var(--media); background: var(--media-wash); }
  .sync[data-estado="local"] i { background: var(--media); }

  .scroll { flex: 1; overflow-y: auto; overflow-x: hidden; }
  .page {
    width: 100%; max-width: 1220px; margin: 0 auto;
    padding: 86px 20px 120px; display: flex; flex-direction: column; gap: 26px;
  }
  .page.narrow { max-width: 900px; }

  .tabbar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
    display: flex; justify-content: center;
    padding: 0 12px calc(12px + env(safe-area-inset-bottom, 0px)); pointer-events: none;
  }
  .tabbar-inner { pointer-events: auto; display: flex; width: 100%; max-width: 480px; padding: 6px; border-radius: var(--r-lg); }
  .tabbar-inner button {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 7px 2px; border-radius: 14px;
    font-size: 10px; font-weight: 600; color: var(--ink-soft);
    transition: color .18s, background .18s;
  }
  .tabbar-inner button[aria-current="page"] { color: var(--wine-ink); background: var(--wine-wash); }
  .tabbar-inner .ic { width: 19px; height: 19px; }

  @media (min-width: 960px) {
    .navlinks { display: flex; }
    .search { width: 210px; }
    .sync { display: flex; }
    .tabbar { display: none; }
    .page { padding: 96px 28px 64px; }
  }

  /* ---------- tipografía ---------- */
  h1 { font-family: var(--font-display); font-weight: 400; font-size: 27px; line-height: 1.15; letter-spacing: -0.5px; color: var(--ink); }
  .display { font-family: var(--font-display); font-weight: 400; font-size: clamp(32px, 5.2vw, 50px); line-height: 1.06; letter-spacing: -1.2px; color: var(--ink); text-wrap: balance; }
  h2 { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); }
  .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); }
  .lead { margin-top: 14px; font-size: 16.5px; line-height: 1.6; letter-spacing: -0.3px; color: var(--ink-soft); max-width: 46ch; }
  .frase { margin-top: 10px; font-size: 13px; font-style: italic; color: var(--ink-faint); max-width: 46ch; }
  .sub { margin-top: 5px; font-size: 13.5px; color: var(--ink-soft); }
  .muted { color: var(--ink-soft); }
  .faint { color: var(--ink-faint); }
  section { display: flex; flex-direction: column; gap: 10px; }

  .hero-grid { display: grid; grid-template-columns: 1fr; gap: 26px; }
  @media (min-width: 1040px) {
    .hero-grid { grid-template-columns: 5fr 7fr; gap: 42px; align-items: start; }
    .hero-left { position: sticky; top: 96px; }
  }
  .hero-left, .hero-right { display: flex; flex-direction: column; gap: 18px; min-width: 0; }

  /* ---------- botones ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 38px; padding: 0 15px; border-radius: var(--r-sm);
    font-size: 13.5px; font-weight: 600; letter-spacing: -0.2px;
    border: 1px solid transparent; white-space: nowrap;
    transition: transform .15s cubic-bezier(0.16, 1, 0.3, 1), background .18s, box-shadow .18s, color .18s, border-color .18s;
  }
  .btn:active { transform: scale(.975); }
  .btn .ic { width: 15px; height: 15px; }
  .btn-primary { background: var(--wine); color: var(--wine-fg); font-weight: 700; box-shadow: inset 0 4px 4px rgba(255,255,255,0.12), var(--wine-glow); }
  .btn-primary:hover { background: var(--wine-hover); transform: scale(1.02); }
  .btn-gold { background: linear-gradient(to bottom right, var(--gold-bright), var(--gold)); color: #2a1e08; font-weight: 700; box-shadow: var(--gold-glow); }
  .btn-gold:hover { filter: brightness(1.05); transform: scale(1.02); }
  .btn-soft { background: var(--tint); border-color: var(--tint-strong); color: var(--ink); }
  .btn-soft:hover { background: var(--tint-strong); box-shadow: var(--shadow-sm); }
  .btn-quiet { color: var(--ink-soft); font-weight: 500; }
  .btn-quiet:hover { background: var(--tint); color: var(--ink); }
  .btn-danger { color: var(--ink-faint); font-weight: 500; }
  .btn-danger:hover { background: var(--alta-wash); color: var(--alta); }
  .btn-sm { height: 32px; padding: 0 11px; font-size: 12.5px; }
  .btn-block { width: 100%; }

  .btn-bead { height: 44px; padding: 0 6px 0 20px; border-radius: var(--r-md); gap: 14px; font-size: 14px; }
  .btn-bead .bead {
    width: 32px; height: 32px; border-radius: 50%; flex: none;
    background: var(--gold-bright); color: var(--wine-deep);
    display: grid; place-items: center;
    transition: transform .2s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .btn-bead:hover .bead { transform: translateX(3px); }
  .btn-bead .bead .ic { width: 16px; height: 16px; }

  .icon-btn {
    width: 32px; height: 32px; border-radius: 10px; flex: none;
    display: grid; place-items: center; color: var(--ink-faint);
    transition: background .18s, color .18s;
  }
  .icon-btn:hover { background: var(--tint); color: var(--ink); }
  .icon-btn.danger:hover { background: var(--alta-wash); color: var(--alta); }
  .icon-btn .ic { width: 16px; height: 16px; }

  /* ---------- captura ---------- */
  .capture-row { position: relative; }
  .capture-row input {
    width: 100%; height: 58px; padding: 0 60px 0 18px;
    font-size: 16px; letter-spacing: -0.3px; border-radius: var(--r-lg);
    background: linear-gradient(to bottom right, var(--glass-a), var(--glass-b));
    backdrop-filter: blur(20px) saturate(1.4); -webkit-backdrop-filter: blur(20px) saturate(1.4);
    border: 1px solid var(--glass-edge);
    box-shadow: var(--glass-inset), 0 0 0 1px var(--ring), var(--shadow-card);
    color: var(--ink-body);
    transition: border-color .2s, box-shadow .2s;
  }
  .capture-row input::placeholder { color: var(--ink-faint); }
  .capture-row input:focus {
    outline: none; border-color: rgba(92, 26, 46, .45);
    box-shadow: var(--glass-inset), 0 0 0 4px rgba(92, 26, 46, .1), var(--shadow-card);
  }
  .capture-send {
    position: absolute; right: 9px; top: 50%; transform: translateY(-50%);
    width: 40px; height: 40px; border-radius: var(--r-sm);
    display: grid; place-items: center; background: var(--wine); color: var(--wine-fg);
    box-shadow: inset 0 3px 4px rgba(255,255,255,.14), var(--wine-glow);
    transition: opacity .18s, background .18s;
  }
  .capture-send:hover { background: var(--wine-hover); }
  .capture-send[disabled] { opacity: .28; cursor: default; box-shadow: none; }
  .capture-send .ic { width: 17px; height: 17px; }
  .hint { margin-top: 10px; padding-inline: 2px; font-size: 12px; color: var(--ink-faint); }

  .confirm { border-radius: var(--r-xl); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  .confirm-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .confirm-head strong { font-family: var(--font-display); font-weight: 400; font-size: 17px; color: var(--ink); }

  /* ---------- campos ---------- */
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .field > label, .field > .label {
    font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
    color: var(--ink-faint); display: flex; align-items: center; gap: 6px;
  }
  .guessed { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); flex: none; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 9px 11px; border: 1px solid var(--hairline); border-radius: 11px;
    background: var(--canvas); font-size: 14px; color: var(--ink-body);
    transition: border-color .18s, box-shadow .18s;
  }
  .field textarea { resize: vertical; min-height: 58px; font-family: inherit; }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none; border-color: var(--wine); box-shadow: 0 0 0 3px var(--wine-wash);
  }
  .seg { display: flex; gap: 6px; }
  .seg button {
    flex: 1; padding: 8px 10px; border-radius: 11px;
    border: 1px solid var(--hairline); background: var(--canvas);
    font-size: 13px; font-weight: 600; color: var(--ink-soft); transition: all .18s;
  }
  .seg button:hover { background: var(--tint); }
  .seg button[aria-pressed="true"] { border-color: transparent; background: var(--wine); color: var(--wine-fg); box-shadow: var(--wine-glow); }
  .actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; align-items: center; }

  /* ---------- perlas y tarjetas flotantes ---------- */
  .bead-icon { width: 34px; height: 34px; border-radius: 11px; flex: none; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 15px; }
  .bead-icon .ic { width: 17px; height: 17px; }
  .bead-wine  { background: linear-gradient(to bottom right, #7a2338, #4a1425); box-shadow: 0 4px 12px rgba(92,26,46,.32); }
  .bead-gold  { background: linear-gradient(to bottom right, #d4a853, #a8761f); color: #2a1e08; box-shadow: 0 4px 12px rgba(184,134,47,.32); }
  .bead-olive { background: linear-gradient(to bottom right, #5d7a3a, #3d5424); box-shadow: 0 4px 12px rgba(93,122,58,.3); }
  .bead-clay  { background: linear-gradient(to bottom right, #b5653c, #8a4527); box-shadow: 0 4px 12px rgba(181,101,60,.3); }
  .bead-slate { background: linear-gradient(to bottom right, #4a5a6e, #2f3c4c); box-shadow: 0 4px 12px rgba(74,90,110,.3); }
  .bead-plum  { background: linear-gradient(to bottom right, #6b4478, #47294f); box-shadow: 0 4px 12px rgba(107,68,120,.3); }

  .float-card {
    display: flex; align-items: center; gap: 12px; text-align: left;
    padding: 11px 16px; border-radius: var(--r-lg);
    transition: transform .25s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .float-card:hover { transform: scale(1.02) rotate(.4deg); }
  .float-card:hover, .float-card:focus-visible { animation-play-state: paused; }
  .float-card .fc-text { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; flex: 1; }
  .float-card .fc-1 { font-size: 13.5px; font-weight: 800; letter-spacing: -0.3px; color: var(--ink-body); }
  .float-card .fc-2 { font-size: 11px; font-weight: 600; color: var(--ink-soft); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .float-card.fc-wrap { flex-wrap: wrap; }
  .float-card.fc-wrap .fc-text { flex: 1 1 150px; }
  .float-card.fc-wrap .fc-2 { white-space: normal; overflow: visible; }
  .float-card .fc-acciones { display: flex; align-items: center; gap: 6px; margin-left: auto; flex: none; }
  .float-a { animation: float-a 5s ease-in-out infinite; }
  .float-b { animation: float-b 5.5s ease-in-out infinite; }
  .float-c { animation: float-c 4.8s ease-in-out infinite; }

  /* ---------- tareas ---------- */
  .list { display: flex; flex-direction: column; gap: 8px; }
  .task {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 13px 14px; border-radius: var(--r-lg);
    background: linear-gradient(to bottom right, var(--glass-a), var(--glass-b));
    backdrop-filter: blur(20px) saturate(1.4); -webkit-backdrop-filter: blur(20px) saturate(1.4);
    border: 1px solid var(--glass-edge);
    box-shadow: var(--glass-inset), 0 0 0 1px var(--ring), 0 6px 18px -8px rgba(40,30,10,.12);
    transition: transform .18s cubic-bezier(0.16, 1, 0.3, 1), box-shadow .18s;
  }
  .task:hover { transform: translateY(-2px); box-shadow: var(--glass-inset), 0 0 0 1px var(--ring), var(--shadow-card); }
  .check {
    margin-top: 1px; width: 20px; height: 20px; flex: none;
    border: 1.5px solid var(--tint-strong); border-radius: 50%;
    display: grid; place-items: center;
    transition: border-color .18s, background .18s, transform .15s;
  }
  .check:hover { border-color: var(--wine); transform: scale(1.08); }
  .check[data-done="1"] { background: var(--wine); border-color: var(--wine); color: var(--wine-fg); box-shadow: 0 3px 9px rgba(92,26,46,.3); }
  .check .ic { width: 11px; height: 11px; }
  .task-body { flex: 1; min-width: 0; text-align: left; }
  .task-title { font-size: 14px; font-weight: 600; letter-spacing: -0.3px; color: var(--ink-body); }
  .task[data-done="1"] .task-title { color: var(--ink-faint); text-decoration: line-through; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 8px; margin-top: 7px; font-size: 11.5px; color: var(--ink-soft); }
  .meta .cli { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; color: var(--wine-ink); }
  .tag { border: 1px solid var(--hairline); border-radius: 999px; padding: 1px 8px; font-size: 10.5px; font-weight: 600; color: var(--ink-soft); }
  .when.vencida { color: var(--alta); font-weight: 700; }
  .when.hoy { color: var(--wine-ink); font-weight: 700; }
  .prio { border-radius: 999px; padding: 1.5px 8px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
  .prio.alta { background: var(--alta-wash); color: var(--alta); }
  .prio.media { background: var(--media-wash); color: var(--media); }
  .prio.baja { background: var(--baja-wash); color: var(--baja); }
  .task-side { display: flex; align-items: center; gap: 1px; flex: none; }
  @media (min-width: 960px) {
    .task-side .icon-btn { opacity: 0; transition: opacity .18s, background .18s, color .18s; }
    .task:hover .task-side .icon-btn, .task:focus-within .task-side .icon-btn { opacity: 1; }
  }

  /* ---------- superficies ---------- */
  .card { border-radius: var(--r-xl); padding: 18px; }
  .empty {
    border: 1.5px dashed var(--tint-strong); border-radius: var(--r-xl);
    padding: 30px 20px; text-align: center; color: var(--ink-soft); font-size: 14px; font-weight: 500;
  }
  .empty p { margin-top: 5px; font-size: 12.5px; font-weight: 400; color: var(--ink-faint); }
  .empty-robo { padding: 14px 20px 26px; }
  .empty-robo .empty-t { margin-top: 6px; font-family: var(--font-display); font-size: 17px; font-weight: 400; color: var(--ink); }
  .empty-robo p { max-width: 34ch; margin-inline: auto; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 10px; }
  .stat { border-radius: var(--r-lg); padding: 13px 15px; }
  .stat b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 28px; line-height: 1.1; color: var(--ink); }
  .stat span { display: block; margin-top: 3px; font-size: 11.5px; font-weight: 600; color: var(--ink-soft); }
  .stat.acento b { color: var(--wine-ink); }
  .stat.alerta b { color: var(--alta); }

  .barra { height: 5px; border-radius: 99px; background: var(--tint-strong); overflow: hidden; }
  .barra i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(to right, var(--wine), var(--gold)); transition: width .45s cubic-bezier(0.16, 1, 0.3, 1); }

  /* ---------- clientes ---------- */
  .cli-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .cli-card {
    display: flex; flex-direction: column; gap: 12px; text-align: left; width: 100%;
    padding: 16px; border-radius: var(--r-xl);
    background: linear-gradient(to bottom right, var(--glass-a), var(--glass-b));
    backdrop-filter: blur(20px) saturate(1.4); -webkit-backdrop-filter: blur(20px) saturate(1.4);
    border: 1px solid var(--glass-edge);
    box-shadow: var(--glass-inset), 0 0 0 1px var(--ring), 0 6px 18px -8px rgba(40,30,10,.12);
    transition: transform .18s cubic-bezier(0.16, 1, 0.3, 1), box-shadow .18s;
  }
  .cli-card:hover { transform: translateY(-3px); box-shadow: var(--glass-inset), 0 0 0 1px var(--ring), var(--shadow-card); }
  .cli-top { display: flex; align-items: center; gap: 11px; }
  .cli-emoji { width: 40px; height: 40px; border-radius: 13px; flex: none; display: grid; place-items: center; font-size: 20px; background: var(--tint); }
  .cli-nombre { font-family: var(--font-display); font-weight: 400; font-size: 18px; color: var(--ink); line-height: 1.2; }
  .cli-sub { margin-top: 2px; font-size: 11.5px; color: var(--ink-soft); }
  .cli-next { font-size: 12.5px; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { border-radius: 999px; padding: 3px 9px; font-size: 11px; font-weight: 700; white-space: nowrap; background: var(--alta-wash); color: var(--alta); }
  .badge.ok { background: var(--baja-wash); color: var(--baja); }
  .badge.gold { background: var(--gold-wash); color: var(--gold); }

  .tabs { display: flex; gap: 4px; padding: 5px; border-radius: 14px; background: var(--tint); width: fit-content; max-width: 100%; overflow-x: auto; }
  .tabs button {
    padding: 7px 13px; border-radius: 10px; white-space: nowrap;
    font-size: 13px; font-weight: 600; color: var(--ink-soft);
    transition: background .18s, color .18s, box-shadow .18s;
  }
  .tabs button[aria-selected="true"] { background: var(--canvas); color: var(--ink); box-shadow: var(--shadow-sm); }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip {
    border: 1px solid var(--hairline); border-radius: 999px;
    padding: 5px 12px; font-size: 12px; font-weight: 600; color: var(--ink-soft); transition: all .18s;
  }
  .chip:hover { background: var(--tint); color: var(--ink); }
  .chip[aria-pressed="true"] { border-color: transparent; background: var(--wine); color: var(--wine-fg); box-shadow: var(--wine-glow); }

  .emoji-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; max-height: 190px; overflow-y: auto; padding: 4px; border: 1px solid var(--hairline); border-radius: 11px; background: var(--canvas); }
  @media (max-width: 520px) { .emoji-grid { grid-template-columns: repeat(8, 1fr); } }
  .emoji-grid button { aspect-ratio: 1; border-radius: 8px; font-size: 17px; display: grid; place-items: center; transition: background .15s, transform .15s; }
  .emoji-grid button:hover { background: var(--tint); transform: scale(1.12); }
  .emoji-grid button[aria-pressed="true"] { background: var(--wine-wash); box-shadow: inset 0 0 0 1.5px var(--wine); }

  /* ---------- calendario ---------- */
  .cal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .cal-mes { font-family: var(--font-display); font-size: 19px; color: var(--ink); text-transform: capitalize; }
  .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 7px; }
  .day {
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    padding: 10px 2px; border-radius: 14px;
    border: 1px solid var(--ring); background: var(--tint);
    transition: transform .18s cubic-bezier(0.16, 1, 0.3, 1), background .18s;
  }
  .day:hover { transform: translateY(-2px); background: var(--tint-strong); }
  .day[aria-pressed="true"] { border-color: transparent; background: var(--wine); color: var(--wine-fg); box-shadow: var(--wine-glow); }
  .day .dow { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-faint); }
  .day[aria-pressed="true"] .dow { color: rgba(255,255,255,.75); }
  .day .n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; color: var(--ink-body); }
  .day.es-hoy .n { background: var(--gold-wash); color: var(--gold); }
  .day[aria-pressed="true"] .n { background: rgba(255,255,255,.2); color: var(--wine-fg); }
  .day .marks { height: 5px; display: flex; gap: 3px; align-items: center; }
  .day .marks i { width: 5px; height: 5px; border-radius: 50%; background: var(--wine); }
  .day .marks i.cli { background: var(--gold); }
  .day[aria-pressed="true"] .marks i { background: rgba(255,255,255,.85); }
  .month-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .month-grid .dow-head { text-align: center; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-faint); padding-bottom: 5px; }
  .month-grid .day { border-color: transparent; background: transparent; padding: 7px 2px; }
  .month-grid .day:hover { background: var(--tint); }
  .month-grid .day[aria-pressed="true"] { background: var(--wine); }
  .month-grid .day.fuera { opacity: .3; }
  .month-grid .day .n { width: 23px; height: 23px; font-size: 12px; }

  /* ---------- informes ---------- */
  .inf-layout { display: grid; grid-template-columns: 1fr; gap: 20px; }
  @media (min-width: 1040px) { .inf-layout { grid-template-columns: 380px 1fr; align-items: start; } }
  .inf-editor { display: flex; flex-direction: column; gap: 14px; border-radius: var(--r-xl); padding: 18px; }
  .inf-lista { display: flex; flex-direction: column; gap: 4px; max-height: 240px; overflow-y: auto; padding: 5px; border: 1px solid var(--hairline); border-radius: 11px; background: var(--canvas); }
  .inf-fila { display: flex; align-items: flex-start; gap: 9px; padding: 8px 9px; border-radius: 9px; text-align: left; width: 100%; transition: background .15s; }
  .inf-fila:hover { background: var(--tint); }
  .inf-fila[aria-pressed="true"] { background: var(--wine-wash); }
  .inf-fila .caja { width: 17px; height: 17px; flex: none; margin-top: 1px; border-radius: 5px; border: 1.5px solid var(--tint-strong); display: grid; place-items: center; }
  .inf-fila[aria-pressed="true"] .caja { background: var(--wine); border-color: var(--wine); color: var(--wine-fg); }
  .inf-fila .caja .ic { width: 10px; height: 10px; }
  .inf-fila-txt { flex: 1; min-width: 0; }
  .inf-fila-txt b { display: block; font-size: 13px; font-weight: 600; color: var(--ink-body); }
  .inf-fila-txt span { display: block; margin-top: 1px; font-size: 11px; color: var(--ink-faint); }
  .inf-vista { border-radius: var(--r-xl); padding: 18px; }
  .inf-marco { border-radius: var(--r-lg); overflow: hidden; }

  /* El informe se exporta como imagen: colores fijos, sin variables,
     porque html2canvas rasteriza lo que ve y no resuelve el tema. */
  .doc { width: 100%; max-width: 640px; margin: 0 auto; background: #5c1a2e; color: #f7ece6; padding: 34px 32px 28px; font-family: "Inter", sans-serif; }
  .doc-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; padding-bottom: 20px; border-bottom: 1px solid rgba(212,168,83,.3); }
  .doc-emoji { font-size: 30px; line-height: 1; }
  .doc-cli { margin-top: 10px; font-family: "DM Serif Display", Georgia, serif; font-size: 30px; line-height: 1.1; color: #f7ece6; }
  .doc-periodo { margin-top: 5px; font-size: 12.5px; color: rgba(212,168,83,.9); }
  .doc-logo { text-align: right; font-size: 11px; line-height: 1.5; color: rgba(247,236,230,.55); letter-spacing: .06em; text-transform: uppercase; }
  .doc-logo b { display: block; font-family: "DM Serif Display", Georgia, serif; font-size: 15px; text-transform: none; letter-spacing: 0; color: #d4a853; }
  .doc-sec { margin-top: 22px; }
  .doc-lbl { font-size: 10.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: rgba(212,168,83,.85); margin-bottom: 9px; }
  .doc-texto { font-size: 14px; line-height: 1.65; color: rgba(247,236,230,.92); white-space: pre-line; }
  .doc-tarea { display: flex; align-items: flex-start; gap: 11px; padding: 9px 0; border-bottom: 1px solid rgba(247,236,230,.08); }
  .doc-tarea:last-child { border-bottom: 0; }
  .doc-caja { width: 16px; height: 16px; flex: none; margin-top: 2px; border-radius: 5px; border: 1.5px solid rgba(212,168,83,.5); }
  .doc-caja.done { background: #d4a853; border-color: #d4a853; }
  .doc-tarea-txt { flex: 1; min-width: 0; font-size: 13.5px; color: #f7ece6; }
  .doc-tarea-txt.done { color: rgba(247,236,230,.6); }
  .doc-tarea-fecha { margin-top: 2px; font-size: 11px; color: rgba(212,168,83,.75); }
  .doc-pie { margin-top: 24px; padding-top: 14px; border-top: 1px solid rgba(212,168,83,.25); font-size: 10.5px; color: rgba(247,236,230,.45); display: flex; justify-content: space-between; gap: 10px; }

  /* ---------- ajustes ---------- */
  .rows { border-radius: var(--r-xl); overflow: hidden; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 16px; }
  .row + .row { border-top: 1px solid var(--ring); }
  .row-label { font-size: 14px; font-weight: 600; letter-spacing: -0.2px; color: var(--ink-body); }
  .row-desc { margin-top: 3px; font-size: 12.5px; color: var(--ink-soft); max-width: 46ch; }
  .nota { border-radius: var(--r-lg); padding: 14px 16px; font-size: 13px; line-height: 1.6; color: var(--ink-soft); border: 1px solid var(--gold); background: var(--gold-wash); }
  .nota b { color: var(--ink-body); }
  .nota code { font-family: ui-monospace, Menlo, monospace; font-size: 12px; background: var(--tint); padding: 1px 5px; border-radius: 5px; }
  .backup-area { width: 100%; min-height: 130px; resize: vertical; padding: 11px; border: 1px solid var(--hairline); border-radius: 11px; background: var(--canvas); color: var(--ink-body); font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; }

  /* ---------- diálogo ---------- */
  dialog {
    width: min(500px, calc(100% - 24px)); max-height: 88dvh; padding: 0;
    border: 1px solid var(--glass-edge); border-radius: var(--r-xl);
    background: linear-gradient(to bottom right, var(--glass-a), var(--glass-b));
    backdrop-filter: blur(50px) saturate(1.6); -webkit-backdrop-filter: blur(50px) saturate(1.6);
    box-shadow: var(--glass-inset), 0 0 0 1px var(--ring), var(--shadow-lift);
    color: var(--ink-body); overflow: auto;
    animation: pop-in .28s cubic-bezier(0.16, 1, 0.3, 1);
  }
  dialog::backdrop { background: rgba(30, 18, 14, .35); backdrop-filter: blur(3px); }
  .dlg-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; padding: 18px 18px 0; }
  .dlg-title { font-family: var(--font-display); font-size: 20px; font-weight: 400; color: var(--ink); line-height: 1.2; }
  .dlg-desc { margin-top: 5px; font-size: 13px; color: var(--ink-soft); }
  .dlg-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 13px; }
  .dlg-foot { display: flex; gap: 8px; justify-content: flex-end; align-items: center; padding: 0 18px 18px; flex-wrap: wrap; }
  .dlg-foot .spacer { margin-right: auto; }

  /* ---------- Taski ---------- */
  .taski-fab {
    position: fixed; right: 18px; z-index: 55;
    bottom: calc(84px + env(safe-area-inset-bottom, 0px));
    width: 54px; height: 54px; border-radius: 50%;
    display: grid; place-items: center; color: var(--gold-bright);
    background: linear-gradient(to bottom right, var(--wine), var(--wine-deep));
    box-shadow: inset 0 3px 5px rgba(255,255,255,.14), 0 14px 30px -6px rgba(92,26,46,.5);
    transition: transform .2s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .taski-fab:hover { transform: scale(1.06); }
  .taski-fab:active { transform: scale(.96); }
  .taski-fab .ic { width: 24px; height: 24px; }
  @media (min-width: 960px) { .taski-fab { bottom: 24px; right: 24px; } }

  .taski-panel {
    position: fixed; z-index: 56; left: 12px; right: 12px;
    bottom: calc(148px + env(safe-area-inset-bottom, 0px));
    max-height: min(70dvh, 560px); display: flex; flex-direction: column; overflow: hidden;
    border-radius: var(--r-xl); animation: pop-in .28s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @media (min-width: 960px) { .taski-panel { left: auto; right: 24px; bottom: 90px; width: 420px; } }
  .taski-head { display: flex; align-items: center; gap: 11px; padding: 14px 16px; border-bottom: 1px solid var(--ring); }
  .taski-name { font-family: var(--font-display); font-size: 19px; color: var(--ink); line-height: 1.1; }
  .taski-sub { margin-top: 1px; font-size: 11.5px; color: var(--ink-soft); }
  .taski-log { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 88%; padding: 10px 13px; border-radius: 16px; font-size: 13px; line-height: 1.55; white-space: pre-line; }
  .msg.me { margin-left: auto; background: var(--wine); color: var(--wine-fg); border-bottom-right-radius: 6px; box-shadow: var(--wine-glow); }
  .msg.it { background: var(--tint); color: var(--ink-body); border-bottom-left-radius: 6px; }
  .taski-form { position: relative; padding: 11px; border-top: 1px solid var(--ring); }

<script>
/* Red de seguridad, en JavaScript de toda la vida y fuera del módulo: si el
   módulo principal no llega a ejecutarse (un import que no baja, sintaxis que
   el navegador del teléfono no entiende, almacenamiento bloqueado), sin esto
   la pantalla de entrada queda muerta y sin una sola pista de por qué. */
(function () {
  var avisado = false;
  function avisar(texto) {
    if (avisado) return;
    avisado = true;
    var caja = document.getElementById("lock-error");
    if (caja) caja.textContent = "No cargó del todo: " + texto;
    var btn = document.getElementById("lock-btn");
    if (btn) { btn.disabled = false; btn.textContent = "Entrar"; }
  }
  window.addEventListener("error", function (e) {
    // Los fallos de recursos (una fuente, un icono) no traen mensaje y no
    // rompen nada: esos se ignoran.
    if (e && e.message) avisar(e.message);
  });
  window.addEventListener("unhandledrejection", function (e) {
    var r = e && e.reason;
    avisar((r && r.message) || String(r));
  });

  // Abierta como archivo suelto (file://) el módulo ni arranca: los import
  // están prohibidos ahí. Mejor decirlo que dejar la pantalla muerta.
  if (location.protocol === "file:") {
    avisar("esta copia está abierta como archivo suelto. Entrá por el link de la app, no por el archivo descargado.");
  }

  /* El service worker es lo que hace que la app instalada abra sin depender
     de la señal del momento. Se registra desde acá, fuera del módulo, para
     que funcione incluso si el módulo principal falla. */
  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () { /* sin caché, la app igual anda */ });
    });
  }
})();
</script>

    if (antes.endsWith(" " + w) || antes === w) return { start: antes.length - w.length, end: span.end };
  }
  return span;
}
function matchSpan(folded, re) {
  const m = folded.match(re);
  if (!m || m.index === undefined) return null;
  return { m, span: { start: m.index, end: m.index + m[0].length } };
}

function findCliente(folded, clientes) {
  const orden = clientes.slice().sort((a, b) => b.nombre.length - a.nombre.length);
  for (const c of orden) {
    const aguja = fold(c.nombre);
    if (aguja.length < 3) continue;
    const i = folded.indexOf(aguja);
    if (i !== -1) return { id: c.id, span: { start: i, end: i + aguja.length } };
  }
  return null;
}

function findFecha(folded) {
  const hoy = today();
  // El orden importa: "pasado mañana" va antes que "mañana", si no
  // \bmanana\b coincide adentro y la tarea cae un día antes.
  const simples = [
    [/\bpasado manana\b/, () => addDays(hoy, 2)],
    [/\bhoy\b/, () => hoy],
    [/\bmanana\b/, () => addDays(hoy, 1)],
    [/\b(la semana que viene|la proxima semana|la semana proxima)\b/, () => addDays(hoy, 7)],
    [/\b(el mes que viene|el proximo mes)\b/, () => addMonths(hoy, 1)],
    [/\b(este finde|el finde|fin de semana)\b/, () => addDays(hoy, (6 - dow(hoy) + 7) % 7)],
  ];
  for (const [re, resolver] of simples) {
    const hit = matchSpan(folded, re);
    if (hit) return { fecha: resolver(), span: hit.span };
  }
  const enDias = matchSpan(folded, /\ben (\d{1,2}) dias?\b/);
  if (enDias) return { fecha: addDays(hoy, Number(enDias.m[1])), span: enDias.span };

  const conMes = matchSpan(folded, new RegExp("\\b(\\d{1,2}) de (" + Object.keys(MES_NUM).join("|") + ")\\b"));
  if (conMes) {
    const base = parseDay(hoy);
    let cand = toDay(new Date(base.getFullYear(), MES_NUM[conMes.m[2]], Number(conMes.m[1])));
    if (cand < hoy) cand = toDay(new Date(base.getFullYear() + 1, MES_NUM[conMes.m[2]], Number(conMes.m[1])));
    return { fecha: cand, span: conMes.span };
  }
  const num = matchSpan(folded, /\b(\d{1,2})[/-](\d{1,2})(?:[/-](\d{2,4}))?\b/);
  if (num) {
    const d = Number(num.m[1]), mo = Number(num.m[2]) - 1;
    const base = parseDay(hoy);
    let y = num.m[3] ? Number(num.m[3]) : base.getFullYear();
    if (y < 100) y += 2000;
    if (mo >= 0 && mo <= 11 && d >= 1 && d <= 31) {
      let cand = toDay(new Date(y, mo, d));
      if (!num.m[3] && cand < hoy) cand = toDay(new Date(y + 1, mo, d));
      return { fecha: cand, span: num.span };
    }
  }
  for (const [nombre, idx] of SEMANA) {
    const hit = matchSpan(folded, new RegExp("\\b(el |este |proximo |el proximo )?" + nombre + "( que viene)?\\b"));
    if (!hit) continue;
    const forzar = Boolean(hit.m[2]) || /proximo/.test(hit.m[1] || "");
    let delta = idx - dow(hoy);
    if (delta < 0) delta += 7;
    if (delta === 0 && forzar) delta = 7;
    return { fecha: addDays(hoy, delta), span: hit.span };
  }
  return null;
}

function findHora(folded) {
  const armar = (h, m) => String(Math.min(h, 23)).padStart(2, "0") + ":" + String(Math.min(m, 59)).padStart(2, "0");
  const ajustar = (h, suf) => {
    if (suf === "pm" && h < 12) return h + 12;
    if (suf === "am" && h === 12) return 0;
    if (!suf && h >= 1 && h <= 7 && /\b(tarde|de la tarde|a la tarde)\b/.test(folded)) return h + 12;
    return h;
  };
  const mediodia = matchSpan(folded, /\b(al |a la |el )?mediodia\b/);
  if (mediodia) return { hora: "12:00", span: mediodia.span };
  const una = matchSpan(folded, /\ba la una\b/);
  if (una) return { hora: "13:00", span: una.span };
  const media = matchSpan(folded, /\ba las (\d{1,2}) y (media|cuarto)\b/);
  if (media) return { hora: armar(ajustar(Number(media.m[1])), media.m[2] === "media" ? 30 : 15), span: media.span };
  const alas = matchSpan(folded, /\ba las (\d{1,2})(?::(\d{2}))?\s?(am|pm|hs|h)?\b/);
  if (alas) return { hora: armar(ajustar(Number(alas.m[1]), alas.m[3]), Number(alas.m[2] || 0)), span: alas.span };
  const conHs = matchSpan(folded, /\b(\d{1,2})(?::(\d{2}))?\s?(hs|h|am|pm)\b/);
  if (conHs) return { hora: armar(ajustar(Number(conHs.m[1]), conHs.m[3]), Number(conHs.m[2] || 0)), span: conHs.span };
  const reloj = matchSpan(folded, /\b([01]?\d|2[0-3]):([0-5]\d)\b/);
  if (reloj) return { hora: armar(Number(reloj.m[1]), Number(reloj.m[2])), span: reloj.span };
  return null;
}

function findSeccion(folded) {
  for (const [sec, claves] of SEC_CLAVES) {
    if (claves.some((k) => folded.includes(k))) return { seccion: sec, matched: true };
  }
  return { seccion: "trabajo", matched: false };
}
function findPrioridad(folded) {
  const alta = matchSpan(folded, /\b(urgentisimo|urgente|prioridad alta|ya mismo|cuanto antes|si o si)\b/);
  if (alta) return { prio: "alta", matched: true, span: alta.span };
  const baja = matchSpan(folded, /\b(sin apuro|cuando puedas|cuando pueda|no es urgente|prioridad baja|algun dia)\b/);
  if (baja) return { prio: "baja", matched: true, span: baja.span };
  return { prio: "media", matched: false, span: null };
}

function armarTexto(original, spans) {
  const unidos = [];
  spans.slice().sort((a, b) => a.start - b.start).forEach((s) => {
    const last = unidos[unidos.length - 1];
    if (last && s.start <= last.end) last.end = Math.max(last.end, s.end);
    else unidos.push({ start: s.start, end: s.end });
  });
  let txt = original;
  unidos.slice().reverse().forEach((s) => { txt = txt.slice(0, s.start) + " " + txt.slice(s.end); });
  let out = txt.replace(/\s{2,}/g, " ").trim();
  let cambio = true;
  while (cambio) {
    cambio = false;
    const low = fold(out);
    for (const p of MULETILLAS) {
      if (low.startsWith(p)) { out = out.slice(p.length).trim(); cambio = true; break; }
    }
  }
  out = out.replace(/^[,:;.\-–—\s]+/, "").replace(/[,:;\-–—\s]+$/, "").replace(/\s{2,}/g, " ").trim();
  const palabras = out.split(" ");
  while (palabras.length > 1 && COLGANTES.includes(fold(palabras[palabras.length - 1]))) palabras.pop();
  out = palabras.join(" ");
  if (!out) return "Nueva tarea";
  return out.charAt(0).toUpperCase() + out.slice(1);
}

function interpretar(texto, clientes) {
  const original = texto.trim();
  const folded = fold(original);
  const cli = findCliente(folded, clientes);
  const fec = findFecha(folded);
  const hor = findHora(folded);
  const sec = findSeccion(folded);
  const pri = findPrioridad(folded);

  const spans = [];
  if (cli) spans.push(widenLeft(folded, cli.span));
  if (fec) spans.push(widenLeft(folded, fec.span));
  if (hor) spans.push(widenLeft(folded, hor.span));
  // La palabra de urgencia ya quedó guardada en la prioridad: repetirla en
  // el título ("Urgente pagar el monotributo") sobra.
  if (pri.span) spans.push(pri.span);

  return {
    draft: {
      texto: armarTexto(original, spans),
      clienteId: cli ? cli.id : null,
      seccion: cli ? "trabajo" : sec.seccion,
      prio: pri.prio,
      fecha: fec ? fec.fecha : today(),
      hora: hor ? hor.hora : null,
    },
    deducido: {
      cliente: Boolean(cli),
      fecha: Boolean(fec),
      hora: Boolean(hor),
      seccion: sec.matched,
      prio: pri.matched,
    },
  };
}

/** Un await sin límite es un cuelgue esperando su turno: con señal pobre el
    import del SDK puede no resolver nunca —no falla, simplemente no vuelve—
    y la pantalla de entrada se queda congelada. Todo lo que sale a la red
    lleva reloj. */
function conLimite(promesa, ms, mensaje) {
  return new Promise((resolve, reject) => {
    const reloj = setTimeout(() => reject(new Error(mensaje)), ms);
    promesa.then(
      (v) => { clearTimeout(reloj); resolve(v); },
      (e) => { clearTimeout(reloj); reject(e); }
    );
  });
}

/** Firebase se carga por import dinámico y una sola vez. Si no llega a
    cargar (sin internet, red bloqueada), la app puede seguir contra la copia
    local en vez de quedarse en blanco. */
let fb = null;

async function cargarFirebase() {
  if (fb) return fb;
  const [appMod, authMod, dbMod] = await conLimite(
    Promise.all([
      import(SDK + "firebase-app.js"),
      import(SDK + "firebase-auth.js"),
      import(SDK + "firebase-database.js"),
    ]),
    ESPERA_SDK,
    "El SDK de Firebase tardó demasiado en bajar."
  );
  const app = appMod.initializeApp(FIREBASE_CONFIG);
  const auth = authMod.getAuth(app);
  // La sesión queda guardada en este navegador: no hay que entrar cada vez.
  try { await authMod.setPersistence(auth, authMod.browserLocalPersistence); } catch (e) { /* queda en memoria */ }
  fb = { authMod, dbMod, app, auth };
  return fb;
}

/** Se suscribe a la base ya con el usuario autenticado. Las reglas exigen

function escucharDatos(alCargar) {
  if (!fb || desuscribir) return;
  const { dbMod } = fb;
  const nodo = dbMod.ref(dbMod.getDatabase(fb.app), "panel");
  escribirRemoto = (d) => dbMod.set(nodo, d);

  let primera = true;
  desuscribir = dbMod.onValue(

    (snap) => {

      if (remoto) datos = normalizar(remoto);

      if (primera) { primera = false; alCargar(); }
      else alCargar(true);
    },
    (err) => {

  );
}

/* ---------- consultas ---------- */
const clientePorId = (id) => datos.clientes.find((c) => c.id === id) || null;
const nombreCliente = (id) => { const c = clientePorId(id); return c ? c.nombre : ""; };
const emojiCliente = (id) => { const c = clientePorId(id); return c && c.emoji ? c.emoji : "🏢"; };

/** Las dos listas se muestran juntas, así que se normalizan a una forma
    común. La clave lleva el tipo porque los ids de cada lista son
    independientes y podrían repetirse. */
function todas() {
  const generales = datos.tareas.map((t) => ({
    key: "g:" + t.id, tipo: "general", id: t.id,
    texto: t.texto, done: Boolean(t.done), fecha: t.fecha || null, hora: t.hora || null,
    prio: t.prio || "media", seccion: t.seccion || "otro", clienteId: null,
  }));
  const deClientes = datos.tareasCliente.map((t) => ({
    key: "c:" + t.id, tipo: "cliente", id: t.id,
    texto: t.texto, done: Boolean(t.done), fecha: t.fecha || null, hora: t.hora || null,
    prio: t.prio || "media", seccion: "trabajo", clienteId: t.clienteId,
  }));
  return generales.concat(deClientes);
}

function ordenar(lista) {
  return lista.slice().sort((a, b) => {
    if (a.done !== b.done) return a.done ? 1 : -1;
    if (a.fecha && b.fecha) {
      if (a.fecha !== b.fecha) return a.fecha < b.fecha ? -1 : 1;
      if (a.hora && b.hora && a.hora !== b.hora) return a.hora < b.hora ? -1 : 1;
      if (a.hora && !b.hora) return -1;
      if (!a.hora && b.hora) return 1;
    } else if (a.fecha) return -1;
    else if (b.fecha) return 1;
    return PRIO_ORD[a.prio] - PRIO_ORD[b.prio];
  });
}

const abiertas = () => todas().filter((t) => !t.done);
const vencidas = () => ordenar(abiertas().filter((t) => t.fecha && isPast(t.fecha)));
const deHoy = () => ordenar(abiertas().filter((t) => t.fecha && isToday(t.fecha)));
const proximas = () => ordenar(abiertas().filter((t) => t.fecha && !isPast(t.fecha) && !isToday(t.fecha)));
const delDia = (d) => ordenar(todas().filter((t) => t.fecha === d));
const delCliente = (id) => ordenar(todas().filter((t) => t.clienteId === id));

function recordatorios() {
  return deHoy()
    .filter((t) => t.hora)
    .map((t) => ({ t, min: minutesUntil(t.fecha, t.hora) }))
    .filter((x) => x.min >= 0 && x.min <= 60)
    .sort((a, b) => a.min - b.min);
}

const sinTildes = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
function buscar(q) {
  const term = sinTildes(q.trim());
  if (!term) return { tareas: [], clientes: [] };
  const palabras = term.split(/\s+/);
  const tareas = ordenar(todas().filter((t) => {
    const heno = sinTildes([t.texto, t.seccion, nombreCliente(t.clienteId)].join(" "));
    return palabras.every((w) => heno.includes(w));
  }));
  const clientes = datos.clientes.filter((c) => sinTildes(c.nombre).includes(term));
  return { tareas, clientes };
}

/* ---------- mutaciones ---------- */
function nuevaTarea(d) {
  if (d.clienteId) {
    const t = {
      id: datos.nextCliId++, clienteId: d.clienteId, texto: d.texto.trim(),
      done: false, fecha: d.fecha || null, hora: d.hora || null, prio: d.prio || "media",
    };
    datos.tareasCliente.push(t);
  } else {
    const t = {
      id: datos.nextId++, texto: d.texto.trim(), seccion: d.seccion || "otro",
      done: false, prio: d.prio || "media", fecha: d.fecha || today(), hora: d.hora || null,
    };
    datos.tareas.push(t);
  }
  guardar();
}

const bruta = (item) =>
  item.tipo === "cliente"
    ? datos.tareasCliente.find((t) => t.id === item.id)
    : datos.tareas.find((t) => t.id === item.id);

function marcar(item) {
  const t = bruta(item);
  if (!t) return false;
  t.done = !t.done;
  t.doneAt = t.done ? new Date().toISOString() : null;
  guardar();
  return t.done;
}

function editar(item, d) {
  const t = bruta(item);
  if (!t) return;
  const cambiaDeLista = (item.tipo === "cliente") !== Boolean(d.clienteId);
  if (cambiaDeLista) {
    // Mover entre listas: se borra de una y se crea en la otra, conservando
    // el estado de completada.
    quitar(item);
    if (d.clienteId) {
      datos.tareasCliente.push({
        id: datos.nextCliId++, clienteId: d.clienteId, texto: d.texto.trim(),
        done: t.done, fecha: d.fecha || null, hora: d.hora || null, prio: d.prio || "media",
      });
    } else {
      datos.tareas.push({
        id: datos.nextId++, texto: d.texto.trim(), seccion: d.seccion || "otro",
        done: t.done, prio: d.prio || "media", fecha: d.fecha || today(), hora: d.hora || null,
      });
    }
    guardar();
    return;
  }
  t.texto = d.texto.trim();
  t.fecha = d.fecha || null;
  t.hora = d.hora || null;
  t.prio = d.prio || "media";
  if (item.tipo === "cliente") t.clienteId = d.clienteId;
  else t.seccion = d.seccion || "otro";
  guardar();
}

function quitar(item) {
  if (item.tipo === "cliente") datos.tareasCliente = datos.tareasCliente.filter((t) => t.id !== item.id);
  else datos.tareas = datos.tareas.filter((t) => t.id !== item.id);
  guardar();
}

function restaurar(item, crudo) {
  if (item.tipo === "cliente") datos.tareasCliente.push(crudo);
  else datos.tareas.push(crudo);
  guardar();
}

/* ---------- Taski responde ----------
   Con lo que hay guardado acá: no hay modelo ni conexión externa. */
function lineaTarea(t, conCliente) {
  const nombre = conCliente === false ? "" : nombreCliente(t.clienteId);
  const cuando = t.fecha ? friendlyDate(t.fecha) + (t.hora ? " " + t.hora : "") : "sin fecha";
  return "• " + t.texto + (nombre ? " (" + nombre + ")" : "") + " — " + cuando;
}
const listar = (l, conCliente) => l.map((t) => lineaTarea(t, conCliente)).join("\n");

function taskiResponde(pregunta) {
  const q = fold(pregunta);
  const sueltas = abiertas();

  const c = datos.clientes.slice().sort((a, b) => b.nombre.length - a.nombre.length)
    .find((x) => fold(x.nombre).length >= 3 && q.includes(fold(x.nombre)));

  if (c) {
    const suyas = sueltas.filter((t) => t.clienteId === c.id);
    if (/vencid|atrasad/.test(q)) {
      const v = suyas.filter((t) => t.fecha && isPast(t.fecha));
      return v.length
        ? "De " + c.nombre + " tenés " + plural(v.length, "tarea vencida", "tareas vencidas") + ":\n\n" + listar(ordenar(v), false)
        : "No tenés nada vencido de " + c.nombre + ".";
    }
    if (/\bhoy\b/.test(q)) {
      const h = suyas.filter((t) => t.fecha && isToday(t.fecha));
      return h.length
        ? "Hoy tenés " + plural(h.length, "tarea", "tareas") + " de " + c.nombre + ":\n\n" + listar(ordenar(h), false)
        : "Hoy no tenés nada de " + c.nombre + ".";
    }
    return suyas.length
      ? "Tenés " + plural(suyas.length, "tarea pendiente", "tareas pendientes") + " de " + c.nombre + ":\n\n" + listar(ordenar(suyas), false)
      : "No tenés tareas pendientes de " + c.nombre + ".";
  }

  if (/vencid|atrasad/.test(q)) {
    const v = vencidas();
    return v.length ? "Tenés " + plural(v.length, "tarea vencida", "tareas vencidas") + ":\n\n" + listar(v) : "No tenés nada vencido. Vas al día.";
  }
  if (/hice|complet|termin|cerre/.test(q)) {
    const semana = weekOf(today());
    const hechas = todas().filter((t) => {
      if (!t.done) return false;
      const cruda = bruta(t);
      const cuando = cruda && cruda.doneAt ? cruda.doneAt.slice(0, 10) : t.fecha;
      return cuando && semana.indexOf(cuando) !== -1;
    });
    return hechas.length
      ? "Esta semana cerraste " + plural(hechas.length, "tarea", "tareas") + ":\n\n" + listar(hechas)
      : "Todavía no marcaste ninguna tarea como completada esta semana.";
  }
  if (/\bmanana\b/.test(q)) {
    const m = delDia(addDays(today(), 1)).filter((t) => !t.done);
    return m.length ? "Mañana tenés " + plural(m.length, "tarea", "tareas") + ":\n\n" + listar(m) : "Mañana no tenés nada agendado.";
  }
  if (/\bhoy\b/.test(q)) {
    const h = deHoy();
    return h.length ? "Hoy tenés " + plural(h.length, "tarea", "tareas") + ":\n\n" + listar(h) : "Hoy no tenés tareas. Buen momento para adelantar algo.";
  }
  if (/semana/.test(q)) {
    const semana = weekOf(today());
    const dela = ordenar(sueltas.filter((t) => t.fecha && semana.indexOf(t.fecha) !== -1));
    return dela.length ? "Esta semana tenés " + plural(dela.length, "tarea", "tareas") + ":\n\n" + listar(dela) : "No tenés nada agendado para esta semana.";
  }
  if (/client/.test(q)) {
    if (!datos.clientes.length) return "Todavía no cargaste ningún cliente. Agregalos desde la pestaña Clientes.";
    const resumen = datos.clientes.map((cl) => {
      const p = sueltas.filter((t) => t.clienteId === cl.id).length;
      return "• " + (cl.emoji || "🏢") + " " + cl.nombre + " — " + plural(p, "pendiente", "pendientes");
    }).join("\n");
    return "Tenés " + plural(datos.clientes.length, "cliente", "clientes") + ":\n\n" + resumen;
  }
  if (/pendient|que tengo|falta|proxim|sigue/.test(q)) {
    const p = ordenar(sueltas).slice(0, 8);
    return p.length ? "Tus próximas tareas:\n\n" + listar(p) : "No tenés tareas pendientes. Estás al día.";
  }
  return [
    "Esa no la entendí. Probá con algo así:",
    "",
    "• ¿Qué tengo hoy?",
    "• ¿Qué tengo pendiente de <cliente>?",
    "• ¿Qué está vencido?",
    "• ¿Qué hice esta semana?",
  ].join("\n");
}

function filaTarea(t, opts) {
  const o = opts || {};
  const vencida = !t.done && t.fecha && isPast(t.fecha);
  const esHoy = !t.done && t.fecha && isToday(t.fecha);
  const cli = !o.ocultarCliente && t.clienteId ? clientePorId(t.clienteId) : null;
  const cuando = t.fecha
    ? '<span class="when ' + (vencida ? "vencida" : esHoy ? "hoy" : "") + '">' +
      esc(friendlyDate(t.fecha)) + (t.hora ? " · " + esc(t.hora) : "") + (vencida ? " · vencida" : "") + "</span>"
    : "";
  return (
    '<div class="task" data-done="' + (t.done ? 1 : 0) + '">' +
      '<button type="button" class="check" data-done="' + (t.done ? 1 : 0) + '" data-a="marcar" data-k="' + t.key + '" ' +
        'aria-label="' + (t.done ? "Marcar como pendiente" : "Completar") + ': ' + esc(t.texto) + '">' +
        (t.done ? icon("check") : "") + "</button>" +
      '<button type="button" class="task-body" data-a="editar" data-k="' + t.key + '" aria-label="Editar: ' + esc(t.texto) + '">' +
        '<p class="task-title">' + esc(t.texto) + "</p>" +
        '<div class="meta">' +
          (cli ? '<span class="cli">' + esc(cli.emoji || "🏢") + " " + esc(cli.nombre) + "</span>" : "") +
          (t.tipo === "general" && !o.ocultarSeccion ? '<span class="tag">' + esc((SECCIONES.find((s) => s.id === t.seccion) || { label: "Otro" }).label) + "</span>" : "") +
          cuando +
          '<span class="prio ' + t.prio + '">' + t.prio + "</span>" +
        "</div>" +
      "</button>" +
      '<div class="task-side">' +
        '<button type="button" class="icon-btn danger" data-a="borrar" data-k="' + t.key + '" title="Eliminar" aria-label="Eliminar: ' + esc(t.texto) + '">' +
          icon("trash") + "</button>" +
      "</div>" +
    "</div>"
  );
}

const listaTareas = (l, o) =>
  l.length ? '<div class="list">' + l.map((t) => filaTarea(t, o)).join("") + "</div>"
           : vacio((o && o.vacio) || "No hay tareas acá", o && o.vacioDetalle);

function tarjetaFlotante(tono, ico, arriba, abajo, flote, extra) {
  return (
    '<div class="float-card glass ' + (flote || "") + '">' +
      '<span class="bead-icon bead-' + tono + '">' + icon(ico) + "</span>" +
      '<span class="fc-text"><span class="fc-1">' + esc(arriba) + "</span>" +
        '<span class="fc-2">' + esc(abajo) + "</span></span>" +
      (extra || "") + "</div>"

}

function camposTarea(d, deducido, destino) {
  const g = deducido || {};
  const marca = (k) => (g[k] ? '<span class="guessed" title="Lo deduje del texto"></span>' : "");
  const p = destino + "-";
  const opcCli = ['<option value=""' + (d.clienteId ? "" : " selected") + ">Sin cliente (tarea propia)</option>"]
    .concat(datos.clientes.map((c) =>
      '<option value="' + c.id + '"' + (d.clienteId === c.id ? " selected" : "") + ">" + esc((c.emoji || "🏢") + " " + c.nombre) + "</option>"))
    .join("");
  const opcSec = SECCIONES.map((s) =>
    '<option value="' + s.id + '"' + (d.seccion === s.id ? " selected" : "") + ">" + s.label + "</option>").join("");
  return (
    '<div class="field"><label for="' + p + 'texto">Tarea</label>' +
      '<input id="' + p + 'texto" data-f="texto" data-target="' + destino + '" value="' + esc(d.texto) + '" placeholder="¿Qué hay que hacer?" /></div>' +
    '<div class="grid2">' +
      '<div class="field"><label for="' + p + 'cli">Cliente' + marca("cliente") + "</label>" +
        '<select id="' + p + 'cli" data-f="clienteId" data-target="' + destino + '">' + opcCli + "</select></div>" +
      '<div class="field"><label for="' + p + 'sec">Área' + marca("seccion") + "</label>" +
        '<select id="' + p + 'sec" data-f="seccion" data-target="' + destino + '"' + (d.clienteId ? " disabled" : "") + ">" + opcSec + "</select></div>" +
    "</div>" +
    '<div class="grid2">' +
      '<div class="field"><label for="' + p + 'fecha">Fecha' + marca("fecha") + "</label>" +
        '<input id="' + p + 'fecha" type="date" data-f="fecha" data-target="' + destino + '" value="' + esc(d.fecha || "") + '" /></div>' +
      '<div class="field"><label for="' + p + 'hora">Hora' + marca("hora") + "</label>" +
        '<input id="' + p + 'hora" type="time" data-f="hora" data-target="' + destino + '" value="' + esc(d.hora || "") + '" /></div>' +
    "</div>" +
    '<div class="field"><span class="label">Prioridad' + marca("prio") + "</span>" +

          (d.prio === x.value) + '">' + x.label + "</button>").join("") +
    "</div></div>"
  );
}

/* La frase se elige por día del año, no al azar: si cambiara en cada
   render, parpadearía cada vez que marcás una tarea. */
function saludoDelMomento() {
  const ahora = new Date();
  const f = FRANJAS.find((x) => ahora.getHours() < x.hasta) || FRANJAS[FRANJAS.length - 1];
  const dia = Math.floor((ahora - new Date(ahora.getFullYear(), 0, 0)) / 86400000);
  return { saludo: f.saludo, frase: f.frases[dia % f.frases.length] };
}

    '<header style="display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap">' +

        '<p class="sub">' + (datos.clientes.length ? plural(datos.clientes.length, "cliente", "clientes") + " en cartera" : "Todavía no cargaste ninguno") + "</p></div>" +
      '<button type="button" class="btn btn-primary btn-bead" data-a="nuevo-cliente">Nuevo cliente<span class="bead">' + icon("plus") + "</span></button>" +

}

/* ---------- Panel del cliente ---------- */
function vistaCliente() {
  const c = clientePorId(estado.clienteId);
  if (!c) {
    return '<button type="button" class="btn btn-quiet" data-a="ir" data-v="clientes">' + icon("back") + "Clientes</button>" +
      vacio("No encontramos ese cliente");
  }
  const suyas = delCliente(c.id);
  const pend = suyas.filter((t) => !t.done);
  const hechas = suyas.filter((t) => t.done);
  const venc = pend.filter((t) => t.fecha && isPast(t.fecha));
  const prox = pend.find((t) => t.fecha && !isPast(t.fecha)) || null;
  const pct = suyas.length ? Math.round((hechas.length / suyas.length) * 100) : 0;

  const visibles =
    estado.pestana === "completadas" ? hechas :
    estado.pestana === "todas" ? suyas : pend;

  const pestanas = [["pendientes", "Pendientes", pend.length], ["completadas", "Completadas", hechas.length], ["todas", "Todas", suyas.length]];

  return (
    "<header>" +
      '<button type="button" class="btn btn-quiet" style="padding:0 8px;margin-left:-8px" data-a="ir" data-v="clientes">' + icon("back") + "Clientes</button>" +
      '<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:12px">' +
        '<span class="cli-emoji" style="width:56px;height:56px;border-radius:18px;font-size:28px">' + esc(c.emoji || "🏢") + "</span>" +
        '<div style="flex:1;min-width:180px"><h1>' + esc(c.nombre) + "</h1>" +
          '<p class="sub">' + plural(pend.length, "tarea pendiente", "tareas pendientes") +
          (venc.length ? " · " + venc.length + " vencida" + (venc.length === 1 ? "" : "s") : "") + "</p></div>" +
        '<div style="display:flex;align-items:center;gap:6px;flex:none;flex-wrap:wrap">' +
          '<button type="button" class="icon-btn" data-a="editar-cliente" title="Editar cliente" aria-label="Editar cliente">' + icon("pencil") + "</button>" +
          '<button type="button" class="icon-btn danger" data-a="eliminar-cliente" title="Eliminar cliente" aria-label="Eliminar cliente">' + icon("trash") + "</button>" +
          '<button type="button" class="btn btn-soft" data-a="informe-cliente">' + icon("report") + "Informe</button>" +
          '<button type="button" class="btn btn-primary" data-a="nueva-tarea-cliente">' + icon("plus") + "Nueva tarea</button>" +
        "</div>" +
      "</div>" +
    "</header>" +

    '<div class="stats">' +
      '<div class="stat glass"><b class="num">' + pend.length + "</b><span>Pendientes</span></div>" +
      '<div class="stat glass ' + (venc.length ? "alerta" : "") + '"><b class="num">' + venc.length + "</b><span>Vencidas</span></div>" +
      '<div class="stat glass acento"><b class="num">' + hechas.length + "</b><span>Completadas</span></div>" +
      '<div class="stat glass"><b class="num">' + pct + "%</b><span>Avance</span></div>" +
    "</div>" +

    '<div class="card glass" style="display:flex;flex-direction:column;gap:10px">' +
      '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">' +
        '<span class="eyebrow">Próxima entrega</span>' +
        (prox ? '<span style="font-size:12.5px;font-weight:700;color:var(--wine-ink)">' + esc(friendlyDate(prox.fecha)) + "</span>" : "") + "</div>" +
      '<p style="font-size:14.5px;color:var(--ink-body);font-weight:600">' +
        (prox ? esc(prox.texto) : "Sin entregas agendadas") + "</p>" +
      '<div class="barra"><i style="width:' + pct + '%"></i></div>' +
    "</div>" +

    (c.notas ? '<div class="nota"><b>Notas</b><br />' + esc(c.notas).replace(/\n/g, "<br />") + "</div>" : "") +

    '<div class="tabs" role="tablist">' +
      pestanas.map(([v, label, n]) =>
        '<button type="button" role="tab" aria-selected="' + (estado.pestana === v) + '" data-a="pestana" data-v="' + v + '">' +
        label + (n ? ' <span class="num" style="opacity:.6">' + n + "</span>" : "") + "</button>").join("") +
    "</div>" +

    listaTareas(visibles, {
      ocultarCliente: true,
      vacio: estado.pestana === "completadas" ? "Todavía no completaste nada de este cliente" : "Sin tareas acá",
      vacioDetalle: estado.pestana === "pendientes" ? "Agregá la primera con el botón de arriba." : undefined,
    })
  );
}

/* ---------- Calendario ---------- */
function vistaCalendario() {
  const hoy = today();
  const marcasDe = (d) => {
    const items = abiertas().filter((t) => t.fecha === d);
    const propias = items.filter((t) => !t.clienteId).length;
    const deCli = items.filter((t) => t.clienteId).length;
    let out = "";
    for (let i = 0; i < Math.min(propias, 2); i++) out += "<i></i>";
    for (let i = 0; i < Math.min(deCli, 2); i++) out += '<i class="cli"></i>';
    return out;
  };
  const celda = (d, fuera) => {
    const n = abiertas().filter((t) => t.fecha === d).length;
    return (
      '<button type="button" class="day' + (d === hoy ? " es-hoy" : "") + (fuera ? " fuera" : "") + '" ' +
      'aria-pressed="' + (d === estado.elegido) + '" data-a="dia" data-v="' + d + '" ' +
      'aria-label="' + esc(longDate(d)) + ", " + plural(n, "tarea", "tareas") + '">' +
        (estado.calVista === "semana" ? '<span class="dow">' + DIAS_CORTO[dow(d)] + "</span>" : "") +
        '<span class="n num">' + parseDay(d).getDate() + "</span>" +
        '<span class="marks">' + marcasDe(d) + "</span>" +
      "</button>"
    );
  };

  let grilla;
  if (estado.calVista === "semana") {
    grilla = '<div class="week">' + weekOf(estado.ancla).map((d) => celda(d, false)).join("") + "</div>";
  } else {
    const mes = parseDay(estado.ancla).getMonth();
    const cabecera = DIAS_CORTO.slice(1).concat(DIAS_CORTO[0]).map((d) => '<span class="dow-head">' + d + "</span>").join("");
    grilla = '<div class="month-grid">' + cabecera +
      monthGrid(estado.ancla).map((d) => celda(d, parseDay(d).getMonth() !== mes)).join("") + "</div>";
  }

  const enHoy = estado.ancla === hoy && estado.elegido === hoy;
  return (
    '<header style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">' +
      "<h1>Calendario</h1>" +
      '<div style="display:flex;align-items:center;gap:8px">' +
        (enHoy ? "" : '<button type="button" class="btn btn-soft" data-a="cal-hoy">Hoy</button>') +
        '<div class="tabs">' +
          '<button type="button" role="tab" data-a="cal-vista" data-v="semana" aria-selected="' + (estado.calVista === "semana") + '">Semana</button>' +
          '<button type="button" role="tab" data-a="cal-vista" data-v="mes" aria-selected="' + (estado.calVista === "mes") + '">Mes</button>' +
        "</div>" +
      "</div>" +
    "</header>" +
    '<div class="cal-head">' +
      '<button type="button" class="icon-btn" data-a="cal-paso" data-v="-1" aria-label="Anterior">' + icon("left") + "</button>" +
      '<span class="cal-mes">' + esc(monthLabel(estado.ancla)) + "</span>" +
      '<button type="button" class="icon-btn" data-a="cal-paso" data-v="1" aria-label="Siguiente">' + icon("right") + "</button>" +
    "</div>" +
    grilla +
    '<section><div style="display:flex;align-items:center;justify-content:space-between;gap:10px">' +
      "<h2>" + (estado.elegido === hoy ? "Hoy" : esc(longDate(estado.elegido))) + "</h2>" +
      '<button type="button" class="btn btn-soft btn-sm" data-a="nueva-tarea-dia">' + icon("plus") + "Agregar</button></div>" +
      listaTareas(delDia(estado.elegido), { vacio: "Sin tareas ese día" }) +
    "</section>"
  );
}

/* ---------- Búsqueda ---------- */
function vistaBusqueda() {
  const r = buscar(estado.consulta);
  let html = "<header><h1>Resultados</h1>" +
    '<p class="sub">' + plural(r.tareas.length, "tarea", "tareas") + " y " +
    plural(r.clientes.length, "cliente", "clientes") + ' para “' + esc(estado.consulta.trim()) + "”.</p></header>";
  if (r.clientes.length) {
    html += '<section><h2>Clientes</h2><div class="cli-grid">' +
      r.clientes.map((c) =>
        '<button type="button" class="cli-card" data-a="abrir-cliente" data-id="' + c.id + '">' +
          '<div class="cli-top"><span class="cli-emoji">' + esc(c.emoji || "🏢") + "</span>" +
            '<span class="cli-nombre" style="flex:1;min-width:0">' + esc(c.nombre) + "</span>" +
            '<span class="faint" style="display:flex">' + icon("right") + "</span></div></button>").join("") +
      "</div></section>";
  }
  html += "<section><h2>Tareas</h2>" +

      '” como tarea<span class="bead">' + icon("plus") + "</span></button></div>";
