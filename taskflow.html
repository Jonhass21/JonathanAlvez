<dialog id="dialog" aria-labelledby="dialog-title"></dialog>

<script>
  "use strict";

  /* ============================================================
     TaskFlow — sistema personal de clientes y tareas.
     Todo vive en este archivo y en el localStorage del navegador.
     No hay servidor, no hay cuentas, no hay nada que configurar.
     ============================================================ */

  /* ---------- iconos ---------- */
  const ICONS = {
    home: '<path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>',
    users: '<circle cx="9" cy="8" r="3.2"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><path d="M16 5.3a3.2 3.2 0 0 1 0 5.4M17.5 14.4a5.5 5.5 0 0 1 3 5.6"/>',
    calendar: '<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9.5h17M8 3.5v3M16 3.5v3"/>',
    settings: '<path d="M4 7h10M18.5 7H20M4 12h2.5M10.5 12H20M4 17h8.5M17 17H20"/><circle cx="16" cy="7" r="2.1"/><circle cx="8.5" cy="12" r="2.1"/><circle cx="14.8" cy="17" r="2.1"/>',
    check: '<path d="m5 12.5 4.5 4.5L19 6.5" stroke-width="3"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    trash: '<path d="M4 7h16M9.5 7V4.8h5V7M6.5 7l.9 12.4a1.6 1.6 0 0 0 1.6 1.5h6a1.6 1.6 0 0 0 1.6-1.5L17.5 7"/>',
    pencil: '<path d="M4 20h4L20 8l-4-4L4 16z"/>',
    play: '<path d="M8 5.5v13l10-6.5z"/>',
    clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 1.8"/>',
    alert: '<path d="M12 4.5 2.8 20h18.4z"/><path d="M12 10v4M12 17.2v.2"/>',
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.2 4.2l1.5 1.5M18.3 18.3l1.5 1.5M2.5 12h2M19.5 12h2M4.2 19.8l1.5-1.5M18.3 5.7l1.5-1.5"/>',
    left: '<path d="m14.5 5-7 7 7 7"/>',
    right: '<path d="m9.5 5 7 7-7 7"/>',
    back: '<path d="M19 12H5M11 6l-6 6 6 6"/>',
    x: '<path d="M6 6l12 12M18 6 6 18"/>',
    inbox: '<path d="M3.5 13h4l1.5 3h6l1.5-3h4"/><path d="M5.6 5.4h12.8l2.1 7.6V19a1.5 1.5 0 0 1-1.5 1.5H5a1.5 1.5 0 0 1-1.5-1.5v-6z"/>',
  };

  function icon(name, cls) {
    return (
      '<svg class="ic ' + (cls || "") + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      ICONS[name] + "</svg>"
    );
  }

  const esc = (value) =>
    String(value == null ? "" : value).replace(/[&<>"']/g, (c) => (
      { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
    ));

  const plural = (n, one, many) => n + " " + (n === 1 ? one : many);

  /* ---------- fechas ----------
     Las fechas se guardan como "AAAA-MM-DD" y se parsean por partes.
     Pasar un ISO directo a new Date() lo interpreta como UTC y puede
     correr el día según la zona horaria, así que acá no se hace nunca. */
  const DIAS = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
  const DIAS_CORTO = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];
  const MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
  const MESES_CORTO = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];

  function parseDay(s) {
    const [y, m, d] = s.split("-").map(Number);
    return new Date(y, m - 1, d);
  }
  function toDay(date) {
    const m = String(date.getMonth() + 1).padStart(2, "0");
    const d = String(date.getDate()).padStart(2, "0");
    return date.getFullYear() + "-" + m + "-" + d;
  }
  const today = () => toDay(new Date());
  function addDays(s, n) {
    const d = parseDay(s);
    d.setDate(d.getDate() + n);
    return toDay(d);
  }
  /** Suma meses de verdad: sumar 30 días saltea febrero y desfasa la grilla. */
  function addMonths(s, n) {
    const d = parseDay(s);
    const day = d.getDate();
    d.setDate(1);
    d.setMonth(d.getMonth() + n);
    const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    d.setDate(Math.min(day, last));
    return toDay(d);
  }
  const dow = (s) => parseDay(s).getDay();
  const isPast = (s) => s < today();
  const isToday = (s) => s === today();
  const diffDays = (a, b) => Math.round((parseDay(b) - parseDay(a)) / 86400000);

  function friendlyDate(s) {
    if (!s) return "Sin fecha";
    if (isToday(s)) return "Hoy";
    if (s === addDays(today(), 1)) return "Mañana";
    const d = parseDay(s);
    if (isPast(s)) return DIAS_CORTO[d.getDay()] + " " + d.getDate() + " " + MESES_CORTO[d.getMonth()];
    const diff = diffDays(today(), s);
    if (diff > 1 && diff < 7) return DIAS[d.getDay()];
    return d.getDate() + " " + MESES_CORTO[d.getMonth()];
  }
  const longDate = (s) => {
    const d = parseDay(s);
    return DIAS[d.getDay()] + " " + d.getDate() + " de " + MESES[d.getMonth()];
  };
  const monthLabel = (s) => {
    const d = parseDay(s);
    return MESES[d.getMonth()] + " " + d.getFullYear();
  };

  function weekOf(s) {
    const i = dow(s);
    const monday = addDays(s, i === 0 ? -6 : 1 - i);
    return Array.from({ length: 7 }, (_, k) => addDays(monday, k));
  }
  function monthGrid(s) {
    const d = parseDay(s);
    const first = toDay(new Date(d.getFullYear(), d.getMonth(), 1));
    const last = toDay(new Date(d.getFullYear(), d.getMonth() + 1, 0));
    const start = weekOf(first)[0];
    const end = weekOf(last)[6];
    const days = [];
    let cur = start;
    while (cur <= end) {
      days.push(cur);
      cur = addDays(cur, 1);
    }
    return days;
  }
  function minutesUntil(day, time) {
    const [h, m] = time.split(":").map(Number);
    const target = parseDay(day);
    target.setHours(h, m, 0, 0);
    return Math.round((target - Date.now()) / 60000);
  }
  function minutesLabel(min) {
    if (min <= 0) return "Ahora";
    if (min < 60) return "En " + min + " min";
    const h = Math.floor(min / 60);
    const r = min % 60;
    return r === 0 ? "En " + h + " h" : "En " + h + " h " + r + " min";
  }

  /* ---------- interpretación del texto ----------
     No es inteligencia artificial: son patrones de cómo escribe uno.
     Cubre lo frecuente y lo que no entiende se corrige en el paso de
     confirmación, que igual hay que mirar. */
  const CATEGORIAS = ["Contenido", "Diseño", "Publicidad", "Administración", "Reunión", "Cliente", "Otro"];
  const PRIORIDADES = [
    { value: "low", label: "Baja" },
    { value: "medium", label: "Media" },
    { value: "high", label: "Alta" },
  ];
  const SEMANA = [["domingo", 0], ["lunes", 1], ["martes", 2], ["miercoles", 3], ["jueves", 4], ["viernes", 5], ["sabado", 6]];
  const MES_NUM = { enero: 0, febrero: 1, marzo: 2, abril: 3, mayo: 4, junio: 5, julio: 6, agosto: 7, septiembre: 8, setiembre: 8, octubre: 9, noviembre: 10, diciembre: 11 };
  const CAT_CLAVES = [
    ["Reunión", ["reunion", "reunirme", "llamada", "llamar", "meet", "zoom", "videollamada", "coordinar"]],
    ["Publicidad", ["campana", "pauta", "ads", "anuncio", "publicidad"]],
    ["Administración", ["factura", "facturar", "cobro", "cobrar", "pago", "pagar", "informe", "reporte", "presupuesto", "propuesta", "contrato"]],
    ["Diseño", ["disen", "pieza", "piezas", "arte", "banner", "flyer", "portada", "logo", "identidad", "paleta"]],
    ["Contenido", ["reel", "reels", "carrusel", "historia", "historias", "post", "contenido", "video", "story", "stories", "guion", "copy", "grilla"]],
    ["Cliente", ["aprobacion", "feedback", "aprobar"]],
  ];
  const MULETILLAS = ["tengo que ", "tenemos que ", "hay que ", "necesito ", "necesitamos ", "debo ", "quiero ", "acordate de ", "acordarme de ", "recordar ", "recordarme ", "me toca "];
  const COLGANTES = ["de", "del", "para", "a", "al", "con", "en", "el", "la", "los", "las", "que", "y"];

  /** Minúsculas y sin tildes, pero carácter por carácter: así las posiciones
      siguen coincidiendo con el texto original y se puede recortar por índice. */
  function fold(s) {
    return s.toLowerCase()
      .replace(/[áàä]/g, "a").replace(/[éèë]/g, "e").replace(/[íìï]/g, "i")
      .replace(/[óòö]/g, "o").replace(/[úùü]/g, "u").replace(/ñ/g, "n");
  }

  function widenLeft(folded, span) {
    const before = folded.slice(0, span.start).replace(/\s+$/, "");
    for (const w of COLGANTES) {
      if (before.endsWith(" " + w) || before === w) return { start: before.length - w.length, end: span.end };
    }
    return span;
  }
  function matchSpan(folded, re) {
    const m = folded.match(re);
    if (!m || m.index === undefined) return null;
    return { m, span: { start: m.index, end: m.index + m[0].length } };
  }

  function findClient(folded, clients) {
    const sorted = clients.slice().sort((a, b) => b.name.length - a.name.length);
    for (const c of sorted) {
      const needle = fold(c.name);
      const i = folded.indexOf(needle);
      if (i !== -1) return { id: c.id, span: { start: i, end: i + needle.length } };
    }
    return null;
  }

  function findDate(folded) {
    const hoy = today();
    // El orden importa: "pasado mañana" va antes que "mañana", si no
    // \bmanana\b coincide adentro y la tarea cae un día antes.
    const simples = [
      [/\bpasado manana\b/, () => addDays(hoy, 2)],
      [/\bhoy\b/, () => hoy],
      [/\bmanana\b/, () => addDays(hoy, 1)],
      [/\b(la semana que viene|la proxima semana|la semana proxima)\b/, () => addDays(hoy, 7)],
      [/\b(el mes que viene|el proximo mes)\b/, () => addMonths(hoy, 1)],
      [/\b(este finde|el finde|fin de semana)\b/, () => addDays(hoy, (6 - dow(hoy) + 7) % 7)],
    ];
    for (const [re, resolve] of simples) {
      const hit = matchSpan(folded, re);
      if (hit) return { date: resolve(), span: hit.span };
    }
    const enDias = matchSpan(folded, /\ben (\d{1,2}) dias?\b/);
    if (enDias) return { date: addDays(hoy, Number(enDias.m[1])), span: enDias.span };

    const conMes = matchSpan(folded, new RegExp("\\b(\\d{1,2}) de (" + Object.keys(MES_NUM).join("|") + ")\\b"));
    if (conMes) {
      const base = parseDay(hoy);
      let cand = toDay(new Date(base.getFullYear(), MES_NUM[conMes.m[2]], Number(conMes.m[1])));
      if (cand < hoy) cand = toDay(new Date(base.getFullYear() + 1, MES_NUM[conMes.m[2]], Number(conMes.m[1])));
      return { date: cand, span: conMes.span };
    }

    const numerica = matchSpan(folded, /\b(\d{1,2})[/-](\d{1,2})(?:[/-](\d{2,4}))?\b/);
    if (numerica) {
      const d = Number(numerica.m[1]);
      const mo = Number(numerica.m[2]) - 1;
      const base = parseDay(hoy);
      let y = numerica.m[3] ? Number(numerica.m[3]) : base.getFullYear();
      if (y < 100) y += 2000;
      if (mo >= 0 && mo <= 11 && d >= 1 && d <= 31) {
        let cand = toDay(new Date(y, mo, d));
        if (!numerica.m[3] && cand < hoy) cand = toDay(new Date(y + 1, mo, d));
        return { date: cand, span: numerica.span };
      }
    }

    for (const [nombre, idx] of SEMANA) {
      const hit = matchSpan(folded, new RegExp("\\b(el |este |proximo |el proximo )?" + nombre + "( que viene)?\\b"));
      if (!hit) continue;
      const forzarSiguiente = Boolean(hit.m[2]) || /proximo/.test(hit.m[1] || "");
      let delta = idx - dow(hoy);
      if (delta < 0) delta += 7;
      if (delta === 0 && forzarSiguiente) delta = 7;
      return { date: addDays(hoy, delta), span: hit.span };
    }
    return null;
  }

  function findTime(folded) {
    const build = (h, m) => String(Math.min(h, 23)).padStart(2, "0") + ":" + String(Math.min(m, 59)).padStart(2, "0");
    const ajustar = (h, sufijo) => {
      if (sufijo === "pm" && h < 12) return h + 12;
      if (sufijo === "am" && h === 12) return 0;
      if (!sufijo && h >= 1 && h <= 7 && /\b(tarde|de la tarde|a la tarde)\b/.test(folded)) return h + 12;
      return h;
    };
    const mediodia = matchSpan(folded, /\b(al |a la |el )?mediodia\b/);
    if (mediodia) return { time: "12:00", span: mediodia.span };
    const una = matchSpan(folded, /\ba la una\b/);
    if (una) return { time: "13:00", span: una.span };
    const media = matchSpan(folded, /\ba las (\d{1,2}) y (media|cuarto)\b/);
    if (media) return { time: build(ajustar(Number(media.m[1])), media.m[2] === "media" ? 30 : 15), span: media.span };
    const alas = matchSpan(folded, /\ba las (\d{1,2})(?::(\d{2}))?\s?(am|pm|hs|h)?\b/);
    if (alas) return { time: build(ajustar(Number(alas.m[1]), alas.m[3]), Number(alas.m[2] || 0)), span: alas.span };
    const conHs = matchSpan(folded, /\b(\d{1,2})(?::(\d{2}))?\s?(hs|h|am|pm)\b/);
    if (conHs) return { time: build(ajustar(Number(conHs.m[1]), conHs.m[3]), Number(conHs.m[2] || 0)), span: conHs.span };
    const reloj = matchSpan(folded, /\b([01]?\d|2[0-3]):([0-5]\d)\b/);
    if (reloj) return { time: build(Number(reloj.m[1]), Number(reloj.m[2])), span: reloj.span };
    return null;
  }

  function findCategory(folded) {
    for (const [cat, claves] of CAT_CLAVES) {
      if (claves.some((k) => folded.includes(k))) return { category: cat, matched: true };
    }
    return { category: "Otro", matched: false };
  }
  function findPriority(folded) {
    if (/\b(urgente|urgentisimo|importante|prioridad alta|ya mismo|cuanto antes|si o si)\b/.test(folded)) return { priority: "high", matched: true };
    if (/\b(sin apuro|cuando pueda|cuando puedas|no es urgente|prioridad baja|algun dia)\b/.test(folded)) return { priority: "low", matched: true };
    return { priority: "medium", matched: false };
  }

  function buildTitle(original, spans) {
    const merged = [];
    spans.slice().sort((a, b) => a.start - b.start).forEach((s) => {
      const last = merged[merged.length - 1];
      if (last && s.start <= last.end) last.end = Math.max(last.end, s.end);
      else merged.push({ start: s.start, end: s.end });
    });
    let text = original;
    merged.slice().reverse().forEach((s) => {
      text = text.slice(0, s.start) + " " + text.slice(s.end);
    });
    let out = text.replace(/\s{2,}/g, " ").trim();
    let changed = true;
    while (changed) {
      changed = false;
      const low = fold(out);
      for (const p of MULETILLAS) {
        if (low.startsWith(p)) { out = out.slice(p.length).trim(); changed = true; break; }
      }
    }
    out = out.replace(/^[,:;.\-–—\s]+/, "").replace(/[,:;\-–—\s]+$/, "").replace(/\s{2,}/g, " ").trim();
    const words = out.split(" ");
    while (words.length > 1 && COLGANTES.includes(fold(words[words.length - 1]))) words.pop();
    out = words.join(" ");
    if (!out) return "Nueva tarea";
    return out.charAt(0).toUpperCase() + out.slice(1);
  }

  function interpretar(texto, clients) {
    const original = texto.trim();
    const folded = fold(original);
    const cliente = findClient(folded, clients);
    const fecha = findDate(folded);
    const hora = findTime(folded);
    const cat = findCategory(folded);
    const pri = findPriority(folded);
    const spans = [];
    if (cliente) spans.push(widenLeft(folded, cliente.span));
    if (fecha) spans.push(widenLeft(folded, fecha.span));
    if (hora) spans.push(widenLeft(folded, hora.span));
    return {
      draft: {
        title: buildTitle(original, spans),
        description: "",
        clientId: cliente ? cliente.id : null,
        priority: pri.priority,
        dueDate: fecha ? fecha.date : null,
        dueTime: hora ? hora.time : null,
        category: cat.category,
      },
      guessed: {
        client: Boolean(cliente),
        date: Boolean(fecha),
        time: Boolean(hora),
        category: cat.matched,
        priority: pri.matched,
      },
    };
  }

  /* ---------- datos ----------
     Una sola clave de localStorage con todo adentro. Si el navegador la
     bloquea (modo privado, sitio sin permisos) la app sigue funcionando
     en memoria y avisa una vez. */
  const CLAVE = "taskflow.datos.v1";
  const CLAVE_TEMA = "taskflow.tema.v1";

  let datos = { clients: [], tasks: [], ejemplos: false };
  let almacenamientoOk = true;

  const uid = (p) => p + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 7);

  function cargar() {
    try {
      const raw = localStorage.getItem(CLAVE);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.clients) && Array.isArray(parsed.tasks)) return parsed;
      }
    } catch (e) {
      almacenamientoOk = false;
    }
    return null;
  }

  function guardar() {
    try {
      localStorage.setItem(CLAVE, JSON.stringify(datos));
      return true;
    } catch (e) {
      if (almacenamientoOk) {
        almacenamientoOk = false;
        toast("No se pudieron guardar los cambios", "El navegador tiene el almacenamiento lleno o bloqueado.");
      }
      return false;
    }
  }

  function ejemplos() {
    const hoy = today();
    const clients = [
      { id: "san-lucas", name: "San Lucas", color: "accent" },
      { id: "estilo-car", name: "Estilo Car", color: "gold" },
      { id: "estilo-campo", name: "Estilo Campo", color: "neutral" },
      { id: "kaia", name: "Kaia", color: "accent" },
      { id: "modhaus", name: "ModHaus", color: "gold" },
    ];
    const t = (clientId, title, priority, dueDate, dueTime, category, status) => ({
      id: uid("t"), title, description: "", clientId, priority, dueDate, dueTime,
      category, status: status || "pending",
      createdAt: new Date().toISOString(),
      completedAt: status === "completed" ? new Date().toISOString() : null,
    });
    const tasks = [
      t("san-lucas", "Preparar reel sobre mamografía", "high", hoy, "10:00", "Contenido"),
      t("san-lucas", "Revisar métricas de la campaña", "medium", addDays(hoy, 1), null, "Publicidad"),
      t("san-lucas", "Enviar propuesta de tracking", "high", addDays(hoy, -2), null, "Administración"),
      t("san-lucas", "Coordinar grabación de testimonios", "low", addDays(hoy, 5), null, "Reunión"),
      t("estilo-car", "Revisar calendario de contenido", "medium", hoy, "12:00", "Contenido"),
      t("estilo-car", "Diseñar piezas de promo de service", "medium", addDays(hoy, 2), null, "Diseño"),
      t("estilo-car", "Enviar informe mensual de Instagram", "high", addDays(hoy, 1), null, "Administración", "in_progress"),
      t("estilo-campo", "Planificar carrusel de temporada", "low", addDays(hoy, 3), null, "Contenido"),
      t("estilo-campo", "Actualizar catálogo de productos", "medium", addDays(hoy, -1), null, "Otro"),
      t("estilo-campo", "Reunión de seguimiento mensual", "medium", addDays(hoy, 4), "16:30", "Reunión"),
      t("kaia", "Enviar piezas para aprobación", "medium", hoy, "15:00", "Contenido"),
      t("kaia", "Definir paleta de la próxima colección", "high", addDays(hoy, 1), null, "Diseño"),
      t("kaia", "Grabar videos nuevos", "low", addDays(hoy, 6), null, "Contenido"),
      t("kaia", "Cerrar informe de resultados", "medium", addDays(hoy, -4), null, "Administración", "completed"),
      t("modhaus", "Armar plan de contenidos del mes", "high", addDays(hoy, 2), null, "Contenido"),
      t("modhaus", "Revisar pauta activa", "medium", hoy, "18:00", "Publicidad", "in_progress"),
      t("modhaus", "Enviar propuesta de rediseño de feed", "low", addDays(hoy, 7), null, "Diseño"),
    ];
    return { clients, tasks, ejemplos: true };
  }

  const clientById = (id) => datos.clients.find((c) => c.id === id) || null;
  const clientName = (id) => { const c = clientById(id); return c ? c.name : ""; };

  const RANGO = { high: 0, medium: 1, low: 2 };
  function ordenar(tasks) {
    return tasks.slice().sort((a, b) => {
      if (a.dueDate && b.dueDate) {
        if (a.dueDate !== b.dueDate) return a.dueDate < b.dueDate ? -1 : 1;
        if (a.dueTime && b.dueTime && a.dueTime !== b.dueTime) return a.dueTime < b.dueTime ? -1 : 1;
        if (a.dueTime && !b.dueTime) return -1;
        if (!a.dueTime && b.dueTime) return 1;
      } else if (a.dueDate) return -1;
      else if (b.dueDate) return 1;
      return RANGO[a.priority] - RANGO[b.priority];
    });
  }
  const abiertas = () => datos.tasks.filter((t) => t.status !== "completed");
  const vencidas = () => ordenar(abiertas().filter((t) => t.dueDate && isPast(t.dueDate)));
  const deHoy = () => ordenar(abiertas().filter((t) => t.dueDate && isToday(t.dueDate)));
  const proximas = () => ordenar(abiertas().filter((t) => t.dueDate && !isPast(t.dueDate) && !isToday(t.dueDate)));
  const delDia = (day) => ordenar(abiertas().filter((t) => t.dueDate === day));

  function recordatorios() {
    return deHoy()
      .filter((t) => t.dueTime)
      .map((t) => ({ t, min: minutesUntil(t.dueDate, t.dueTime) }))
      .filter((x) => x.min >= 0 && x.min <= 60)
      .sort((a, b) => a.min - b.min);
  }

  const sinTildes = (s) => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  function buscar(q) {
    const term = sinTildes(q.trim());
    if (!term) return { tasks: [], clients: [] };
    const palabras = term.split(/\s+/);
    const tasks = ordenar(datos.tasks.filter((t) => {
      const heno = sinTildes([t.title, t.description, t.category, clientName(t.clientId)].join(" "));
      return palabras.every((w) => heno.includes(w));
    }));
    const clients = datos.clients.filter((c) => sinTildes(c.name).includes(term));
    return { tasks, clients };
  }

  /* ---------- estado de la pantalla ---------- */
  const estado = {
    vista: "hoy",
    clienteId: null,
    pestana: "pending",
    categoria: "todas",
    calVista: "semana",
    ancla: today(),
    elegido: today(),
    consulta: "",
    captura: "",
    borrador: null,
    adivinado: null,
  };

  /* ---------- avisos ---------- */
  const $toasts = document.getElementById("toasts");
  function toast(titulo, detalle, deshacer) {
    const el = document.createElement("div");
    el.className = "toast";
    el.innerHTML =
      '<div class="toast-body"><p class="toast-title">' + esc(titulo) + "</p>" +
      (detalle ? '<p class="toast-desc">' + esc(detalle) + "</p>" : "") + "</div>" +
      (deshacer ? '<button type="button" class="undo">Deshacer</button>' : "") +
      '<button type="button" class="icon-btn" aria-label="Cerrar aviso">' + icon("x") + "</button>";
    const cerrar = () => { clearTimeout(timer); el.remove(); };
    if (deshacer) el.querySelector(".undo").addEventListener("click", () => { cerrar(); deshacer(); });
    el.querySelector(".icon-btn").addEventListener("click", cerrar);
    const timer = setTimeout(cerrar, 5200);
    $toasts.appendChild(el);
    while ($toasts.children.length > 3) $toasts.firstElementChild.remove();
  }

  /* ---------- tema ---------- */
  function temaGuardado() {
    try {
      const v = localStorage.getItem(CLAVE_TEMA);
      if (v === "claro" || v === "oscuro" || v === "sistema") return v;
    } catch (e) { /* sin acceso: queda en sistema */ }
    return "sistema";
  }
  function aplicarTema(pref) {
    if (pref === "sistema") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", pref === "oscuro" ? "dark" : "light");
  }
  function elegirTema(pref) {
    try { localStorage.setItem(CLAVE_TEMA, pref); } catch (e) { /* no se recuerda */ }
    aplicarTema(pref);
    render();
  }

  /* ---------- piezas de interfaz ---------- */
  function filaTarea(t, opts) {
    const o = opts || {};
    const hecho = t.status === "completed";
    const vencida = !hecho && t.dueDate && isPast(t.dueDate);
    const hoyEs = !hecho && t.dueDate && isToday(t.dueDate);
    const nombre = o.ocultarCliente ? "" : clientName(t.clientId);
    const cuando = t.dueDate
      ? '<span class="when ' + (vencida ? "overdue" : hoyEs ? "today" : "") + '">' +
        esc(friendlyDate(t.dueDate)) + (t.dueTime ? " · " + esc(t.dueTime) : "") +
        (vencida ? " · vencida" : "") + "</span>"
      : "";
    return (
      '<div class="task" data-done="' + (hecho ? 1 : 0) + '">' +
        '<button type="button" class="check" data-done="' + (hecho ? 1 : 0) + '" data-a="toggle" data-id="' + t.id + '" ' +
          'aria-label="' + (hecho ? "Marcar como pendiente" : "Completar") + ': ' + esc(t.title) + '">' +
          (hecho ? icon("check") : "") +
        "</button>" +
        '<button type="button" class="task-body" data-a="editar" data-id="' + t.id + '" aria-label="Editar: ' + esc(t.title) + '">' +
          '<p class="task-title">' + esc(t.title) + "</p>" +
          (t.description ? '<p class="task-note">' + esc(t.description) + "</p>" : "") +
          '<div class="meta">' +
            (nombre ? '<span class="client">' + esc(nombre) + "</span>" : "") +
            '<span class="tag">' + esc(t.category) + "</span>" +
            cuando +
            (t.status === "in_progress" ? '<span class="pill-progress">En curso</span>' : "") +
          "</div>" +
        "</button>" +
        '<div class="task-side">' +
          (hecho ? "" :
            '<button type="button" class="icon-btn" data-a="curso" data-id="' + t.id + '" ' +
            'title="' + (t.status === "in_progress" ? "Pausar" : "Empezar") + '" ' +
            'aria-label="' + (t.status === "in_progress" ? "Pausar" : "Empezar") + ': ' + esc(t.title) + '"' +
            (t.status === "in_progress" ? ' style="color: var(--gold)"' : "") + ">" + icon("play") + "</button>") +
          '<button type="button" class="icon-btn danger" data-a="borrar" data-id="' + t.id + '" ' +
            'title="Eliminar" aria-label="Eliminar: ' + esc(t.title) + '">' + icon("trash") + "</button>" +
          '<span class="dot ' + t.priority + '" title="Prioridad ' + (t.priority === "high" ? "alta" : t.priority === "medium" ? "media" : "baja") + '"></span>' +
        "</div>" +
      "</div>"
    );
  }

  const listaTareas = (tasks, opts) =>
    tasks.length
      ? '<div class="list">' + tasks.map((t) => filaTarea(t, opts)).join("") + "</div>"
      : vacio((opts && opts.vacio) || "No hay tareas acá", opts && opts.vacioDetalle);

  const vacio = (titulo, detalle) =>
    '<div class="empty">' + esc(titulo) + (detalle ? "<p>" + esc(detalle) + "</p>" : "") + "</div>";

  function camposTarea(draft, guessed, destino) {
    const g = guessed || {};
    const marca = (k) => (g[k] ? '<span class="guessed" title="Lo deduje del texto"></span>' : "");
    const opcionesCliente = ['<option value=""' + (draft.clientId ? "" : " selected") + ">Sin cliente</option>"]
      .concat(datos.clients.map((c) =>
        '<option value="' + c.id + '"' + (draft.clientId === c.id ? " selected" : "") + ">" + esc(c.name) + "</option>"))
      .join("");
    const opcionesCat = CATEGORIAS.map((c) =>
      '<option value="' + c + '"' + (draft.category === c ? " selected" : "") + ">" + c + "</option>").join("");
    const p = destino + "-";
    return (
      '<div class="field">' +
        '<label for="' + p + 'titulo">Tarea</label>' +
        '<input id="' + p + 'titulo" data-f="title" data-target="' + destino + '" value="' + esc(draft.title) + '" placeholder="¿Qué hay que hacer?" />' +
      "</div>" +
      '<div class="grid2">' +
        '<div class="field"><label for="' + p + 'cliente">Cliente' + marca("client") + "</label>" +
          '<select id="' + p + 'cliente" data-f="clientId" data-target="' + destino + '">' + opcionesCliente + "</select></div>" +
        '<div class="field"><label for="' + p + 'cat">Categoría' + marca("category") + "</label>" +
          '<select id="' + p + 'cat" data-f="category" data-target="' + destino + '">' + opcionesCat + "</select></div>" +
      "</div>" +
      '<div class="grid2">' +
        '<div class="field"><label for="' + p + 'fecha">Fecha' + marca("date") + "</label>" +
          '<input id="' + p + 'fecha" type="date" data-f="dueDate" data-target="' + destino + '" value="' + esc(draft.dueDate || "") + '" /></div>' +
        '<div class="field"><label for="' + p + 'hora">Hora' + marca("time") + "</label>" +
          '<input id="' + p + 'hora" type="time" data-f="dueTime" data-target="' + destino + '" value="' + esc(draft.dueTime || "") + '" /></div>' +
      "</div>" +
      '<div class="field"><span class="dim" style="font-size:11px;font-weight:500">Prioridad</span>' +
        '<div class="seg" data-target="' + destino + '">' +
          PRIORIDADES.map((x) =>
            '<button type="button" data-a="prioridad" data-target="' + destino + '" data-v="' + x.value + '" aria-pressed="' +
            (draft.priority === x.value) + '">' + x.label + "</button>").join("") +
      "</div></div>" +
      '<div class="field"><label for="' + p + 'nota">Nota (opcional)</label>' +
        '<textarea id="' + p + 'nota" data-f="description" data-target="' + destino + '" placeholder="Detalle, link, referencia…">' + esc(draft.description) + "</textarea></div>"
    );
  }

  /* ---------- vistas ---------- */
  function vistaHoy() {
    const hora = new Date().getHours();
    const saludo = hora < 12 ? "Buenos días" : hora < 19 ? "Buenas tardes" : "Buenas noches";
    const v = vencidas();
    const h = deHoy();
    const sig = proximas()[0] || null;
    const recs = recordatorios();
    const altas = h.filter((t) => t.priority === "high").length;
    const medias = h.filter((t) => t.priority === "medium").length;
    const bajas = h.filter((t) => t.priority === "low").length;
    const primera = h[0] || null;

    let html = "";

    if (datos.ejemplos) {
      html +=
        '<div class="banner gold">' + icon("alert") +
        '<div class="banner-body">Estos son datos de ejemplo, para que veas cómo se usa.</div>' +
        '<button type="button" class="btn btn-outline" data-a="vaciar">Empezar de cero</button>' +
        '<button type="button" class="icon-btn" data-a="ocultar-ejemplos" aria-label="Ocultar este aviso">' + icon("x") + "</button></div>";
    }

    html +=
      "<header>" +
        '<p class="eyebrow">' + esc(longDate(today())) + "</p>" +
        '<h1 class="greet">' + saludo + ", Jona</h1>" +
        '<p class="sub">' +
          (h.length === 0 ? "Hoy no tenés tareas agendadas." : "Hoy tenés " + plural(h.length, "tarea", "tareas") + ".") +
          (v.length ? " Quedaron " + v.length + " sin completar de días anteriores." : "") +
        "</p>" +
      "</header>";

    html +=
      '<div class="capture">' +
        '<div class="capture-row">' +
          '<input id="captura" autocomplete="off" placeholder="¿Qué necesitás hacer?" aria-label="¿Qué necesitás hacer?" value="' + esc(estado.captura) + '" />' +
          '<button type="button" class="capture-send" id="captura-enviar" data-a="interpretar" aria-label="Interpretar y crear tarea"' +
          (estado.captura.trim() ? "" : " disabled") + ">" +
            '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>' +
          "</button>" +
        "</div>" +
        (estado.borrador ? "" : '<p class="hint">Escribilo como lo dirías: “Preparar el reel de San Lucas mañana a las 10”.</p>') +
      "</div>";

    if (estado.borrador) {
      html +=
        '<div class="confirm">' +
          '<div class="confirm-head"><strong style="font-size:13.5px">Entendí esto</strong>' +
            '<span class="dim" style="font-size:11.5px">Corregí lo que haga falta</span></div>' +
          camposTarea(estado.borrador, estado.adivinado, "inline") +
          '<div class="actions">' +
            '<button type="button" class="btn btn-ghost" data-a="cancelar-borrador">Cancelar</button>' +
            '<button type="button" class="btn btn-primary" data-a="crear-borrador">Crear tarea</button>' +
          "</div>" +
        "</div>";
    }

    recs.forEach((r) => {
      html +=
        '<div class="banner gold">' + icon("clock") +
        '<div class="banner-body"><strong>' + esc(minutesLabel(r.min)) + "</strong> · " +
        esc(r.t.title) + (r.t.clientId ? " · " + esc(clientName(r.t.clientId)) : "") + "</div></div>";
    });

    if (v.length) {
      html += "<section><h2>Vencidas</h2>" + listaTareas(v) + "</section>";
    }
    html += "<section><h2>Hoy</h2>" +
      listaTareas(h, { vacio: "Nada para hoy", vacioDetalle: "Aprovechá para adelantar algo de mañana." }) + "</section>";
    if (sig) html += "<section><h2>Lo siguiente</h2>" + listaTareas([sig]) + "</section>";

    html +=
      '<section class="card-soft" style="gap:0">' +
        '<div style="display:flex;align-items:center;gap:7px"><span style="color:var(--gold);display:flex">' + icon("sun") + "</span>" +
          '<strong style="font-size:13px">Resumen de hoy</strong></div>' +
        '<p class="sub" style="margin-top:9px">' +
          (h.length === 0 ? "Sin tareas agendadas." : "Tenés " + plural(h.length, "tarea", "tareas") + ".") + "</p>" +
        (h.length
          ? '<p class="sub" style="margin-top:6px"><strong style="color:var(--accent-ink)">' + altas + "</strong> de prioridad alta · " +
            '<strong style="color:var(--gold)">' + medias + "</strong> normales · " +
            '<strong class="dim">' + bajas + "</strong> sin apuro</p>"
          : "") +
        (primera
          ? '<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)">' +
            '<p class="eyebrow">Primera tarea</p><p class="sub" style="color:var(--ink)">' +
            (primera.clientId ? esc(clientName(primera.clientId)) + " · " : "") + esc(primera.title) +
            (primera.dueTime ? " — " + esc(primera.dueTime) : "") + "</p></div>"
          : "") +
      "</section>";

    return html;
  }

  function vistaClientes() {
    const filas = datos.clients.map((c) => {
      const suyas = datos.tasks.filter((t) => t.clientId === c.id);
      const pend = suyas.filter((t) => t.status !== "completed");
      const venc = pend.filter((t) => t.dueDate && isPast(t.dueDate)).length;
      const prox = ordenar(pend)[0] || null;
      return (
        '<button type="button" class="client-row" data-a="abrir-cliente" data-id="' + c.id + '">' +
          '<span class="swatch ' + c.color + '"></span>' +
          '<span style="flex:1;min-width:0"><span class="client-name" style="display:block">' + esc(c.name) + "</span>" +
            '<span class="client-next" style="display:block">' +
              (prox ? esc(prox.title) + " · " + esc(friendlyDate(prox.dueDate)) : "Sin tareas pendientes") +
            "</span></span>" +
          (venc ? '<span class="badge">' + venc + " vencida" + (venc === 1 ? "" : "s") + "</span>" : "") +
          '<span class="count num">' + pend.length + "</span>" +
          '<span class="dim" style="display:flex">' + icon("right") + "</span>" +
        "</button>"
      );
    }).join("");

    return (
      '<header style="display:flex;align-items:flex-start;justify-content:space-between;gap:14px">' +
        "<div><h1>Clientes</h1>" +
          '<p class="sub">' + plural(datos.clients.length, "cliente", "clientes") + " en total</p></div>" +
        '<button type="button" class="btn btn-primary" data-a="nuevo-cliente">' + icon("plus") + "Nuevo cliente</button>" +
      "</header>" +
      (datos.clients.length
        ? '<div class="list">' + filas + "</div>"
        : vacio("Todavía no hay clientes", "Agregá el primero para empezar a ordenar las tareas por cuenta."))
    );
  }

  function vistaCliente() {
    const c = clientById(estado.clienteId);
    if (!c) {
      return '<button type="button" class="btn btn-ghost" data-a="ir" data-v="clientes">' + icon("back") + "Clientes</button>" +
        vacio("No encontramos ese cliente");
    }
    const suyas = ordenar(datos.tasks.filter((t) => t.clientId === c.id));
    const pend = suyas.filter((t) => t.status !== "completed");
    const venc = pend.filter((t) => t.dueDate && isPast(t.dueDate)).length;
    const usadas = CATEGORIAS.filter((cat) => suyas.some((t) => t.category === cat));
    const visibles = suyas.filter((t) =>
      t.status === estado.pestana && (estado.categoria === "todas" || t.category === estado.categoria));
    const pestanas = [["pending", "Pendientes"], ["in_progress", "En proceso"], ["completed", "Completadas"]];

    return (
      "<header>" +
        '<button type="button" class="btn btn-ghost" style="padding:4px 6px" data-a="ir" data-v="clientes">' + icon("back") + "Clientes</button>" +
        '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-top:8px">' +
          '<div style="min-width:0"><h1>' + esc(c.name) + "</h1>" +
            '<p class="sub">' + plural(pend.length, "pendiente", "pendientes") +
            (venc ? " · " + venc + " vencida" + (venc === 1 ? "" : "s") : "") + "</p></div>" +
          '<div style="display:flex;align-items:center;gap:4px;flex:none">' +
            '<button type="button" class="icon-btn" data-a="renombrar-cliente" title="Renombrar" aria-label="Renombrar cliente">' + icon("pencil") + "</button>" +
            '<button type="button" class="icon-btn danger" data-a="eliminar-cliente" title="Eliminar cliente" aria-label="Eliminar cliente">' + icon("trash") + "</button>" +
            '<button type="button" class="btn btn-primary" style="margin-left:4px" data-a="nueva-tarea">' + icon("plus") + "Nueva tarea</button>" +
          "</div>" +
        "</div>" +
      "</header>" +
      '<div class="tabs" role="tablist">' +
        pestanas.map(([v, label]) => {
          const n = suyas.filter((t) => t.status === v).length;
          return '<button type="button" role="tab" aria-selected="' + (estado.pestana === v) + '" data-a="pestana" data-v="' + v + '">' +
            label + (n ? ' <span class="dim num">(' + n + ")</span>" : "") + "</button>";
        }).join("") +
      "</div>" +
      (usadas.length > 1
        ? '<div class="chips">' +
          ["todas"].concat(usadas).map((cat) =>
            '<button type="button" class="chip" aria-pressed="' + (estado.categoria === cat) + '" data-a="categoria" data-v="' + esc(cat) + '">' +
            (cat === "todas" ? "Todas" : esc(cat)) + "</button>").join("") +
          "</div>"
        : "") +
      listaTareas(visibles, { ocultarCliente: true, vacio: "Nada acá por ahora" })
    );
  }

  function vistaCalendario() {
    const hoy = today();
    const conTareas = (d) => abiertas().filter((t) => t.dueDate === d).length;
    const celda = (d, fueraDeMes) => {
      const n = conTareas(d);
      return (
        '<button type="button" class="day' + (d === hoy ? " is-today" : "") + (fueraDeMes ? " out" : "") + '" ' +
        'aria-pressed="' + (d === estado.elegido) + '" data-a="dia" data-v="' + d + '" ' +
        'aria-label="' + esc(longDate(d)) + ", " + plural(n, "tarea", "tareas") + '">' +
          (estado.calVista === "semana" ? '<span class="dow">' + DIAS_CORTO[dow(d)] + "</span>" : "") +
          '<span class="n num">' + parseDay(d).getDate() + "</span>" +
          '<span class="marks">' + Array.from({ length: Math.min(n, 3) }, () => "<i></i>").join("") + "</span>" +
        "</button>"
      );
    };

    let cuadricula;
    if (estado.calVista === "semana") {
      cuadricula = '<div class="week">' + weekOf(estado.ancla).map((d) => celda(d, false)).join("") + "</div>";
    } else {
      const mes = parseDay(estado.ancla).getMonth();
      const encabezados = DIAS_CORTO.slice(1).concat(DIAS_CORTO[0])
        .map((d) => '<span class="dow-head">' + d + "</span>").join("");
      cuadricula = '<div class="month-grid">' + encabezados +
        monthGrid(estado.ancla).map((d) => celda(d, parseDay(d).getMonth() !== mes)).join("") + "</div>";
    }

    const enHoy = estado.ancla === hoy && estado.elegido === hoy;
    return (
      '<header style="display:flex;align-items:center;justify-content:space-between;gap:12px">' +
        "<h1>Calendario</h1>" +
        '<div style="display:flex;align-items:center;gap:8px">' +
          (enHoy ? "" : '<button type="button" class="btn btn-outline" data-a="cal-hoy">Hoy</button>') +
          '<div class="seg" style="gap:2px">' +
            '<button type="button" data-a="cal-vista" data-v="semana" aria-pressed="' + (estado.calVista === "semana") + '">Semana</button>' +
            '<button type="button" data-a="cal-vista" data-v="mes" aria-pressed="' + (estado.calVista === "mes") + '">Mes</button>' +
          "</div>" +
        "</div>" +
      "</header>" +
      '<div class="cal-head">' +
        '<button type="button" class="icon-btn" data-a="cal-paso" data-v="-1" aria-label="Anterior">' + icon("left") + "</button>" +
        '<span class="cal-month">' + esc(monthLabel(estado.ancla)) + "</span>" +
        '<button type="button" class="icon-btn" data-a="cal-paso" data-v="1" aria-label="Siguiente">' + icon("right") + "</button>" +
      "</div>" +
      cuadricula +
      "<section><h2>" + (estado.elegido === hoy ? "Hoy" : esc(longDate(estado.elegido))) + "</h2>" +
        listaTareas(delDia(estado.elegido), { vacio: "Sin tareas para este día" }) + "</section>"
    );
  }

  function vistaAjustes() {
    const tema = temaGuardado();
    const opciones = [["claro", "Claro"], ["oscuro", "Oscuro"], ["sistema", "Sistema"]];
    return (
      "<header><h1>Ajustes</h1></header>" +
      '<section><h2>Apariencia</h2><div class="seg">' +
        opciones.map(([v, l]) =>
          '<button type="button" data-a="tema" data-v="' + v + '" aria-pressed="' + (tema === v) + '">' + l + "</button>").join("") +
      "</div></section>" +
      "<section><h2>Tus datos</h2>" +
        '<p class="sub">Todo se guarda solo en este navegador. Nadie más lo ve y no viaja a ningún lado.</p>' +
        '<div class="rows">' +
          '<div class="row"><div><div class="row-label">Copia de seguridad</div>' +
            '<p class="row-desc">Copiá tus datos para guardarlos o pasarlos a otro dispositivo.</p></div>' +
            '<button type="button" class="btn btn-outline" data-a="copia">Abrir</button></div>' +
          '<div class="row"><div><div class="row-label">Cargar datos de ejemplo</div>' +
            '<p class="row-desc">Reemplaza todo por los 5 clientes y las tareas de muestra.</p></div>' +
            '<button type="button" class="btn btn-outline" data-a="ejemplos">Cargar</button></div>' +
          '<div class="row"><div><div class="row-label">Empezar de cero</div>' +
            '<p class="row-desc">Borra todos los clientes y tareas de este navegador.</p></div>' +
            '<button type="button" class="btn btn-outline" data-a="vaciar">Vaciar</button></div>' +
        "</div>" +
        '<p class="hint" style="margin-top:10px">Hoy tenés ' + plural(datos.clients.length, "cliente", "clientes") +
          " y " + plural(datos.tasks.length, "tarea", "tareas") + " guardadas.</p>" +
      "</section>"
    );
  }

  function vistaBusqueda() {
    const r = buscar(estado.consulta);
    let html = "<header><h1>Resultados</h1>" +
      '<p class="sub">' + plural(r.tasks.length, "tarea", "tareas") + " y " +
      plural(r.clients.length, "cliente", "clientes") + ' para “' + esc(estado.consulta.trim()) + "”.</p></header>";
    if (r.clients.length) {
      html += "<section><h2>Clientes</h2><div class=\"list\">" +
        r.clients.map((c) =>
          '<button type="button" class="client-row" data-a="abrir-cliente" data-id="' + c.id + '">' +
            '<span class="swatch ' + c.color + '"></span>' +
            '<span style="flex:1;min-width:0" class="client-name">' + esc(c.name) + "</span>" +
            '<span class="dim" style="display:flex">' + icon("right") + "</span></button>").join("") +
        "</div></section>";
    }
    html += "<section><h2>Tareas</h2>" +
      listaTareas(r.tasks, { vacio: "Ninguna tarea coincide", vacioDetalle: "Probá con otra palabra, o con el nombre del cliente." }) +
      "</section>";
    if (r.tasks.length === 0 && r.clients.length === 0) {
      html += '<div class="actions" style="justify-content:flex-start">' +
        '<button type="button" class="btn btn-primary" data-a="crear-desde-busqueda">' + icon("plus") +
        'Crear "' + esc(estado.consulta.trim()) + '" como tarea</button></div>';
    }
    return html;
  }

  /* ---------- navegación ---------- */
  const SECCIONES = [
    { id: "hoy", label: "Hoy", icon: "home" },
    { id: "clientes", label: "Clientes", icon: "users" },
    { id: "calendario", label: "Calendario", icon: "calendar" },
    { id: "ajustes", label: "Ajustes", icon: "settings" },
  ];

  function pintarNav() {
    const activa = estado.consulta.trim() ? "" : estado.vista === "cliente" ? "clientes" : estado.vista;
    document.getElementById("nav-desktop").innerHTML = SECCIONES.map((s) =>
      '<button type="button" data-a="ir" data-v="' + s.id + '"' +
      (activa === s.id ? ' aria-current="page"' : "") + ">" + icon(s.icon) + "<span>" + s.label + "</span></button>").join("");
    document.getElementById("nav-mobile").innerHTML = SECCIONES.map((s) =>
      '<button type="button" data-a="ir" data-v="' + s.id + '"' +
      (activa === s.id ? ' aria-current="page"' : "") + ">" + icon(s.icon) + "<span>" + s.label + "</span></button>").join("");
  }

  const $view = document.getElementById("view");

  function render() {
    pintarNav();
    if (estado.consulta.trim()) $view.innerHTML = vistaBusqueda();
    else if (estado.vista === "clientes") $view.innerHTML = vistaClientes();
    else if (estado.vista === "cliente") $view.innerHTML = vistaCliente();
    else if (estado.vista === "calendario") $view.innerHTML = vistaCalendario();
    else if (estado.vista === "ajustes") $view.innerHTML = vistaAjustes();
    else $view.innerHTML = vistaHoy();
  }

  function ir(vista) {
    estado.vista = vista;
    estado.consulta = "";
    document.getElementById("search").value = "";
    document.getElementById("scroll").scrollTop = 0;
    render();
  }

  /* ---------- diálogos ---------- */
  const $dlg = document.getElementById("dialog");
  let dlgDraft = null;
  let dlgOnOk = null;

  function abrirDialogo(opts) {
    dlgOnOk = opts.onOk || null;
    $dlg.innerHTML =
      '<div class="dlg-head"><div><h2 class="dlg-title" id="dialog-title">' + esc(opts.titulo) + "</h2>" +
        (opts.detalle ? '<p class="dlg-desc">' + esc(opts.detalle) + "</p>" : "") + "</div>" +
        '<button type="button" class="icon-btn" data-a="cerrar-dialogo" aria-label="Cerrar">' + icon("x") + "</button></div>" +
      (opts.cuerpo ? '<div class="dlg-body">' + opts.cuerpo + "</div>" : "") +
      '<div class="dlg-foot">' +
        (opts.extra || "") +
        '<button type="button" class="btn btn-ghost" data-a="cerrar-dialogo">' + esc(opts.cancelar || "Cancelar") + "</button>" +
        (opts.ok ? '<button type="button" class="btn btn-primary" data-a="ok-dialogo">' + esc(opts.ok) + "</button>" : "") +
      "</div>";
    $dlg.showModal();
    const primero = $dlg.querySelector("input, textarea, select");
    if (primero) primero.focus();
  }

  function cerrarDialogo() {
    if ($dlg.open) $dlg.close();
    dlgDraft = null;
    dlgOnOk = null;
  }

  function dialogoTarea(titulo, draft, onOk, extra) {
    dlgDraft = draft;
    abrirDialogo({ titulo, cuerpo: camposTarea(draft, null, "dlg"), ok: titulo === "Editar tarea" ? "Guardar" : "Crear tarea", onOk, extra });
  }

  function dialogoCliente(nombreActual) {
    const editando = Boolean(nombreActual);
    abrirDialogo({
      titulo: editando ? "Renombrar cliente" : "Nuevo cliente",
      detalle: editando ? "" : "Con este nombre lo va a reconocer cuando lo escribas en una tarea.",
      cuerpo: '<div class="field"><label for="dlg-cliente">Nombre</label>' +
        '<input id="dlg-cliente" value="' + esc(nombreActual || "") + '" placeholder="Ej. San Lucas" /></div>',
      ok: editando ? "Guardar" : "Agregar",
      onOk: () => {
        const nombre = $dlg.querySelector("#dlg-cliente").value.trim();
        if (!nombre) return false;
        if (editando) {
          const c = clientById(estado.clienteId);
          if (c) c.name = nombre;
          guardar();
          toast("Cliente actualizado", nombre);
        } else {
          const nuevo = { id: uid("c"), name: nombre, color: ["accent", "gold", "neutral"][datos.clients.length % 3] };
          datos.clients.push(nuevo);
          guardar();
          toast("Cliente agregado", nombre);
        }
        return true;
      },
    });
  }

  function dialogoCopia() {
    abrirDialogo({
      titulo: "Copia de seguridad",
      detalle: "Copiá este texto y guardalo donde quieras. Para restaurarlo, pegá acá una copia anterior y tocá Restaurar.",
      cuerpo: '<textarea id="dlg-copia" class="backup-area" spellcheck="false" aria-label="Datos en formato de texto">' +
        esc(JSON.stringify(datos)) + "</textarea>",
      cancelar: "Cerrar",
      extra: '<button type="button" class="btn btn-outline spacer" data-a="copiar-todo">Copiar al portapapeles</button>',
      ok: "Restaurar",
      onOk: () => {
        const texto = $dlg.querySelector("#dlg-copia").value.trim();
        try {
          const entrante = JSON.parse(texto);
          if (!entrante || !Array.isArray(entrante.clients) || !Array.isArray(entrante.tasks)) throw new Error("formato");
          datos = { clients: entrante.clients, tasks: entrante.tasks, ejemplos: Boolean(entrante.ejemplos) };
          guardar();
          toast("Datos restaurados", plural(datos.tasks.length, "tarea", "tareas"));
          return true;
        } catch (e) {
          toast("Esa copia no se entiende", "Pegá el texto completo, tal cual lo copiaste.");
          return false;
        }
      },
    });
  }

  /* ---------- acciones ---------- */
  function crearTarea(draft) {
    const tarea = Object.assign({}, draft, {
      id: uid("t"),
      title: draft.title.trim(),
      status: "pending",
      createdAt: new Date().toISOString(),
      completedAt: null,
    });
    datos.tasks.push(tarea);
    guardar();
    toast("Tarea creada", tarea.title);
    return tarea;
  }

  function borrarTarea(id) {
    const i = datos.tasks.findIndex((t) => t.id === id);
    if (i === -1) return;
    const [tarea] = datos.tasks.splice(i, 1);
    guardar();
    render();
    toast("Tarea eliminada", tarea.title, () => {
      datos.tasks.push(tarea);
      guardar();
      render();
    });
  }

  const ACCIONES = {
    ir: (el) => ir(el.dataset.v),

    interpretar: () => {
      const texto = estado.captura.trim();
      if (!texto) return;
      const r = interpretar(texto, datos.clients);
      estado.borrador = r.draft;
      estado.adivinado = r.guessed;
      render();
      const campo = document.getElementById("inline-titulo");
      if (campo) { campo.focus(); campo.setSelectionRange(campo.value.length, campo.value.length); }
    },
    "cancelar-borrador": () => {
      estado.borrador = null;
      estado.adivinado = null;
      render();
      const c = document.getElementById("captura");
      if (c) c.focus();
    },
    "crear-borrador": () => {
      if (!estado.borrador || !estado.borrador.title.trim()) return;
      crearTarea(estado.borrador);
      estado.borrador = null;
      estado.adivinado = null;
      estado.captura = "";
      render();
      const c = document.getElementById("captura");
      if (c) c.focus();
    },
    "crear-desde-busqueda": () => {
      const r = interpretar(estado.consulta, datos.clients);
      dialogoTarea("Nueva tarea", r.draft, () => {
        if (!dlgDraft.title.trim()) return false;
        crearTarea(dlgDraft);
        estado.consulta = "";
        document.getElementById("search").value = "";
        estado.vista = "hoy";
        return true;
      });
    },

    toggle: (el) => {
      const t = datos.tasks.find((x) => x.id === el.dataset.id);
      if (!t) return;
      const completando = t.status !== "completed";
      t.status = completando ? "completed" : "pending";
      t.completedAt = completando ? new Date().toISOString() : null;
      guardar();
      render();
      if (completando) toast("Listo", t.title);
    },
    curso: (el) => {
      const t = datos.tasks.find((x) => x.id === el.dataset.id);
      if (!t) return;
      t.status = t.status === "in_progress" ? "pending" : "in_progress";
      guardar();
      render();
    },
    borrar: (el) => borrarTarea(el.dataset.id),
    editar: (el) => {
      const t = datos.tasks.find((x) => x.id === el.dataset.id);
      if (!t) return;
      const draft = {
        title: t.title, description: t.description, clientId: t.clientId,
        priority: t.priority, dueDate: t.dueDate, dueTime: t.dueTime, category: t.category,
      };
      dialogoTarea("Editar tarea", draft, () => {
        if (!dlgDraft.title.trim()) return false;
        Object.assign(t, dlgDraft, { title: dlgDraft.title.trim() });
        guardar();
        toast("Tarea actualizada", t.title);
        return true;
      }, '<button type="button" class="btn btn-danger spacer" data-a="borrar-desde-dialogo" data-id="' + t.id + '">' + icon("trash") + "Eliminar</button>");
    },
    "borrar-desde-dialogo": (el) => {
      const id = el.dataset.id;
      cerrarDialogo();
      borrarTarea(id);
    },

    "abrir-cliente": (el) => {
      estado.clienteId = el.dataset.id;
      estado.vista = "cliente";
      estado.pestana = "pending";
      estado.categoria = "todas";
      estado.consulta = "";
      document.getElementById("search").value = "";
      document.getElementById("scroll").scrollTop = 0;
      render();
    },
    pestana: (el) => { estado.pestana = el.dataset.v; estado.categoria = "todas"; render(); },
    categoria: (el) => { estado.categoria = el.dataset.v; render(); },
    "nueva-tarea": () => {
      const draft = {
        title: "", description: "", clientId: estado.clienteId,
        priority: "medium", dueDate: null, dueTime: null, category: "Otro",
      };
      dialogoTarea("Nueva tarea", draft, () => {
        if (!dlgDraft.title.trim()) return false;
        crearTarea(dlgDraft);
        return true;
      });
    },
    "nuevo-cliente": () => dialogoCliente(null),
    "renombrar-cliente": () => {
      const c = clientById(estado.clienteId);
      if (c) dialogoCliente(c.name);
    },
    "eliminar-cliente": () => {
      const c = clientById(estado.clienteId);
      if (!c) return;
      const suyas = datos.tasks.filter((t) => t.clientId === c.id).length;
      abrirDialogo({
        titulo: "¿Eliminar " + c.name + "?",
        detalle: suyas
          ? "Sus " + plural(suyas, "tarea sigue", "tareas siguen") + " acá, pero quedan sin cliente asignado."
          : "No tiene tareas asociadas.",
        ok: "Eliminar cliente",
        onOk: () => {
          datos.tasks.forEach((t) => { if (t.clientId === c.id) t.clientId = null; });
          datos.clients = datos.clients.filter((x) => x.id !== c.id);
          guardar();
          estado.vista = "clientes";
          estado.clienteId = null;
          toast("Cliente eliminado", c.name);
          return true;
        },
      });
    },

    dia: (el) => { estado.elegido = el.dataset.v; estado.ancla = el.dataset.v; render(); },
    "cal-vista": (el) => { estado.calVista = el.dataset.v; render(); },
    "cal-paso": (el) => {
      const n = Number(el.dataset.v);
      estado.ancla = estado.calVista === "semana" ? addDays(estado.ancla, n * 7) : addMonths(estado.ancla, n);
      render();
    },
    "cal-hoy": () => { estado.ancla = today(); estado.elegido = today(); render(); },

    "ocultar-ejemplos": () => { datos.ejemplos = false; guardar(); render(); },

    tema: (el) => elegirTema(el.dataset.v),
    copia: () => dialogoCopia(),
    "copiar-todo": () => {
      const area = $dlg.querySelector("#dlg-copia");
      area.select();
      const ok = navigator.clipboard
        ? navigator.clipboard.writeText(area.value).then(() => true, () => false)
        : Promise.resolve(false);
      ok.then((copiado) => {
        toast(copiado ? "Copiado" : "Seleccioná y copiá a mano",
          copiado ? "Guardalo donde quieras." : "El navegador no dejó copiar solo.");
      });
    },
    ejemplos: () => {
      abrirDialogo({
        titulo: "¿Cargar los datos de ejemplo?",
        detalle: "Reemplaza los clientes y tareas que tengas ahora en este navegador.",
        ok: "Cargar ejemplos",
        onOk: () => {
          datos = ejemplos();
          guardar();
          estado.vista = "hoy";
          toast("Datos de ejemplo cargados");
          return true;
        },
      });
    },
    vaciar: () => {
      abrirDialogo({
        titulo: "¿Empezar de cero?",
        detalle: "Se borran todos los clientes y tareas guardados en este navegador.",
        ok: "Vaciar todo",
        onOk: () => {
          datos = { clients: [], tasks: [], ejemplos: false };
          guardar();
          estado.vista = "hoy";
          estado.clienteId = null;
          toast("Listo, quedó vacío");
          return true;
        },
      });
    },

    "cerrar-dialogo": () => cerrarDialogo(),
    "ok-dialogo": () => {
      const fn = dlgOnOk;
      if (!fn || fn() !== false) {
        cerrarDialogo();
        render();
      }
    },
  };

  /* ---------- eventos ---------- */
  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-a]");
    if (!el) return;
    const accion = ACCIONES[el.dataset.a];
    if (!accion) return;
    e.preventDefault();
    accion(el);
  });

  // Los campos escriben directo en el borrador: si re-renderizáramos en cada
  // tecla, el cursor saltaría y escribir sería un infierno.
  function borradorDe(destino) {
    return destino === "dlg" ? dlgDraft : estado.borrador;
  }

  document.addEventListener("input", (e) => {
    const el = e.target;
    if (el.id === "captura") {
      estado.captura = el.value;
      const boton = document.getElementById("captura-enviar");
      if (boton) boton.disabled = !el.value.trim();
      return;
    }
    if (el.id === "search") {
      estado.consulta = el.value;
      document.getElementById("scroll").scrollTop = 0;
      render();
      return;
    }
    const campo = el.dataset && el.dataset.f;
    if (!campo) return;
    const draft = borradorDe(el.dataset.target);
    if (!draft) return;
    draft[campo] = el.value === "" && (campo === "dueDate" || campo === "dueTime" || campo === "clientId") ? null : el.value;
  });

  // Los botones de prioridad se actualizan a mano por el mismo motivo.
  document.addEventListener("click", (e) => {
    const el = e.target.closest('[data-a="prioridad"]');
    if (!el) return;
    const draft = borradorDe(el.dataset.target);
    if (!draft) return;
    draft.priority = el.dataset.v;
    el.parentElement.querySelectorAll("button").forEach((b) => {
      b.setAttribute("aria-pressed", String(b === el));
    });
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && e.target.id === "captura") {
      e.preventDefault();
      ACCIONES.interpretar();
      return;
    }
    if (e.key === "Enter" && $dlg.open && e.target.tagName === "INPUT") {
      e.preventDefault();
      ACCIONES["ok-dialogo"]();
      return;
    }
    if (e.key === "Escape" && !$dlg.open && document.getElementById("search").value) {
      estado.consulta = "";
      document.getElementById("search").value = "";
      render();
    }
  });

  $dlg.addEventListener("close", () => { dlgDraft = null; dlgOnOk = null; });

  /* ---------- arranque ---------- */
  aplicarTema(temaGuardado());

  const guardados = cargar();
  if (guardados) datos = Object.assign({ ejemplos: false }, guardados);
  else { datos = ejemplos(); guardar(); }

  render();
  if (!almacenamientoOk) {
    toast("Este navegador no guarda datos", "Podés usar la app, pero se borra al cerrar la pestaña.");
  }

  // El reloj de los recordatorios: una vez por minuto alcanza.
  setTimeout(function tick() {
    if (!$dlg.open && !estado.borrador && !estado.consulta.trim() && estado.vista === "hoy") render();
    setTimeout(tick, 60000);
  }, 60000 - (Date.now() % 60000));
</script>

</body>
</html>
