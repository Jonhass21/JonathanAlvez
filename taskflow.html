<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="Clientes, tareas y recordatorios en una sola pagina. Escribis lo que tenes que hacer y el sistema lo ordena." />
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#06080d" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="TaskFlow" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-180.png" />
<style>
  :root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; background: #fff; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
<title>TaskFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&family=Fustat:wght@500;600;700;800&display=swap"
/>

<style>
  /* ============================================================
     Sistema visual: lienzo blanco, auras azules difusas, paneles
     de vidrio líquido y un único azul de marca para lo accionable.
     Los colores semánticos (vencido, en curso, prioridad) son otra
     familia y nunca hacen de acento.
     ============================================================ */
  :root {
    --canvas: #ffffff;
    --canvas-2: #f7f9fc;

    --blue: #0084ff;
    --blue-hover: #0074e0;
    --blue-deep: #0066cc;
    --blue-wash: #eef6ff;
    --blue-ink: #0069cc;

    --ink: #000000;
    --ink-body: #171717;
    --ink-soft: #6b7280;
    --ink-faint: #9ca3af;

    --glass-a: rgba(255, 255, 255, 0.75);
    --glass-b: rgba(255, 255, 255, 0.45);
    --glass-edge: rgba(255, 255, 255, 0.7);
    --glass-inset: inset 0 2.5px 4px rgba(255, 255, 255, 0.8);
    --ring: rgba(0, 0, 0, 0.05);
    --hairline: rgba(0, 0, 0, 0.08);
    --tint: rgba(0, 0, 0, 0.05);
    --tint-strong: rgba(0, 0, 0, 0.1);

    --aura-1: rgba(96, 177, 255, 0.22);
    --aura-2: rgba(49, 154, 255, 0.18);

    --rose: #f43f5e;
    --rose-deep: #e11d48;
    --amber: #f59e0b;
    --amber-deep: #d97706;
    --green: #10b981;
    --green-deep: #059669;
    --purple: #9333ea;
    --purple-deep: #7e22ce;

    --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
    --shadow-card: 0 12px 32px -4px rgba(0, 132, 255, 0.12);
    --shadow-lift: 0 18px 50px -12px rgba(15, 23, 42, 0.18);
    --blue-glow: 0 10px 25px -5px rgba(0, 132, 255, 0.25);

    --r-sm: 12px;
    --r-md: 16px;
    --r-lg: 20px;
    --r-xl: 24px;

    --robo-a: #ffffff;
    --robo-b: #e8f1fb;
    --robo-borde: rgba(0, 78, 150, 0.14);
    --robo-panel: #d5e6f7;
    --robo-linea: #b9cfe4;

    --font-display: "Outfit", "Segoe UI", system-ui, sans-serif;
    --font-brand: "Fustat", "Outfit", system-ui, sans-serif;
    --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --canvas: #06080d;
      --canvas-2: #0b0f17;
      --blue: #3aa0ff;
      --blue-hover: #56afff;
      --blue-deep: #1b8bf5;
      --blue-wash: #0e1b2b;
      --blue-ink: #8cc6ff;
      --ink: #ffffff;
      --ink-body: #eef1f6;
      --ink-soft: #949cad;
      --ink-faint: #6b7280;
      --glass-a: rgba(255, 255, 255, 0.08);
      --glass-b: rgba(255, 255, 255, 0.035);
      --glass-edge: rgba(255, 255, 255, 0.12);
      --glass-inset: inset 0 1.5px 2px rgba(255, 255, 255, 0.1);
      --ring: rgba(255, 255, 255, 0.06);
      --hairline: rgba(255, 255, 255, 0.1);
      --tint: rgba(255, 255, 255, 0.06);
      --tint-strong: rgba(255, 255, 255, 0.12);
      --aura-1: rgba(35, 110, 200, 0.22);
      --aura-2: rgba(20, 90, 190, 0.18);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
      --shadow-card: 0 12px 32px -4px rgba(0, 0, 0, 0.5);
      --shadow-lift: 0 18px 50px -12px rgba(0, 0, 0, 0.65);
      --robo-a: #1b2433;
      --robo-b: #131a26;
      --robo-borde: rgba(255, 255, 255, 0.14);
      --robo-panel: #22303f;
      --robo-linea: #3a4a5e;
      --blue-glow: 0 10px 25px -5px rgba(0, 132, 255, 0.35);
    }
  }

  :root[data-theme="dark"] {
    --canvas: #06080d;
    --canvas-2: #0b0f17;
    --blue: #3aa0ff;
    --blue-hover: #56afff;
    --blue-deep: #1b8bf5;
    --blue-wash: #0e1b2b;
    --blue-ink: #8cc6ff;
    --ink: #ffffff;
    --ink-body: #eef1f6;
    --ink-soft: #949cad;
    --ink-faint: #6b7280;
    --glass-a: rgba(255, 255, 255, 0.08);
    --glass-b: rgba(255, 255, 255, 0.035);
    --glass-edge: rgba(255, 255, 255, 0.12);
    --glass-inset: inset 0 1.5px 2px rgba(255, 255, 255, 0.1);
    --ring: rgba(255, 255, 255, 0.06);
    --hairline: rgba(255, 255, 255, 0.1);
    --tint: rgba(255, 255, 255, 0.06);
    --tint-strong: rgba(255, 255, 255, 0.12);
    --aura-1: rgba(35, 110, 200, 0.22);
    --aura-2: rgba(20, 90, 190, 0.18);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
    --shadow-card: 0 12px 32px -4px rgba(0, 0, 0, 0.5);
    --shadow-lift: 0 18px 50px -12px rgba(0, 0, 0, 0.65);
    --robo-a: #1b2433;
    --robo-b: #131a26;
    --robo-borde: rgba(255, 255, 255, 0.14);
    --robo-panel: #22303f;
    --robo-linea: #3a4a5e;
    --blue-glow: 0 10px 25px -5px rgba(0, 132, 255, 0.35);
  }

  /* ---------- base ---------- */
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--canvas);
    color: var(--ink-body);
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.5;
    letter-spacing: -0.2px;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 8px; }
  .num, time { font-variant-numeric: tabular-nums; }
  ::selection { background: rgba(0, 132, 255, 0.18); }

  /* ---------- aura de fondo ---------- */
  .aura { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .aura i { position: absolute; display: block; border-radius: 50%; }
  .aura .a1 { top: -26%; right: -14%; width: 520px; height: 520px; background: var(--aura-1); filter: blur(120px); }
  .aura .a2 { bottom: -30%; left: -18%; width: 460px; height: 460px; background: var(--aura-2); filter: blur(120px); }
  .aura .a3 { top: 46%; left: 52%; width: 340px; height: 340px; background: var(--aura-1); filter: blur(120px); opacity: .45; }

  /* ---------- vidrio líquido ---------- */
  .glass {
    background: linear-gradient(to bottom right, var(--glass-a), var(--glass-b));
    backdrop-filter: blur(20px) saturate(1.4);
    -webkit-backdrop-filter: blur(20px) saturate(1.4);
    border: 1px solid var(--glass-edge);
    box-shadow: var(--glass-inset), 0 0 0 1px var(--ring), var(--shadow-card);
  }
  .glass-deep {
    background: linear-gradient(to bottom right, var(--glass-a), var(--glass-b));
    backdrop-filter: blur(50px) saturate(1.6);
    -webkit-backdrop-filter: blur(50px) saturate(1.6);
    border: 1px solid var(--glass-edge);
    box-shadow: var(--glass-inset), 0 0 0 1px var(--ring), var(--shadow-lift);
  }

  /* ---------- estructura ---------- */
  .app { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100%; }

  .navbar {
    position: fixed; top: 14px; left: 0; right: 0; z-index: 50;
    display: flex; justify-content: center;
    padding-inline: 16px; pointer-events: none;
    animation: drop-in .6s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .navbar-inner {
    pointer-events: auto;
    width: 100%; max-width: 1180px;
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px 8px 16px;
    border-radius: var(--r-md);
  }
  .brand {
    display: flex; align-items: center; gap: 8px;
    font-family: var(--font-brand); font-weight: 800; font-size: 20px;
    letter-spacing: -0.5px; color: var(--ink); white-space: nowrap;
  }
  .brand .ic { width: 22px; height: 22px; color: var(--blue); }
  .navlinks { display: none; align-items: center; gap: 2px; margin-inline: auto; }
  .navlinks button {
    padding: 7px 12px; border-radius: 10px;
    font-size: 14px; font-weight: 500; color: var(--ink-soft);
    transition: color .18s, background .18s;
  }
  .navlinks button:hover { color: var(--ink); background: var(--tint); }
  .navlinks button[aria-current="page"] { color: var(--ink); background: var(--tint); font-weight: 600; }

  .search { position: relative; margin-left: auto; width: 190px; }
  .search .ic { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--ink-faint); pointer-events: none; }
  .search input {
    width: 100%; height: 36px; padding: 0 12px 0 33px;
    border-radius: var(--r-sm); border: 1px solid var(--tint-strong);
    background: var(--tint); font-size: 13.5px; color: var(--ink-body);
    transition: border-color .18s, background .18s;
  }
  .search input::placeholder { color: var(--ink-faint); }
  .search input:focus { outline: none; border-color: var(--blue); background: var(--canvas); }
  .search input::-webkit-search-cancel-button { filter: grayscale(1) opacity(.5); }

  .scroll { flex: 1; overflow-y: auto; overflow-x: hidden; }
  .page {
    width: 100%; max-width: 1180px; margin: 0 auto;
    padding: 86px 24px 120px;
    display: flex; flex-direction: column; gap: 28px;
  }
  .page.narrow { max-width: 820px; }

  /* barra inferior flotante (móvil) */
  .tabbar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
    display: flex; justify-content: center;
    padding: 0 12px calc(12px + env(safe-area-inset-bottom, 0px));
    pointer-events: none;
  }
  .tabbar-inner {
    pointer-events: auto; display: flex; width: 100%; max-width: 440px;
    padding: 6px; border-radius: var(--r-lg);
  }
  .tabbar-inner button {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 7px 2px; border-radius: 14px;
    font-size: 10.5px; font-weight: 600; color: var(--ink-soft);
    transition: color .18s, background .18s;
  }
  .tabbar-inner button[aria-current="page"] { color: var(--blue); background: var(--tint); }
  .tabbar-inner .ic { width: 19px; height: 19px; }

  @media (min-width: 900px) {
    .navlinks { display: flex; }
    .search { width: 230px; }
    .tabbar { display: none; }
    .page { padding: 96px 32px 64px; }
  }
  @media (min-width: 1100px) {
    .page { padding-inline: 48px; }
  }

  /* ---------- tipografía ---------- */
  h1 {
    font-family: var(--font-display); font-weight: 800;
    font-size: 26px; line-height: 1.12; letter-spacing: -1.2px;
    margin: 0; color: var(--ink); text-wrap: balance;
  }
  .display {
    font-family: var(--font-display); font-weight: 900;
    font-size: clamp(33px, 5.6vw, 52px); line-height: 1.08;
    letter-spacing: -2.4px; margin: 10px 0 0; color: var(--ink);
    text-wrap: balance;
  }
  h2 {
    font-family: var(--font-display); font-weight: 700;
    font-size: 12px; letter-spacing: .02em; text-transform: uppercase;
    margin: 0; color: var(--ink-soft);
  }
  .eyebrow { margin: 0; font-size: 11.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-faint); }
  .lead { margin: 14px 0 0; font-size: 17px; line-height: 1.6; letter-spacing: -0.4px; color: var(--ink-soft); max-width: 46ch; }
  .frase { margin: 10px 0 0; font-size: 13px; font-style: italic; color: var(--ink-faint); max-width: 46ch; }
  .sub { margin: 5px 0 0; font-size: 13.5px; color: var(--ink-soft); }
  .muted { color: var(--ink-soft); }
  .faint { color: var(--ink-faint); }
  section { display: flex; flex-direction: column; gap: 10px; }

  /* ---------- grilla de Hoy ---------- */
  .hero-grid { display: grid; grid-template-columns: 1fr; gap: 28px; }
  @media (min-width: 1000px) {
    .hero-grid { grid-template-columns: 5fr 7fr; gap: 44px; align-items: start; }
    .hero-left { position: sticky; top: 96px; }
  }
  .hero-left, .hero-right { display: flex; flex-direction: column; gap: 20px; min-width: 0; }

  /* ---------- botones ---------- */
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    height: 38px; padding: 0 15px; border-radius: var(--r-sm);
    font-size: 13.5px; font-weight: 600; letter-spacing: -0.2px;
    border: 1px solid transparent; white-space: nowrap;
    transition: transform .15s cubic-bezier(0.16, 1, 0.3, 1), background .18s, box-shadow .18s, color .18s;
  }
  .btn:active { transform: scale(.975); }
  .btn .ic { width: 15px; height: 15px; }
  .btn-primary {
    background: var(--blue); color: #fff; font-weight: 700;
    box-shadow: inset 0 4px 4px rgba(255, 255, 255, 0.25), var(--blue-glow);
  }
  .btn-primary:hover { background: var(--blue-hover); transform: scale(1.02); }
  .btn-soft { background: var(--tint); border-color: var(--tint-strong); color: var(--ink); }
  .btn-soft:hover { background: var(--tint-strong); box-shadow: var(--shadow-sm); }
  .btn-quiet { color: var(--ink-soft); font-weight: 500; }
  .btn-quiet:hover { background: var(--tint); color: var(--ink); }
  .btn-danger { color: var(--ink-faint); font-weight: 500; }
  .btn-danger:hover { background: rgba(244, 63, 94, 0.1); color: var(--rose-deep); }

  /* botón con perla: el patrón del CTA principal */
  .btn-bead { height: 44px; padding: 0 6px 0 20px; border-radius: var(--r-md); gap: 14px; font-size: 14px; }
  .btn-bead .bead {
    width: 32px; height: 32px; border-radius: 50%;
    background: #fff; color: var(--blue);
    display: grid; place-items: center; flex: none;
    transition: transform .2s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .btn-bead:hover .bead { transform: translateX(3px); }
  .btn-bead .bead .ic { width: 16px; height: 16px; }

  .icon-btn {
    width: 32px; height: 32px; border-radius: 10px; flex: none;
    display: grid; place-items: center; color: var(--ink-faint);
    transition: background .18s, color .18s;
  }
  .icon-btn:hover { background: var(--tint); color: var(--ink); }
  .icon-btn.danger:hover { background: rgba(244, 63, 94, 0.1); color: var(--rose-deep); }
  .icon-btn .ic { width: 16px; height: 16px; }

  /* ---------- captura ---------- */
  .capture-row { position: relative; }
  .capture-row input {
    width: 100%; height: 58px; padding: 0 60px 0 18px;
    font-size: 16px; letter-spacing: -0.3px;
    border-radius: var(--r-lg);
    background: linear-gradient(to bottom right, var(--glass-a), var(--glass-b));
    backdrop-filter: blur(20px) saturate(1.4);
    -webkit-backdrop-filter: blur(20px) saturate(1.4);
    border: 1px solid var(--glass-edge);
    box-shadow: var(--glass-inset), 0 0 0 1px var(--ring), var(--shadow-card);
    color: var(--ink-body);
    transition: border-color .2s, box-shadow .2s;
  }
  .capture-row input::placeholder { color: var(--ink-faint); }
  .capture-row input:focus {
    outline: none; border-color: rgba(0, 132, 255, .55);
    box-shadow: var(--glass-inset), 0 0 0 4px rgba(0, 132, 255, .12), var(--shadow-card);
  }
  .capture-send {
    position: absolute; right: 9px; top: 50%; transform: translateY(-50%);
    width: 40px; height: 40px; border-radius: var(--r-sm);
    display: grid; place-items: center;
    background: var(--blue); color: #fff;
    box-shadow: inset 0 3px 4px rgba(255, 255, 255, 0.28), var(--blue-glow);
    transition: opacity .18s, background .18s, transform .15s;
  }
  .capture-send:hover { background: var(--blue-hover); }
  .capture-send[disabled] { opacity: .3; cursor: default; box-shadow: none; }
  .capture-send .ic { width: 17px; height: 17px; }
  .hint { margin: 10px 2px 0; font-size: 12px; color: var(--ink-faint); }

  .confirm { border-radius: var(--r-xl); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  .confirm-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .confirm-head strong { font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: -0.4px; color: var(--ink); }

  /* ---------- campos ---------- */
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .field > label, .field > .label {
    font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
    color: var(--ink-faint); display: flex; align-items: center; gap: 6px;
  }
  .guessed { width: 5px; height: 5px; border-radius: 50%; background: var(--blue); flex: none; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 9px 11px;
    border: 1px solid var(--hairline); border-radius: 11px;
    background: var(--canvas); font-size: 14px; color: var(--ink-body);
    transition: border-color .18s, box-shadow .18s;
  }
  .field textarea { resize: vertical; min-height: 58px; }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(0, 132, 255, .12);
  }
  .seg { display: flex; gap: 6px; }
  .seg button {
    flex: 1; padding: 8px 10px; border-radius: 11px;
    border: 1px solid var(--hairline); background: var(--canvas);
    font-size: 13px; font-weight: 600; color: var(--ink-soft);
    transition: all .18s;
  }
  .seg button:hover { background: var(--tint); }
  .seg button[aria-pressed="true"] {
    border-color: transparent; background: var(--blue); color: #fff;
    box-shadow: inset 0 3px 4px rgba(255, 255, 255, .22), var(--blue-glow);
  }
  .actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; align-items: center; }

  /* ---------- perlas de icono (el patrón de las tarjetas flotantes) ---------- */
  .bead-icon {
    width: 34px; height: 34px; border-radius: 11px; flex: none;
    display: grid; place-items: center; color: #fff;
  }
  .bead-icon .ic { width: 17px; height: 17px; }
  .bead-blue   { background: linear-gradient(to bottom right, #0084ff, #0066cc); box-shadow: 0 4px 12px rgba(0, 132, 255, .3); }
  .bead-green  { background: linear-gradient(to bottom right, #10b981, #059669); box-shadow: 0 4px 12px rgba(16, 185, 129, .3); }
  .bead-purple { background: linear-gradient(to bottom right, #9333ea, #7e22ce); box-shadow: 0 4px 12px rgba(147, 51, 234, .3); }
  .bead-amber  { background: linear-gradient(to bottom right, #f59e0b, #d97706); box-shadow: 0 4px 12px rgba(245, 158, 11, .3); }
  .bead-rose   { background: linear-gradient(to bottom right, #f43f5e, #e11d48); box-shadow: 0 4px 12px rgba(244, 63, 94, .3); }

  .float-card {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 16px; border-radius: var(--r-lg);
    transition: transform .25s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .float-card:hover { transform: scale(1.02) rotate(.4deg); }
  .float-card:hover, .float-card:focus-visible { animation-play-state: paused; }
  .float-card .fc-text { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; flex: 1; }
  .float-card .fc-1 { font-size: 13.5px; font-weight: 800; letter-spacing: -0.3px; color: var(--ink-body); }
  .float-card .fc-2 { font-size: 11px; font-weight: 600; color: var(--ink-soft); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .float-card.fc-wrap { flex-wrap: wrap; }
  .float-card.fc-wrap .fc-text { flex: 1 1 150px; }
  .float-card.fc-wrap .fc-2 { white-space: normal; overflow: visible; }
  .float-card .fc-acciones { display: flex; align-items: center; gap: 6px; margin-left: auto; flex: none; }
  .float-a { animation: float-a 5s ease-in-out infinite; }
  .float-b { animation: float-b 5.5s ease-in-out infinite; }
  .float-c { animation: float-c 4.8s ease-in-out infinite; }

  /* ---------- tareas ---------- */

  /* ---------- superficies ---------- */

  .proof {

  /* ---------- clientes ---------- */

    -webkit-backdrop-filter: blur(20px) saturate(1.4);
    border: 1px solid var(--glass-edge);
    box-shadow: var(--glass-inset), 0 0 0 1px var(--ring), 0 6px 18px -8px rgba(15, 23, 42, .1);

  .tabs { display: flex; gap: 4px; padding: 5px; border-radius: 14px; background: var(--tint); width: fit-content; max-width: 100%; overflow-x: auto; }

  dialog {

  }
  .taski-fab:hover { transform: scale(1.06); }

  .taski-panel {
    position: fixed; z-index: 56;

  .taski-head { display: flex; align-items: center; gap: 11px; padding: 14px 16px; border-bottom: 1px solid var(--ring); }

  .msg.me { margin-left: auto; background: var(--blue); color: #fff; border-bottom-right-radius: 6px; box-shadow: var(--blue-glow); }
  .msg.it { background: var(--tint); color: var(--ink-body); border-bottom-left-radius: 6px; }

  .taski-form input {
    width: 100%; height: 40px; padding: 0 44px 0 14px;

  .taski-form input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(0, 132, 255, .12); }
  .taski-send {
    position: absolute; right: 18px; top: 50%; transform: translateY(-50%);

  .toasts {

  /* ---------- Taski dibujado ---------- */

  .robo-punto-2 { animation-delay: .25s; }

  @keyframes robo-flota { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  @keyframes robo-sombra { 0%, 100% { transform: scaleX(1); opacity: .1; } 50% { transform: scaleX(.9); opacity: .07; } }
  @keyframes robo-parpadeo { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.08); } }

  @keyframes robo-gira { to { transform: rotate(360deg); } }
  @keyframes robo-gira-inv { to { transform: rotate(-360deg); } }

  /* La escena de bienvenida de Taski: el robot con las tarjetas suspendidas. */
  .escena { position: relative; padding: 4px 0 10px; }
  .escena .robo-wrap { display: flex; justify-content: center; }

    text-align: left; max-width: 58%;
  }
  .escena .float-card .fc-1 { font-size: 12px; }
  .escena .float-card .fc-2 { font-size: 10px; }

  .escena .c1 { top: 4%; right: 6px; }

  .escena .float-card:hover { transform: scale(1.04) rotate(.6deg); }

  @media (prefers-reduced-motion: reduce) {
    .robo-flota, .robo-sombra, .robo-ojos, .robo-luz, .robo-punto,

  }

  /* ---------- animaciones ---------- */
  @keyframes drop-in { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: none; } }
  @keyframes rise-in { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
  @keyframes pop-in { from { opacity: 0; transform: translateY(8px) scale(.985); } to { opacity: 1; transform: none; } }
  @keyframes float-a { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(2px, -8px); } }
  @keyframes float-b { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-2px, 8px); } }
  @keyframes float-c { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-1px, -10px); } }

  /* Solo en la primera pintada: si se repitiera en cada cambio de estado,

  .enter > * { animation: rise-in .9s cubic-bezier(0.16, 1, 0.3, 1) both; }

  }

<script>
  "use strict";

  /* ============================================================

     No hay servidor, no hay cuentas, no hay nada que configurar.
     ============================================================ */

  /* ---------- iconos ---------- */
  const ICONS = {

  };

  function icon(name, cls) {
    return (
      '<svg class="ic ' + (cls || "") + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      ICONS[name] + "</svg>"
    );
  }

  const esc = (value) =>
    String(value == null ? "" : value).replace(/[&<>"']/g, (c) => (
      { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
    ));

  const plural = (n, one, many) => n + " " + (n === 1 ? one : many);

  /* ---------- fechas ----------
     Las fechas se guardan como "AAAA-MM-DD" y se parsean por partes.
     Pasar un ISO directo a new Date() lo interpreta como UTC y puede
     correr el día según la zona horaria, así que acá no se hace nunca. */
  const DIAS = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
  const DIAS_CORTO = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];
  const MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
  const MESES_CORTO = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];

  function parseDay(s) {
    const [y, m, d] = s.split("-").map(Number);
    return new Date(y, m - 1, d);
  }
  function toDay(date) {
    const m = String(date.getMonth() + 1).padStart(2, "0");
    const d = String(date.getDate()).padStart(2, "0");
    return date.getFullYear() + "-" + m + "-" + d;
  }
  const today = () => toDay(new Date());
  function addDays(s, n) {
    const d = parseDay(s);
    d.setDate(d.getDate() + n);
    return toDay(d);
  }
  /** Suma meses de verdad: sumar 30 días saltea febrero y desfasa la grilla. */
  function addMonths(s, n) {
    const d = parseDay(s);
    const day = d.getDate();
    d.setDate(1);
    d.setMonth(d.getMonth() + n);
    const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    d.setDate(Math.min(day, last));
    return toDay(d);
  }
  const dow = (s) => parseDay(s).getDay();
  const isPast = (s) => s < today();
  const isToday = (s) => s === today();
  const diffDays = (a, b) => Math.round((parseDay(b) - parseDay(a)) / 86400000);

  function friendlyDate(s) {
    if (!s) return "Sin fecha";
    if (isToday(s)) return "Hoy";
    if (s === addDays(today(), 1)) return "Mañana";
    const d = parseDay(s);
    if (isPast(s)) return DIAS_CORTO[d.getDay()] + " " + d.getDate() + " " + MESES_CORTO[d.getMonth()];
    const diff = diffDays(today(), s);
    if (diff > 1 && diff < 7) return DIAS[d.getDay()];
    return d.getDate() + " " + MESES_CORTO[d.getMonth()];
  }
  const longDate = (s) => {
    const d = parseDay(s);
    return DIAS[d.getDay()] + " " + d.getDate() + " de " + MESES[d.getMonth()];
  };
  const monthLabel = (s) => {
    const d = parseDay(s);
    return MESES[d.getMonth()] + " " + d.getFullYear();
  };

  function weekOf(s) {
    const i = dow(s);
    const monday = addDays(s, i === 0 ? -6 : 1 - i);
    return Array.from({ length: 7 }, (_, k) => addDays(monday, k));
  }
  function monthGrid(s) {
    const d = parseDay(s);
    const first = toDay(new Date(d.getFullYear(), d.getMonth(), 1));
    const last = toDay(new Date(d.getFullYear(), d.getMonth() + 1, 0));
    const start = weekOf(first)[0];
    const end = weekOf(last)[6];
    const days = [];
    let cur = start;
    while (cur <= end) {
      days.push(cur);
      cur = addDays(cur, 1);
    }
    return days;
  }
  function minutesUntil(day, time) {
    const [h, m] = time.split(":").map(Number);
    const target = parseDay(day);
    target.setHours(h, m, 0, 0);
    return Math.round((target - Date.now()) / 60000);
  }
  function minutesLabel(min) {
    if (min <= 0) return "Ahora";
    if (min < 60) return "En " + min + " min";
    const h = Math.floor(min / 60);
    const r = min % 60;
    return r === 0 ? "En " + h + " h" : "En " + h + " h " + r + " min";
  }

  /* ---------- interpretación del texto ----------
     No es inteligencia artificial: son patrones de cómo escribe uno.
     Cubre lo frecuente y lo que no entiende se corrige en el paso de
     confirmación, que igual hay que mirar. */
  const CATEGORIAS = ["Contenido", "Diseño", "Publicidad", "Administración", "Reunión", "Cliente", "Otro"];
  const PRIORIDADES = [
    { value: "low", label: "Baja" },
    { value: "medium", label: "Media" },
    { value: "high", label: "Alta" },
  ];
  const SEMANA = [["domingo", 0], ["lunes", 1], ["martes", 2], ["miercoles", 3], ["jueves", 4], ["viernes", 5], ["sabado", 6]];
  const MES_NUM = { enero: 0, febrero: 1, marzo: 2, abril: 3, mayo: 4, junio: 5, julio: 6, agosto: 7, septiembre: 8, setiembre: 8, octubre: 9, noviembre: 10, diciembre: 11 };
  const CAT_CLAVES = [
    ["Reunión", ["reunion", "reunirme", "llamada", "llamar", "meet", "zoom", "videollamada", "coordinar"]],
    ["Publicidad", ["campana", "pauta", "ads", "anuncio", "publicidad"]],
    ["Administración", ["factura", "facturar", "cobro", "cobrar", "pago", "pagar", "informe", "reporte", "presupuesto", "propuesta", "contrato"]],
    ["Diseño", ["disen", "pieza", "piezas", "arte", "banner", "flyer", "portada", "logo", "identidad", "paleta"]],
    ["Contenido", ["reel", "reels", "carrusel", "historia", "historias", "post", "contenido", "video", "story", "stories", "guion", "copy", "grilla"]],
    ["Cliente", ["aprobacion", "feedback", "aprobar"]],
  ];
  const MULETILLAS = ["tengo que ", "tenemos que ", "hay que ", "necesito ", "necesitamos ", "debo ", "quiero ", "acordate de ", "acordarme de ", "recordar ", "recordarme ", "me toca "];
  const COLGANTES = ["de", "del", "para", "a", "al", "con", "en", "el", "la", "los", "las", "que", "y"];

  /** Minúsculas y sin tildes, pero carácter por carácter: así las posiciones
      siguen coincidiendo con el texto original y se puede recortar por índice. */
  function fold(s) {
    return s.toLowerCase()
      .replace(/[áàä]/g, "a").replace(/[éèë]/g, "e").replace(/[íìï]/g, "i")
      .replace(/[óòö]/g, "o").replace(/[úùü]/g, "u").replace(/ñ/g, "n");
  }

  function widenLeft(folded, span) {
    const before = folded.slice(0, span.start).replace(/\s+$/, "");
    for (const w of COLGANTES) {
      if (before.endsWith(" " + w) || before === w) return { start: before.length - w.length, end: span.end };
    }
    return span;
  }
  function matchSpan(folded, re) {
    const m = folded.match(re);
    if (!m || m.index === undefined) return null;
    return { m, span: { start: m.index, end: m.index + m[0].length } };
  }

  function findClient(folded, clients) {
    const sorted = clients.slice().sort((a, b) => b.name.length - a.name.length);
    for (const c of sorted) {
      const needle = fold(c.name);
      const i = folded.indexOf(needle);
      if (i !== -1) return { id: c.id, span: { start: i, end: i + needle.length } };
    }
    return null;
  }

  function findDate(folded) {
    const hoy = today();
    // El orden importa: "pasado mañana" va antes que "mañana", si no
    // \bmanana\b coincide adentro y la tarea cae un día antes.
    const simples = [
      [/\bpasado manana\b/, () => addDays(hoy, 2)],
      [/\bhoy\b/, () => hoy],
      [/\bmanana\b/, () => addDays(hoy, 1)],
      [/\b(la semana que viene|la proxima semana|la semana proxima)\b/, () => addDays(hoy, 7)],
      [/\b(el mes que viene|el proximo mes)\b/, () => addMonths(hoy, 1)],
      [/\b(este finde|el finde|fin de semana)\b/, () => addDays(hoy, (6 - dow(hoy) + 7) % 7)],
    ];
    for (const [re, resolve] of simples) {
      const hit = matchSpan(folded, re);
      if (hit) return { date: resolve(), span: hit.span };
    }
    const enDias = matchSpan(folded, /\ben (\d{1,2}) dias?\b/);
    if (enDias) return { date: addDays(hoy, Number(enDias.m[1])), span: enDias.span };

    const conMes = matchSpan(folded, new RegExp("\\b(\\d{1,2}) de (" + Object.keys(MES_NUM).join("|") + ")\\b"));
    if (conMes) {
      const base = parseDay(hoy);
      let cand = toDay(new Date(base.getFullYear(), MES_NUM[conMes.m[2]], Number(conMes.m[1])));
      if (cand < hoy) cand = toDay(new Date(base.getFullYear() + 1, MES_NUM[conMes.m[2]], Number(conMes.m[1])));
      return { date: cand, span: conMes.span };
    }

    const numerica = matchSpan(folded, /\b(\d{1,2})[/-](\d{1,2})(?:[/-](\d{2,4}))?\b/);
    if (numerica) {
      const d = Number(numerica.m[1]);
      const mo = Number(numerica.m[2]) - 1;
      const base = parseDay(hoy);
      let y = numerica.m[3] ? Number(numerica.m[3]) : base.getFullYear();
      if (y < 100) y += 2000;
      if (mo >= 0 && mo <= 11 && d >= 1 && d <= 31) {
        let cand = toDay(new Date(y, mo, d));
        if (!numerica.m[3] && cand < hoy) cand = toDay(new Date(y + 1, mo, d));
        return { date: cand, span: numerica.span };
      }
    }

    for (const [nombre, idx] of SEMANA) {
      const hit = matchSpan(folded, new RegExp("\\b(el |este |proximo |el proximo )?" + nombre + "( que viene)?\\b"));
      if (!hit) continue;
      const forzarSiguiente = Boolean(hit.m[2]) || /proximo/.test(hit.m[1] || "");
      let delta = idx - dow(hoy);
      if (delta < 0) delta += 7;
      if (delta === 0 && forzarSiguiente) delta = 7;
      return { date: addDays(hoy, delta), span: hit.span };
    }
    return null;
  }

  function findTime(folded) {
    const build = (h, m) => String(Math.min(h, 23)).padStart(2, "0") + ":" + String(Math.min(m, 59)).padStart(2, "0");
    const ajustar = (h, sufijo) => {
      if (sufijo === "pm" && h < 12) return h + 12;
      if (sufijo === "am" && h === 12) return 0;
      if (!sufijo && h >= 1 && h <= 7 && /\b(tarde|de la tarde|a la tarde)\b/.test(folded)) return h + 12;
      return h;
    };
    const mediodia = matchSpan(folded, /\b(al |a la |el )?mediodia\b/);
    if (mediodia) return { time: "12:00", span: mediodia.span };
    const una = matchSpan(folded, /\ba la una\b/);
    if (una) return { time: "13:00", span: una.span };
    const media = matchSpan(folded, /\ba las (\d{1,2}) y (media|cuarto)\b/);
    if (media) return { time: build(ajustar(Number(media.m[1])), media.m[2] === "media" ? 30 : 15), span: media.span };
    const alas = matchSpan(folded, /\ba las (\d{1,2})(?::(\d{2}))?\s?(am|pm|hs|h)?\b/);
    if (alas) return { time: build(ajustar(Number(alas.m[1]), alas.m[3]), Number(alas.m[2] || 0)), span: alas.span };
    const conHs = matchSpan(folded, /\b(\d{1,2})(?::(\d{2}))?\s?(hs|h|am|pm)\b/);
    if (conHs) return { time: build(ajustar(Number(conHs.m[1]), conHs.m[3]), Number(conHs.m[2] || 0)), span: conHs.span };
    const reloj = matchSpan(folded, /\b([01]?\d|2[0-3]):([0-5]\d)\b/);
    if (reloj) return { time: build(Number(reloj.m[1]), Number(reloj.m[2])), span: reloj.span };
    return null;
  }

  function findCategory(folded) {
    for (const [cat, claves] of CAT_CLAVES) {
      if (claves.some((k) => folded.includes(k))) return { category: cat, matched: true };
    }
    return { category: "Otro", matched: false };
  }
  function findPriority(folded) {
    if (/\b(urgente|urgentisimo|importante|prioridad alta|ya mismo|cuanto antes|si o si)\b/.test(folded)) return { priority: "high", matched: true };
    if (/\b(sin apuro|cuando pueda|cuando puedas|no es urgente|prioridad baja|algun dia)\b/.test(folded)) return { priority: "low", matched: true };
    return { priority: "medium", matched: false };
  }

  function buildTitle(original, spans) {
    const merged = [];
    spans.slice().sort((a, b) => a.start - b.start).forEach((s) => {
      const last = merged[merged.length - 1];
      if (last && s.start <= last.end) last.end = Math.max(last.end, s.end);
      else merged.push({ start: s.start, end: s.end });
    });
    let text = original;
    merged.slice().reverse().forEach((s) => {
      text = text.slice(0, s.start) + " " + text.slice(s.end);
    });
    let out = text.replace(/\s{2,}/g, " ").trim();
    let changed = true;
    while (changed) {
      changed = false;
      const low = fold(out);
      for (const p of MULETILLAS) {
        if (low.startsWith(p)) { out = out.slice(p.length).trim(); changed = true; break; }
      }
    }
    out = out.replace(/^[,:;.\-–—\s]+/, "").replace(/[,:;\-–—\s]+$/, "").replace(/\s{2,}/g, " ").trim();
    const words = out.split(" ");
    while (words.length > 1 && COLGANTES.includes(fold(words[words.length - 1]))) words.pop();
    out = words.join(" ");
    if (!out) return "Nueva tarea";
    return out.charAt(0).toUpperCase() + out.slice(1);
  }

  function interpretar(texto, clients) {
    const original = texto.trim();
    const folded = fold(original);
    const cliente = findClient(folded, clients);
    const fecha = findDate(folded);
    const hora = findTime(folded);
    const cat = findCategory(folded);
    const pri = findPriority(folded);
    const spans = [];
    if (cliente) spans.push(widenLeft(folded, cliente.span));
    if (fecha) spans.push(widenLeft(folded, fecha.span));
    if (hora) spans.push(widenLeft(folded, hora.span));
    return {
      draft: {
        title: buildTitle(original, spans),
        description: "",
        clientId: cliente ? cliente.id : null,
        priority: pri.priority,
        dueDate: fecha ? fecha.date : null,
        dueTime: hora ? hora.time : null,
        category: cat.category,
      },
      guessed: {
        client: Boolean(cliente),
        date: Boolean(fecha),
        time: Boolean(hora),
        category: cat.matched,
        priority: pri.matched,
      },
    };
  }

  /* ---------- datos ----------
     Una sola clave de localStorage con todo adentro. Si el navegador la
     bloquea (modo privado, sitio sin permisos) la app sigue funcionando
     en memoria y avisa una vez. */
  const CLAVE = "taskflow.datos.v1";
  const CLAVE_TEMA = "taskflow.tema.v1";

  let datos = { clients: [], tasks: [], ejemplos: false };
  let almacenamientoOk = true;

  const uid = (p) => p + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 7);

  function cargar() {
    try {
      const raw = localStorage.getItem(CLAVE);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.clients) && Array.isArray(parsed.tasks)) return parsed;
      }
    } catch (e) {
      almacenamientoOk = false;
    }
    return null;
  }

  function guardar() {
    try {
      localStorage.setItem(CLAVE, JSON.stringify(datos));
      return true;
    } catch (e) {
      if (almacenamientoOk) {
        almacenamientoOk = false;
        toast("No se pudieron guardar los cambios", "El navegador tiene el almacenamiento lleno o bloqueado.");
      }
      return false;
    }
  }

  function ejemplos() {
    const hoy = today();
    const clients = [
      { id: "san-lucas", name: "San Lucas", color: "accent" },
      { id: "estilo-car", name: "Estilo Car", color: "gold" },
      { id: "estilo-campo", name: "Estilo Campo", color: "neutral" },
      { id: "kaia", name: "Kaia", color: "accent" },
      { id: "modhaus", name: "ModHaus", color: "gold" },
    ];
    const t = (clientId, title, priority, dueDate, dueTime, category, status) => ({
      id: uid("t"), title, description: "", clientId, priority, dueDate, dueTime,
      category, status: status || "pending",
      createdAt: new Date().toISOString(),
      completedAt: status === "completed" ? new Date().toISOString() : null,
    });
    const tasks = [
      t("san-lucas", "Preparar reel sobre mamografía", "high", hoy, "10:00", "Contenido"),
      t("san-lucas", "Revisar métricas de la campaña", "medium", addDays(hoy, 1), null, "Publicidad"),
      t("san-lucas", "Enviar propuesta de tracking", "high", addDays(hoy, -2), null, "Administración"),
      t("san-lucas", "Coordinar grabación de testimonios", "low", addDays(hoy, 5), null, "Reunión"),
      t("estilo-car", "Revisar calendario de contenido", "medium", hoy, "12:00", "Contenido"),
      t("estilo-car", "Diseñar piezas de promo de service", "medium", addDays(hoy, 2), null, "Diseño"),
      t("estilo-car", "Enviar informe mensual de Instagram", "high", addDays(hoy, 1), null, "Administración", "in_progress"),
      t("estilo-campo", "Planificar carrusel de temporada", "low", addDays(hoy, 3), null, "Contenido"),
      t("estilo-campo", "Actualizar catálogo de productos", "medium", addDays(hoy, -1), null, "Otro"),
      t("estilo-campo", "Reunión de seguimiento mensual", "medium", addDays(hoy, 4), "16:30", "Reunión"),
      t("kaia", "Enviar piezas para aprobación", "medium", hoy, "15:00", "Contenido"),
      t("kaia", "Definir paleta de la próxima colección", "high", addDays(hoy, 1), null, "Diseño"),
      t("kaia", "Grabar videos nuevos", "low", addDays(hoy, 6), null, "Contenido"),
      t("kaia", "Cerrar informe de resultados", "medium", addDays(hoy, -4), null, "Administración", "completed"),
      t("modhaus", "Armar plan de contenidos del mes", "high", addDays(hoy, 2), null, "Contenido"),
      t("modhaus", "Revisar pauta activa", "medium", hoy, "18:00", "Publicidad", "in_progress"),
      t("modhaus", "Enviar propuesta de rediseño de feed", "low", addDays(hoy, 7), null, "Diseño"),
    ];
    return { clients, tasks, ejemplos: true };
  }

  const clientById = (id) => datos.clients.find((c) => c.id === id) || null;
  const clientName = (id) => { const c = clientById(id); return c ? c.name : ""; };

  const RANGO = { high: 0, medium: 1, low: 2 };
  function ordenar(tasks) {
    return tasks.slice().sort((a, b) => {
      if (a.dueDate && b.dueDate) {
        if (a.dueDate !== b.dueDate) return a.dueDate < b.dueDate ? -1 : 1;
        if (a.dueTime && b.dueTime && a.dueTime !== b.dueTime) return a.dueTime < b.dueTime ? -1 : 1;
        if (a.dueTime && !b.dueTime) return -1;
        if (!a.dueTime && b.dueTime) return 1;
      } else if (a.dueDate) return -1;
      else if (b.dueDate) return 1;
      return RANGO[a.priority] - RANGO[b.priority];
    });
  }
  const abiertas = () => datos.tasks.filter((t) => t.status !== "completed");
  const vencidas = () => ordenar(abiertas().filter((t) => t.dueDate && isPast(t.dueDate)));
  const deHoy = () => ordenar(abiertas().filter((t) => t.dueDate && isToday(t.dueDate)));
  const proximas = () => ordenar(abiertas().filter((t) => t.dueDate && !isPast(t.dueDate) && !isToday(t.dueDate)));
  const delDia = (day) => ordenar(abiertas().filter((t) => t.dueDate === day));

  function recordatorios() {
    return deHoy()
      .filter((t) => t.dueTime)
      .map((t) => ({ t, min: minutesUntil(t.dueDate, t.dueTime) }))
      .filter((x) => x.min >= 0 && x.min <= 60)
      .sort((a, b) => a.min - b.min);
  }

  const sinTildes = (s) => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  function buscar(q) {
    const term = sinTildes(q.trim());
    if (!term) return { tasks: [], clients: [] };
    const palabras = term.split(/\s+/);
    const tasks = ordenar(datos.tasks.filter((t) => {
      const heno = sinTildes([t.title, t.description, t.category, clientName(t.clientId)].join(" "));
      return palabras.every((w) => heno.includes(w));
    }));
    const clients = datos.clients.filter((c) => sinTildes(c.name).includes(term));
    return { tasks, clients };
  }

  /* ---------- estado de la pantalla ---------- */
  const estado = {
    vista: "hoy",
    clienteId: null,
    pestana: "pending",
    categoria: "todas",
    calVista: "semana",
    ancla: today(),
    elegido: today(),
    consulta: "",
    captura: "",
    borrador: null,
    adivinado: null,
  };

  /* ---------- avisos ---------- */
  const $toasts = document.getElementById("toasts");
  function toast(titulo, detalle, deshacer) {
    const el = document.createElement("div");
    el.className = "toast";
    el.innerHTML =
      '<div class="toast-body"><p class="toast-title">' + esc(titulo) + "</p>" +
      (detalle ? '<p class="toast-desc">' + esc(detalle) + "</p>" : "") + "</div>" +
      (deshacer ? '<button type="button" class="undo">Deshacer</button>' : "") +
      '<button type="button" class="icon-btn" aria-label="Cerrar aviso">' + icon("x") + "</button>";
    const cerrar = () => { clearTimeout(timer); el.remove(); };
    if (deshacer) el.querySelector(".undo").addEventListener("click", () => { cerrar(); deshacer(); });
    el.querySelector(".icon-btn").addEventListener("click", cerrar);
    const timer = setTimeout(cerrar, 5200);
    $toasts.appendChild(el);
    while ($toasts.children.length > 3) $toasts.firstElementChild.remove();
  }

  /* ---------- tema ---------- */
  function temaGuardado() {
    try {
      const v = localStorage.getItem(CLAVE_TEMA);
      if (v === "claro" || v === "oscuro" || v === "sistema") return v;
    } catch (e) { /* sin acceso: queda en sistema */ }
    return "sistema";
  }
  function aplicarTema(pref) {
    if (pref === "sistema") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", pref === "oscuro" ? "dark" : "light");
  }
  function elegirTema(pref) {
    try { localStorage.setItem(CLAVE_TEMA, pref); } catch (e) { /* no se recuerda */ }
    aplicarTema(pref);
    render();
  }

  /* ---------- Taski ----------
     Responde con lo que hay guardado acá: no hay modelo ni conexión.
     Reconoce cliente, "hoy", "mañana", "esta semana", vencidas y lo
     completado; cualquier otra cosa devuelve los ejemplos que sí entiende. */
  function lineaTarea(t, conCliente) {
    const nombre = conCliente === false ? "" : clientName(t.clientId);
    const cuando = t.dueDate ? friendlyDate(t.dueDate) + (t.dueTime ? " " + t.dueTime : "") : "sin fecha";
    return "• " + t.title + (nombre ? " (" + nombre + ")" : "") + " — " + cuando;
  }
  const listar = (tareas, conCliente) => tareas.map((t) => lineaTarea(t, conCliente)).join("\n");

  function taskiResponde(pregunta) {
    const q = fold(pregunta);
    const sueltas = abiertas();

    const c = datos.clients.slice().sort((a, b) => b.name.length - a.name.length)
      .find((x) => q.includes(fold(x.name)));

    if (c) {
      const suyas = sueltas.filter((t) => t.clientId === c.id);
      if (/vencid|atrasad/.test(q)) {
        const v = suyas.filter((t) => t.dueDate && isPast(t.dueDate));
        return v.length
          ? "De " + c.name + " tenés " + plural(v.length, "tarea vencida", "tareas vencidas") + ":\n\n" + listar(ordenar(v), false)
          : "No tenés nada vencido de " + c.name + ".";
      }
      if (/\bhoy\b/.test(q)) {
        const h = suyas.filter((t) => t.dueDate && isToday(t.dueDate));
        return h.length
          ? "Hoy tenés " + plural(h.length, "tarea", "tareas") + " de " + c.name + ":\n\n" + listar(ordenar(h), false)
          : "Hoy no tenés nada de " + c.name + ".";
      }
      return suyas.length
        ? "Tenés " + plural(suyas.length, "tarea pendiente", "tareas pendientes") + " de " + c.name + ":\n\n" + listar(ordenar(suyas), false)
        : "No tenés tareas pendientes de " + c.name + ".";
    }

    if (/vencid|atrasad/.test(q)) {
      const v = vencidas();
      return v.length
        ? "Tenés " + plural(v.length, "tarea vencida", "tareas vencidas") + ":\n\n" + listar(v)
        : "No tenés tareas vencidas. Vas al día.";
    }
    if (/hice|complet|termin|cerre/.test(q)) {
      const semana = weekOf(today());
      const hechas = datos.tasks.filter((t) => t.status === "completed" && t.completedAt && semana.indexOf(t.completedAt.slice(0, 10)) !== -1);
      return hechas.length
        ? "Esta semana cerraste " + plural(hechas.length, "tarea", "tareas") + ":\n\n" + listar(hechas)
        : "Todavía no marcaste ninguna tarea como completada esta semana.";
    }
    if (/\bmanana\b/.test(q)) {
      const m = delDia(addDays(today(), 1));
      return m.length ? "Mañana tenés " + plural(m.length, "tarea", "tareas") + ":\n\n" + listar(m) : "Mañana no tenés nada agendado.";
    }
    if (/\bhoy\b/.test(q)) {
      const h = deHoy();
      return h.length ? "Hoy tenés " + plural(h.length, "tarea", "tareas") + ":\n\n" + listar(h) : "Hoy no tenés tareas. Buen momento para adelantar algo.";
    }
    if (/semana/.test(q)) {
      const semana = weekOf(today());
      const dela = ordenar(sueltas.filter((t) => t.dueDate && semana.indexOf(t.dueDate) !== -1));
      return dela.length ? "Esta semana tenés " + plural(dela.length, "tarea", "tareas") + ":\n\n" + listar(dela) : "No tenés nada agendado para esta semana.";
    }
    if (/pendient|que tengo|falta|proxim|sigue/.test(q)) {
      const p = ordenar(sueltas).slice(0, 8);
      return p.length ? "Tus próximas tareas:\n\n" + listar(p) : "No tenés tareas pendientes. Estás al día.";
    }
    return [
      "Esa no la entendí. Probá con algo así:",
      "",
      "• ¿Qué tengo hoy?",
      "• ¿Qué tengo pendiente de Kaia?",
      "• ¿Qué está vencido?",
      "• ¿Qué hice esta semana?",
    ].join("\n");
  }

  const TASKI_SUGERENCIAS = ["¿Qué tengo hoy?", "¿Qué está vencido?", "¿Qué hice esta semana?"];

  /* ---------- piezas de interfaz ---------- */
  const PRIO_LABEL = { high: "alta", medium: "media", low: "baja" };

  function filaTarea(t, opts) {
    const o = opts || {};
    const hecho = t.status === "completed";
    const vencida = !hecho && t.dueDate && isPast(t.dueDate);
    const hoyEs = !hecho && t.dueDate && isToday(t.dueDate);
    const nombre = o.ocultarCliente ? "" : clientName(t.clientId);
    const cuando = t.dueDate
      ? '<span class="when ' + (vencida ? "overdue" : hoyEs ? "today" : "") + '">' +
        esc(friendlyDate(t.dueDate)) + (t.dueTime ? " · " + esc(t.dueTime) : "") +
        (vencida ? " · vencida" : "") + "</span>"
      : "";
    return (
      '<div class="task" data-done="' + (hecho ? 1 : 0) + '">' +
        '<button type="button" class="check" data-done="' + (hecho ? 1 : 0) + '" data-a="toggle" data-id="' + t.id + '" ' +
          'aria-label="' + (hecho ? "Marcar como pendiente" : "Completar") + ': ' + esc(t.title) + '">' +
          (hecho ? icon("check") : "") +
        "</button>" +
        '<button type="button" class="task-body" data-a="editar" data-id="' + t.id + '" aria-label="Editar: ' + esc(t.title) + '">' +
          '<p class="task-title">' + esc(t.title) + "</p>" +
          (t.description ? '<p class="task-note">' + esc(t.description) + "</p>" : "") +
          '<div class="meta">' +
            (nombre ? '<span class="client">' + esc(nombre) + "</span>" : "") +
            '<span class="tag">' + esc(t.category) + "</span>" +
            cuando +
            (t.status === "in_progress" ? '<span class="pill-progress">En curso</span>' : "") +
          "</div>" +
        "</button>" +
        '<div class="task-side">' +
          (hecho ? "" :
            '<button type="button" class="icon-btn" data-a="curso" data-id="' + t.id + '" ' +
            'title="' + (t.status === "in_progress" ? "Pausar" : "Empezar") + '" ' +
            'aria-label="' + (t.status === "in_progress" ? "Pausar" : "Empezar") + ': ' + esc(t.title) + '"' +
            (t.status === "in_progress" ? ' style="color: var(--purple)"' : "") + ">" + icon("play") + "</button>") +
          '<button type="button" class="icon-btn danger" data-a="borrar" data-id="' + t.id + '" ' +
            'title="Eliminar" aria-label="Eliminar: ' + esc(t.title) + '">' + icon("trash") + "</button>" +
          '<span class="dot ' + t.priority + '" title="Prioridad ' + PRIO_LABEL[t.priority] + '"></span>' +

  }

  const vacio = (titulo, detalle) =>

    tasks.length
      ? '<div class="list">' + tasks.map((t) => filaTarea(t, opts)).join("") + "</div>"
      : vacio((opts && opts.vacio) || "No hay tareas acá", opts && opts.vacioDetalle);

  /* ---------- Hoy ---------- */

  /* El saludo va por franja horaria y abajo una frase del momento. La frase
     se elige por día del año, no al azar: si cambiara en cada render, la
     pantalla parpadearía cada vez que marcás una tarea. */
  const FRANJAS = [
    { hasta: 5, saludo: "Buenas noches", frases: [
      "A esta hora no interrumpe nadie.",
      "Silencio total: buen momento para lo que pide cabeza.",

  function saludoDelMomento() {
    const ahora = new Date();
    const franja = FRANJAS.find((f) => ahora.getHours() < f.hasta) || FRANJAS[FRANJAS.length - 1];
    const diaDelAnio = Math.floor((ahora - new Date(ahora.getFullYear(), 0, 0)) / 86400000);
    return { saludo: franja.saludo, frase: franja.frases[diaDelAnio % franja.frases.length] };
  }

  function vistaHoy() {
    const momento = saludoDelMomento();
    const saludo = momento.saludo;
    const v = vencidas();
    const h = deHoy();
    const sig = proximas()[0] || null;
    const recs = recordatorios();
    const sueltas = abiertas();
    const primera = h[0] || null;
    const altas = h.filter((t) => t.priority === "high").length;

    /* La prueba social del diseño original, pero con datos reales:
       las iniciales de los clientes que tenés cargados. */
    const TONOS = ["bead-blue", "bead-green", "bead-purple", "bead-amber", "bead-rose"];
    const pilas = datos.clients.slice(0, 4).map((c, i) =>
      '<span class="' + TONOS[i % TONOS.length] + '" title="' + esc(c.name) + '">' + esc(c.name.charAt(0).toUpperCase()) + "</span>").join("");
    const proof = datos.clients.length
      ? '<div class="proof"><span class="stack">' + pilas + "</span>" +
        '<span class="txt"><b>' + plural(datos.clients.length, "cliente", "clientes") + "</b> · " +
        plural(sueltas.length, "tarea abierta", "tareas abiertas") + "</span></div>"
      : "";

    let izquierda = "";

    if (datos.ejemplos) {
      izquierda +=
        '<div class="float-card glass fc-wrap">' +
          '<span class="bead-icon bead-amber">' + icon("spark") + "</span>" +
          '<span class="fc-text"><span class="fc-1">Datos de ejemplo</span>' +
            '<span class="fc-2">Para que veas cómo se usa</span></span>' +
          '<span class="fc-acciones">' +
            '<button type="button" class="btn btn-soft" data-a="vaciar">Empezar de cero</button>' +
            '<button type="button" class="icon-btn" data-a="ocultar-ejemplos" aria-label="Ocultar este aviso">' + icon("x") + "</button>" +
          "</span>" +
        "</div>";
    }

    izquierda +=
      "<header>" + proof +
        '<h1 class="display">' + saludo + ",<br />Jona</h1>" +
        '<p class="lead">' +
          (h.length === 0 ? "Hoy no tenés tareas agendadas." : "Hoy tenés " + plural(h.length, "tarea", "tareas") + ".") +
          (altas ? " " + plural(altas, "es de prioridad alta", "son de prioridad alta") + "." : "") +
          (v.length ? " Quedaron " + v.length + " sin completar de días anteriores." : "") +
        "</p>" +
        '<p class="frase">' + esc(momento.frase) + "</p>" +
      "</header>";

    izquierda +=
      '<div>' +
        '<div class="capture-row">' +
          '<input id="captura" autocomplete="off" placeholder="¿Qué necesitás hacer?" aria-label="¿Qué necesitás hacer?" value="' + esc(estado.captura) + '" />' +
          '<button type="button" class="capture-send" id="captura-enviar" data-a="interpretar" aria-label="Interpretar y crear tarea"' +
          (estado.captura.trim() ? "" : " disabled") + ">" + icon("up") + "</button>" +
        "</div>" +
        (estado.borrador ? "" : '<p class="hint">Escribilo como lo dirías: “Preparar el reel de San Lucas mañana a las 10”.</p>') +
      "</div>";

    if (estado.borrador) {
      izquierda +=
        '<div class="confirm glass">' +
          '<div class="confirm-head"><strong>Entendí esto</strong>' +
            '<span class="faint" style="font-size:11.5px">Corregí lo que haga falta</span></div>' +
          camposTarea(estado.borrador, estado.adivinado, "inline") +
          '<div class="actions">' +
            '<button type="button" class="btn btn-quiet" data-a="cancelar-borrador">Cancelar</button>' +
            '<button type="button" class="btn btn-primary btn-bead" data-a="crear-borrador">Crear tarea' +
              '<span class="bead">' + icon("chevron") + "</span></button>" +
          "</div>" +
        "</div>";
    }

    const flotes = ["float-a", "float-b", "float-c"];
    recs.forEach((r, i) => {
      izquierda += tarjetaFlotante("amber", "clock", minutesLabel(r.min),
        r.t.title + (r.t.clientId ? " · " + clientName(r.t.clientId) : ""), flotes[i % 3]);
    });

    if (primera) {
      izquierda += tarjetaFlotante("blue", "spark", "Primera de hoy",
        (primera.clientId ? clientName(primera.clientId) + " · " : "") + primera.title +
        (primera.dueTime ? " — " + primera.dueTime : ""), recs.length ? "" : "float-a");
    }
    if (v.length) {
      izquierda += tarjetaFlotante("rose", "alert", plural(v.length, "tarea vencida", "tareas vencidas"),
        "Sin completar de días anteriores", "float-b");
    }

    let derecha = "";
    if (v.length) derecha += "<section><h2>Vencidas</h2>" + listaTareas(v) + "</section>";
    derecha += "<section><h2>Hoy</h2>" +
      (h.length
        ? listaTareas(h)
        : '<div class="empty empty-robo">' + roboSVG(150) +
          "<p class=\"empty-t\">Nada para hoy</p>" +
          "<p>Aprovechá para adelantar algo de mañana, o contale a Taski lo que tengas en la cabeza.</p></div>") +
      "</section>";
    if (sig) derecha += "<section><h2>Lo siguiente</h2>" + listaTareas([sig]) + "</section>";

    return '<div class="hero-grid"><div class="hero-left">' + izquierda + "</div>" +
      '<div class="hero-right">' + derecha + "</div></div>";
  }

  /* ---------- Clientes ---------- */
  function vistaClientes() {
    const TONOS = { accent: "bead-blue", gold: "bead-amber", neutral: "bead-purple" };
    const filas = datos.clients.map((c) => {
      const suyas = datos.tasks.filter((t) => t.clientId === c.id);
      const pend = suyas.filter((t) => t.status !== "completed");
      const venc = pend.filter((t) => t.dueDate && isPast(t.dueDate)).length;
      const prox = ordenar(pend)[0] || null;
      return (
        '<button type="button" class="client-row" data-a="abrir-cliente" data-id="' + c.id + '">' +
          '<span class="bead-icon ' + (TONOS[c.color] || "bead-blue") + '" style="font-size:14px;font-weight:800">' +
            esc(c.name.charAt(0).toUpperCase()) + "</span>" +
          '<span style="flex:1;min-width:0"><span class="client-name" style="display:block">' + esc(c.name) + "</span>" +
            '<span class="client-next" style="display:block">' +
              (prox ? esc(prox.title) + " · " + esc(friendlyDate(prox.dueDate)) : "Sin tareas pendientes") +
            "</span></span>" +
          (venc ? '<span class="badge">' + venc + " vencida" + (venc === 1 ? "" : "s") + "</span>" : "") +
          '<span class="count num">' + pend.length + "</span>" +
          '<span class="faint" style="display:flex">' + icon("right") + "</span>" +
        "</button>"
      );
    }).join("");

    return (
      '<header style="display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap">' +
        "<div><h1>Clientes</h1>" +
          '<p class="sub">' + plural(datos.clients.length, "cliente", "clientes") + " en total</p></div>" +
        '<button type="button" class="btn btn-primary btn-bead" data-a="nuevo-cliente">Nuevo cliente' +
          '<span class="bead">' + icon("plus") + "</span></button>" +
      "</header>" +
      (datos.clients.length
        ? '<div class="list">' + filas + "</div>"
        : vacio("Todavía no hay clientes", "Agregá el primero para empezar a ordenar las tareas por cuenta."))
    );
  }

  function vistaCliente() {
    const c = clientById(estado.clienteId);
    if (!c) {
      return '<button type="button" class="btn btn-quiet" data-a="ir" data-v="clientes">' + icon("back") + "Clientes</button>" +
        vacio("No encontramos ese cliente");
    }
    const suyas = ordenar(datos.tasks.filter((t) => t.clientId === c.id));
    const pend = suyas.filter((t) => t.status !== "completed");
    const venc = pend.filter((t) => t.dueDate && isPast(t.dueDate)).length;
    const usadas = CATEGORIAS.filter((cat) => suyas.some((t) => t.category === cat));
    const visibles = suyas.filter((t) =>
      t.status === estado.pestana && (estado.categoria === "todas" || t.category === estado.categoria));
    const pestanas = [["pending", "Pendientes"], ["in_progress", "En proceso"], ["completed", "Completadas"]];

    return (
      "<header>" +
        '<button type="button" class="btn btn-quiet" style="padding:0 8px;margin-left:-8px" data-a="ir" data-v="clientes">' +
          icon("back") + "Clientes</button>" +
        '<div style="display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:10px">' +
          '<div style="min-width:0"><h1>' + esc(c.name) + "</h1>" +
            '<p class="sub">' + plural(pend.length, "pendiente", "pendientes") +
            (venc ? " · " + venc + " vencida" + (venc === 1 ? "" : "s") : "") + "</p></div>" +
          '<div style="display:flex;align-items:center;gap:6px;flex:none">' +
            '<button type="button" class="icon-btn" data-a="renombrar-cliente" title="Renombrar" aria-label="Renombrar cliente">' + icon("pencil") + "</button>" +
            '<button type="button" class="icon-btn danger" data-a="eliminar-cliente" title="Eliminar cliente" aria-label="Eliminar cliente">' + icon("trash") + "</button>" +
            '<button type="button" class="btn btn-primary btn-bead" style="margin-left:4px" data-a="nueva-tarea">Nueva tarea' +
              '<span class="bead">' + icon("plus") + "</span></button>" +
          "</div>" +
        "</div>" +
      "</header>" +
      '<div class="tabs" role="tablist">' +
        pestanas.map(([val, label]) => {
          const n = suyas.filter((t) => t.status === val).length;
          return '<button type="button" role="tab" aria-selected="' + (estado.pestana === val) + '" data-a="pestana" data-v="' + val + '">' +
            label + (n ? ' <span class="num" style="opacity:.6">' + n + "</span>" : "") + "</button>";
        }).join("") +
      "</div>" +
      (usadas.length > 1
        ? '<div class="chips">' +
          ["todas"].concat(usadas).map((cat) =>
            '<button type="button" class="chip" aria-pressed="' + (estado.categoria === cat) + '" data-a="categoria" data-v="' + esc(cat) + '">' +
            (cat === "todas" ? "Todas" : esc(cat)) + "</button>").join("") +
          "</div>"
        : "") +
      listaTareas(visibles, { ocultarCliente: true, vacio: "Nada acá por ahora" })
    );
  }

  /* ---------- Calendario ---------- */
  function vistaCalendario() {
    const hoy = today();
    const cuantas = (d) => abiertas().filter((t) => t.dueDate === d).length;
    const celda = (d, fuera) => {
      const n = cuantas(d);
      return (
        '<button type="button" class="day' + (d === hoy ? " is-today" : "") + (fuera ? " out" : "") + '" ' +
        'aria-pressed="' + (d === estado.elegido) + '" data-a="dia" data-v="' + d + '" ' +
        'aria-label="' + esc(longDate(d)) + ", " + plural(n, "tarea", "tareas") + '">' +
          (estado.calVista === "semana" ? '<span class="dow">' + DIAS_CORTO[dow(d)] + "</span>" : "") +
          '<span class="n num">' + parseDay(d).getDate() + "</span>" +
          '<span class="marks">' + Array.from({ length: Math.min(n, 3) }, () => "<i></i>").join("") + "</span>" +
        "</button>"
      );
    };

    let cuadricula;
    if (estado.calVista === "semana") {
      cuadricula = '<div class="week">' + weekOf(estado.ancla).map((d) => celda(d, false)).join("") + "</div>";
    } else {
      const mes = parseDay(estado.ancla).getMonth();
      const cabecera = DIAS_CORTO.slice(1).concat(DIAS_CORTO[0])
        .map((d) => '<span class="dow-head">' + d + "</span>").join("");
      cuadricula = '<div class="month-grid">' + cabecera +
        monthGrid(estado.ancla).map((d) => celda(d, parseDay(d).getMonth() !== mes)).join("") + "</div>";
    }

    const enHoy = estado.ancla === hoy && estado.elegido === hoy;
    return (
      '<header style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">' +
        "<h1>Calendario</h1>" +
        '<div style="display:flex;align-items:center;gap:8px">' +
          (enHoy ? "" : '<button type="button" class="btn btn-soft" data-a="cal-hoy">Hoy</button>') +
          '<div class="tabs">' +
            '<button type="button" role="tab" data-a="cal-vista" data-v="semana" aria-selected="' + (estado.calVista === "semana") + '">Semana</button>' +
            '<button type="button" role="tab" data-a="cal-vista" data-v="mes" aria-selected="' + (estado.calVista === "mes") + '">Mes</button>' +
          "</div>" +
        "</div>" +
      "</header>" +
      '<div class="cal-head">' +
        '<button type="button" class="icon-btn" data-a="cal-paso" data-v="-1" aria-label="Anterior">' + icon("left") + "</button>" +
        '<span class="cal-month">' + esc(monthLabel(estado.ancla)) + "</span>" +
        '<button type="button" class="icon-btn" data-a="cal-paso" data-v="1" aria-label="Siguiente">' + icon("right") + "</button>" +
      "</div>" +
      cuadricula +
      "<section><h2>" + (estado.elegido === hoy ? "Hoy" : esc(longDate(estado.elegido))) + "</h2>" +
        listaTareas(delDia(estado.elegido), { vacio: "Sin tareas para este día" }) + "</section>"
    );
  }
