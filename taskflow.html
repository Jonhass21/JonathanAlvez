      '<section><h2>Apariencia</h2><div class="seg" style="max-width:340px">' +
        opciones.map(([v, l]) =>
          '<button type="button" data-a="tema" data-v="' + v + '" aria-pressed="' + (tema === v) + '">' + l + "</button>").join("") +
      "</div></section>" +
      "<section><h2>Tus datos</h2>" +
        '<p class="sub">Todo se guarda solo en este navegador. Nadie más lo ve y no viaja a ningún lado.</p>' +
        '<div class="rows glass">' +
          '<div class="row"><div><div class="row-label">Copia de seguridad</div>' +
            '<p class="row-desc">Copiá tus datos para guardarlos o pasarlos a otro dispositivo.</p></div>' +
            '<button type="button" class="btn btn-soft" data-a="copia">Abrir</button></div>' +
          '<div class="row"><div><div class="row-label">Cargar datos de ejemplo</div>' +
            '<p class="row-desc">Reemplaza todo por los 5 clientes y las tareas de muestra.</p></div>' +
            '<button type="button" class="btn btn-soft" data-a="ejemplos">Cargar</button></div>' +
          '<div class="row"><div><div class="row-label">Empezar de cero</div>' +
            '<p class="row-desc">Borra todos los clientes y tareas de este navegador.</p></div>' +
            '<button type="button" class="btn btn-soft" data-a="vaciar">Vaciar</button></div>' +
        "</div>" +
        '<p class="hint">Hoy tenés ' + plural(datos.clients.length, "cliente", "clientes") +
          " y " + plural(datos.tasks.length, "tarea", "tareas") + " guardadas.</p>" +
      "</section>" +
      "<section><h2>Sobre Taski</h2>" +
        tarjetaFlotante("blue", "bot", "Taski responde con tus datos",
          "Sin conexión, sin cuentas, sin modelo externo") +
      "</section>"
    );
  }

  /* ---------- Búsqueda ---------- */
  function vistaBusqueda() {
    const r = buscar(estado.consulta);
    const TONOS = { accent: "bead-blue", gold: "bead-amber", neutral: "bead-purple" };
    let html = "<header><h1>Resultados</h1>" +
      '<p class="sub">' + plural(r.tasks.length, "tarea", "tareas") + " y " +
      plural(r.clients.length, "cliente", "clientes") + ' para “' + esc(estado.consulta.trim()) + "”.</p></header>";
    if (r.clients.length) {
      html += '<section><h2>Clientes</h2><div class="list">' +
        r.clients.map((c) =>
          '<button type="button" class="client-row" data-a="abrir-cliente" data-id="' + c.id + '">' +
            '<span class="bead-icon ' + (TONOS[c.color] || "bead-blue") + '" style="font-size:14px;font-weight:800">' +
              esc(c.name.charAt(0).toUpperCase()) + "</span>" +
            '<span style="flex:1;min-width:0" class="client-name">' + esc(c.name) + "</span>" +
            '<span class="faint" style="display:flex">' + icon("right") + "</span></button>").join("") +
        "</div></section>";
    }
    html += "<section><h2>Tareas</h2>" +
      listaTareas(r.tasks, { vacio: "Ninguna tarea coincide", vacioDetalle: "Probá con otra palabra, o con el nombre del cliente." }) +
      "</section>";
    if (r.tasks.length === 0 && r.clients.length === 0) {
      html += '<div class="actions" style="justify-content:flex-start">' +
        '<button type="button" class="btn btn-primary btn-bead" data-a="crear-desde-busqueda">' +
        'Crear “' + esc(estado.consulta.trim()) + '” como tarea<span class="bead">' + icon("plus") + "</span></button></div>";
    }
    return html;
  }

  /* ---------- navegación ---------- */
  const SECCIONES = [
    { id: "hoy", label: "Hoy", icon: "home" },
    { id: "clientes", label: "Clientes", icon: "users" },
    { id: "calendario", label: "Calendario", icon: "calendar" },
    { id: "ajustes", label: "Ajustes", icon: "settings" },
  ];

  const $view = document.getElementById("view");
  const $scroll = document.getElementById("scroll");
  const $search = document.getElementById("search");

  document.getElementById("brand").innerHTML = icon("spark") + "TaskFlow";
  document.getElementById("taski-fab").innerHTML = icon("bot");

  function pintarNav() {
    const activa = estado.consulta.trim() ? "" : estado.vista === "cliente" ? "clientes" : estado.vista;
    document.getElementById("nav-desktop").innerHTML = SECCIONES.map((s) =>
      '<button type="button" data-a="ir" data-v="' + s.id + '"' +
      (activa === s.id ? ' aria-current="page"' : "") + ">" + s.label + "</button>").join("");
    document.getElementById("nav-mobile").innerHTML = SECCIONES.map((s) =>
      '<button type="button" data-a="ir" data-v="' + s.id + '"' +
      (activa === s.id ? ' aria-current="page"' : "") + ">" + icon(s.icon) + "<span>" + s.label + "</span></button>").join("");
  }

  let primeraPintada = true;

  function render() {
    pintarNav();
    const buscando = Boolean(estado.consulta.trim());
    const anchaCompleta = !buscando && estado.vista === "hoy";
    $view.classList.toggle("narrow", !anchaCompleta);

    if (buscando) $view.innerHTML = vistaBusqueda();
    else if (estado.vista === "clientes") $view.innerHTML = vistaClientes();
    else if (estado.vista === "cliente") $view.innerHTML = vistaCliente();
    else if (estado.vista === "calendario") $view.innerHTML = vistaCalendario();
    else if (estado.vista === "ajustes") $view.innerHTML = vistaAjustes();
    else $view.innerHTML = vistaHoy();

    // La entrada escalonada corre una sola vez: repetirla en cada cambio de
    // estado haría temblar la pantalla al marcar una tarea.
    if (primeraPintada) {
      $view.classList.add("enter");
      primeraPintada = false;
      setTimeout(() => $view.classList.remove("enter"), 1400);
    }
    pintarTaski();
  }

  function ir(vista) {
    estado.vista = vista;
    estado.consulta = "";
    $search.value = "";
    $scroll.scrollTop = 0;
    render();
  }

  /* ---------- Taski ---------- */
  const $fab = document.getElementById("taski-fab");
  const $taski = document.getElementById("taski-panel");

  /* La bienvenida de Taski: el robot con tres tarjetas suspendidas, que son
     las preguntas que sabe contestar. Desaparece con la primera pregunta. */
  function escenaTaski() {
    const tarjeta = (pos, tono, ico, arriba, abajo, flote, pregunta) =>
      '<button type="button" class="float-card glass ' + flote + " " + pos + '" ' +
      'data-a="taski-sugerencia" data-v="' + esc(pregunta) + '">' +
        '<span class="bead-icon bead-' + tono + '">' + icon(ico) + "</span>" +
        '<span class="fc-text"><span class="fc-1">' + esc(arriba) + "</span>" +
          '<span class="fc-2">' + esc(abajo) + "</span></span>" +
      "</button>";
    return (
      '<div class="escena">' +
        '<div class="robo-wrap">' + roboSVG(190) + "</div>" +
        tarjeta("c1", "blue", "list", "¿Qué tengo hoy?", "para la jornada", "float-a", "¿Qué tengo hoy?") +
        tarjeta("c2", "green", "doc", "¿Qué está vencido?", "sin completar", "float-b", "¿Qué está vencido?") +
        tarjeta("c3", "purple", "check", "¿Qué hice?", "esta semana", "float-c", "¿Qué hice esta semana?") +
      "</div>"
    );
  }

  function pintarTaski() {
    $fab.setAttribute("aria-expanded", String(taski.abierto));
    $fab.setAttribute("aria-label", taski.abierto ? "Cerrar a Taski" : "Abrir a Taski");
    $fab.innerHTML = taski.abierto ? icon("x") : icon("bot");
    $taski.hidden = !taski.abierto;
    if (!taski.abierto) return;

    const borrador = $taski.querySelector("#taski-input");
    const texto = borrador ? borrador.value : "";

    $taski.innerHTML =
      '<div class="taski-head">' +
        '<span class="bead-icon bead-blue">' + icon("bot") + "</span>" +
        "<div><div class=\"taski-name\">Taski</div>" +
          '<p class="taski-sub">Responde con tus tareas y clientes</p></div>' +
        '<button type="button" class="icon-btn" style="margin-left:auto" data-a="taski" aria-label="Cerrar">' + icon("x") + "</button>" +
      "</div>" +
      '<div class="taski-log" id="taski-log">' +
        taski.mensajes.map((m) => '<div class="msg ' + m.de + '">' + esc(m.texto) + "</div>").join("") +
      "</div>" +
      (taski.mensajes.length <= 1 ? escenaTaski() : "") +
      '<form class="taski-form" id="taski-form">' +
        '<input id="taski-input" autocomplete="off" placeholder="Preguntale algo a Taski…" aria-label="Preguntale algo a Taski" value="' + esc(texto) + '" />' +
        '<button type="submit" class="taski-send" id="taski-send" aria-label="Enviar"' + (texto.trim() ? "" : " disabled") + ">" +
          icon("up") + "</button>" +
      "</form>";

    const log = $taski.querySelector("#taski-log");
    log.scrollTop = log.scrollHeight;
    $taski.querySelector("#taski-form").addEventListener("submit", (e) => {
      e.preventDefault();
      preguntarATaski($taski.querySelector("#taski-input").value);
    });
  }

  function preguntarATaski(texto) {
    const q = texto.trim();
    if (!q) return;
    taski.mensajes.push({ de: "me", texto: q });
    taski.mensajes.push({ de: "it", texto: taskiResponde(q) });
    pintarTaski();
    const campo = $taski.querySelector("#taski-input");
    if (campo) { campo.value = ""; campo.focus(); }
    const enviar = $taski.querySelector("#taski-send");
    if (enviar) enviar.disabled = true;
  }

  /* ---------- diálogos ---------- */
  const $dlg = document.getElementById("dialog");
  let dlgDraft = null;
  let dlgOnOk = null;

  function abrirDialogo(opts) {
    dlgOnOk = opts.onOk || null;
    $dlg.innerHTML =
      '<div class="dlg-head"><div><h2 class="dlg-title" id="dialog-title">' + esc(opts.titulo) + "</h2>" +
        (opts.detalle ? '<p class="dlg-desc">' + esc(opts.detalle) + "</p>" : "") + "</div>" +
        '<button type="button" class="icon-btn" data-a="cerrar-dialogo" aria-label="Cerrar">' + icon("x") + "</button></div>" +
      (opts.cuerpo ? '<div class="dlg-body">' + opts.cuerpo + "</div>" : "") +
      '<div class="dlg-foot">' +
        (opts.extra || "") +
        '<button type="button" class="btn btn-quiet" data-a="cerrar-dialogo">' + esc(opts.cancelar || "Cancelar") + "</button>" +
        (opts.ok ? '<button type="button" class="btn btn-primary" data-a="ok-dialogo">' + esc(opts.ok) + "</button>" : "") +
      "</div>";
    $dlg.showModal();
    const primero = $dlg.querySelector("input, textarea, select");
    if (primero) primero.focus();
  }

  function cerrarDialogo() {
    if ($dlg.open) $dlg.close();
    dlgDraft = null;
    dlgOnOk = null;
  }

  function dialogoTarea(titulo, draft, onOk, extra) {
    dlgDraft = draft;
    abrirDialogo({
      titulo,
      cuerpo: camposTarea(draft, null, "dlg"),
      ok: titulo === "Editar tarea" ? "Guardar" : "Crear tarea",
      onOk,
      extra,
    });
  }

  function dialogoCliente(nombreActual) {
    const editando = Boolean(nombreActual);
    abrirDialogo({
      titulo: editando ? "Renombrar cliente" : "Nuevo cliente",
      detalle: editando ? "" : "Con este nombre lo va a reconocer cuando lo escribas en una tarea.",
      cuerpo: '<div class="field"><label for="dlg-cliente">Nombre</label>' +
        '<input id="dlg-cliente" value="' + esc(nombreActual || "") + '" placeholder="Ej. San Lucas" /></div>',
      ok: editando ? "Guardar" : "Agregar",
      onOk: () => {
        const nombre = $dlg.querySelector("#dlg-cliente").value.trim();
        if (!nombre) return false;
        if (editando) {
          const c = clientById(estado.clienteId);
          if (c) c.name = nombre;
          guardar();
          toast("Cliente actualizado", nombre);
        } else {
          datos.clients.push({ id: uid("c"), name: nombre, color: ["accent", "gold", "neutral"][datos.clients.length % 3] });
          guardar();
          toast("Cliente agregado", nombre);
        }
        return true;
      },
    });
  }

  function dialogoCopia() {
    abrirDialogo({
      titulo: "Copia de seguridad",
      detalle: "Copiá este texto y guardalo donde quieras. Para restaurarlo, pegá acá una copia anterior y tocá Restaurar.",
      cuerpo: '<textarea id="dlg-copia" class="backup-area" spellcheck="false" aria-label="Datos en formato de texto">' +
        esc(JSON.stringify(datos)) + "</textarea>",
      cancelar: "Cerrar",
      extra: '<button type="button" class="btn btn-soft spacer" data-a="copiar-todo">Copiar al portapapeles</button>',
      ok: "Restaurar",
      onOk: () => {
        try {
          const entrante = JSON.parse($dlg.querySelector("#dlg-copia").value.trim());
          if (!entrante || !Array.isArray(entrante.clients) || !Array.isArray(entrante.tasks)) throw new Error("formato");
          datos = { clients: entrante.clients, tasks: entrante.tasks, ejemplos: Boolean(entrante.ejemplos) };
          guardar();
          toast("Datos restaurados", plural(datos.tasks.length, "tarea", "tareas"));
          return true;
        } catch (e) {
          toast("Esa copia no se entiende", "Pegá el texto completo, tal cual lo copiaste.");
          return false;
        }
      },
    });
  }

  /* ---------- acciones ---------- */
  function crearTarea(draft) {
    const tarea = Object.assign({}, draft, {
      id: uid("t"),
      title: draft.title.trim(),
      status: "pending",
      createdAt: new Date().toISOString(),
      completedAt: null,
    });
    datos.tasks.push(tarea);
    guardar();
    toast("Tarea creada", tarea.title);
    return tarea;
  }

  function borrarTarea(id) {
    const i = datos.tasks.findIndex((t) => t.id === id);
    if (i === -1) return;
    const tarea = datos.tasks.splice(i, 1)[0];
    guardar();
    render();
    toast("Tarea eliminada", tarea.title, () => {
      datos.tasks.push(tarea);
      guardar();
      render();
    });
  }

  const ACCIONES = {
    ir: (el) => ir(el.dataset.v),

    taski: () => {
      taski.abierto = !taski.abierto;
      pintarTaski();
      if (taski.abierto) {
        const campo = $taski.querySelector("#taski-input");
        if (campo) campo.focus();
      } else {
        $fab.focus();
      }
    },
    "taski-sugerencia": (el) => preguntarATaski(el.dataset.v),

    interpretar: () => {
      const texto = estado.captura.trim();
      if (!texto) return;
      const r = interpretar(texto, datos.clients);
      estado.borrador = r.draft;
      estado.adivinado = r.guessed;
      render();
      const campo = document.getElementById("inline-titulo");
      if (campo) { campo.focus(); campo.setSelectionRange(campo.value.length, campo.value.length); }
    },
    "cancelar-borrador": () => {
      estado.borrador = null;
      estado.adivinado = null;
      render();
      const c = document.getElementById("captura");
      if (c) c.focus();
    },
    "crear-borrador": () => {
      if (!estado.borrador || !estado.borrador.title.trim()) return;
      crearTarea(estado.borrador);
      estado.borrador = null;
      estado.adivinado = null;
      estado.captura = "";
      render();
      const c = document.getElementById("captura");
      if (c) c.focus();
    },
    "crear-desde-busqueda": () => {
      const r = interpretar(estado.consulta, datos.clients);
      dialogoTarea("Nueva tarea", r.draft, () => {
        if (!dlgDraft.title.trim()) return false;
        crearTarea(dlgDraft);
        estado.consulta = "";
        $search.value = "";
        estado.vista = "hoy";
        return true;
      });
    },

    toggle: (el) => {
      const t = datos.tasks.find((x) => x.id === el.dataset.id);
      if (!t) return;
      const completando = t.status !== "completed";
      t.status = completando ? "completed" : "pending";
      t.completedAt = completando ? new Date().toISOString() : null;
      guardar();
      render();
      if (completando) toast("Listo", t.title);
    },
    curso: (el) => {
      const t = datos.tasks.find((x) => x.id === el.dataset.id);
      if (!t) return;
      t.status = t.status === "in_progress" ? "pending" : "in_progress";
      guardar();
      render();
    },
    borrar: (el) => borrarTarea(el.dataset.id),
    editar: (el) => {
      const t = datos.tasks.find((x) => x.id === el.dataset.id);
      if (!t) return;
      const draft = {
        title: t.title, description: t.description, clientId: t.clientId,
        priority: t.priority, dueDate: t.dueDate, dueTime: t.dueTime, category: t.category,
      };
      dialogoTarea("Editar tarea", draft, () => {
        if (!dlgDraft.title.trim()) return false;
        Object.assign(t, dlgDraft, { title: dlgDraft.title.trim() });
        guardar();
        toast("Tarea actualizada", t.title);
        return true;
      }, '<button type="button" class="btn btn-danger spacer" data-a="borrar-desde-dialogo" data-id="' + t.id + '">' + icon("trash") + "Eliminar</button>");
    },
    "borrar-desde-dialogo": (el) => {
      const id = el.dataset.id;
      cerrarDialogo();
      borrarTarea(id);
    },

    "abrir-cliente": (el) => {
      estado.clienteId = el.dataset.id;
      estado.vista = "cliente";
      estado.pestana = "pending";
      estado.categoria = "todas";
      estado.consulta = "";
      $search.value = "";
      $scroll.scrollTop = 0;
      render();
    },
    pestana: (el) => { estado.pestana = el.dataset.v; estado.categoria = "todas"; render(); },
    categoria: (el) => { estado.categoria = el.dataset.v; render(); },
    "nueva-tarea": () => {
      dialogoTarea("Nueva tarea", {
        title: "", description: "", clientId: estado.clienteId,
        priority: "medium", dueDate: null, dueTime: null, category: "Otro",
      }, () => {
        if (!dlgDraft.title.trim()) return false;
        crearTarea(dlgDraft);
        return true;
      });
    },
    "nuevo-cliente": () => dialogoCliente(null),
    "renombrar-cliente": () => {
      const c = clientById(estado.clienteId);
      if (c) dialogoCliente(c.name);
    },
    "eliminar-cliente": () => {
      const c = clientById(estado.clienteId);
      if (!c) return;
      const suyas = datos.tasks.filter((t) => t.clientId === c.id).length;
      abrirDialogo({
        titulo: "¿Eliminar " + c.name + "?",
        detalle: suyas
          ? "Sus " + plural(suyas, "tarea sigue", "tareas siguen") + " acá, pero quedan sin cliente asignado."
          : "No tiene tareas asociadas.",
        ok: "Eliminar cliente",
        onOk: () => {
          datos.tasks.forEach((t) => { if (t.clientId === c.id) t.clientId = null; });
          datos.clients = datos.clients.filter((x) => x.id !== c.id);
          guardar();
          estado.vista = "clientes";
          estado.clienteId = null;
          toast("Cliente eliminado", c.name);
          return true;
        },
      });
    },

    dia: (el) => { estado.elegido = el.dataset.v; estado.ancla = el.dataset.v; render(); },
    "cal-vista": (el) => { estado.calVista = el.dataset.v; render(); },
    "cal-paso": (el) => {
      const n = Number(el.dataset.v);
      estado.ancla = estado.calVista === "semana" ? addDays(estado.ancla, n * 7) : addMonths(estado.ancla, n);
      render();
    },
    "cal-hoy": () => { estado.ancla = today(); estado.elegido = today(); render(); },

    "ocultar-ejemplos": () => { datos.ejemplos = false; guardar(); render(); },
    tema: (el) => elegirTema(el.dataset.v),
    copia: () => dialogoCopia(),
    "copiar-todo": () => {
      const area = $dlg.querySelector("#dlg-copia");
      area.select();
      const intento = navigator.clipboard
        ? navigator.clipboard.writeText(area.value).then(() => true, () => false)
        : Promise.resolve(false);
      intento.then((copiado) => {
        toast(copiado ? "Copiado" : "Seleccioná y copiá a mano",
          copiado ? "Guardalo donde quieras." : "El navegador no dejó copiar solo.");
      });
    },
    ejemplos: () => {
      abrirDialogo({
        titulo: "¿Cargar los datos de ejemplo?",
        detalle: "Reemplaza los clientes y tareas que tengas ahora en este navegador.",
        ok: "Cargar ejemplos",
        onOk: () => {
          datos = ejemplos();
          guardar();
          estado.vista = "hoy";
          toast("Datos de ejemplo cargados");
          return true;
        },
      });
    },
    vaciar: () => {
      abrirDialogo({
        titulo: "¿Empezar de cero?",
        detalle: "Se borran todos los clientes y tareas guardados en este navegador.",
        ok: "Vaciar todo",
        onOk: () => {
          datos = { clients: [], tasks: [], ejemplos: false };
          guardar();
          estado.vista = "hoy";
          estado.clienteId = null;
          toast("Listo, quedó vacío");
          return true;
        },
      });
    },

    "cerrar-dialogo": () => cerrarDialogo(),
    "ok-dialogo": () => {
      const fn = dlgOnOk;
      if (!fn || fn() !== false) {
        cerrarDialogo();
        render();
      }
    },
  };

  /* ---------- eventos ---------- */
  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-a]");
    if (!el) return;
    const accion = ACCIONES[el.dataset.a];
    if (!accion) return;
    e.preventDefault();
    accion(el);
  });

  // Los campos escriben directo en el borrador: si re-renderizáramos en cada
  // tecla, el cursor saltaría y escribir sería un infierno.
  const borradorDe = (destino) => (destino === "dlg" ? dlgDraft : estado.borrador);

  document.addEventListener("input", (e) => {
    const el = e.target;
    if (el.id === "captura") {
      estado.captura = el.value;
      const boton = document.getElementById("captura-enviar");
      if (boton) boton.disabled = !el.value.trim();
      return;
    }
    if (el.id === "taski-input") {
      const enviar = $taski.querySelector("#taski-send");
      if (enviar) enviar.disabled = !el.value.trim();
      return;
    }
    if (el.id === "search") {
      estado.consulta = el.value;
      $scroll.scrollTop = 0;
      render();
      return;
    }
    const campo = el.dataset && el.dataset.f;
    if (!campo) return;
    const draft = borradorDe(el.dataset.target);
    if (!draft) return;
    const vacia = el.value === "" && (campo === "dueDate" || campo === "dueTime" || campo === "clientId");
    draft[campo] = vacia ? null : el.value;
  });

  // Los botones de prioridad se actualizan a mano, por el mismo motivo.
  document.addEventListener("click", (e) => {
    const el = e.target.closest('[data-a="prioridad"]');
    if (!el) return;
    const draft = borradorDe(el.dataset.target);
    if (!draft) return;
    draft.priority = el.dataset.v;
    el.parentElement.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b === el)));
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && e.target.id === "captura") {
      e.preventDefault();
      ACCIONES.interpretar();
      return;
    }
    if (e.key === "Enter" && $dlg.open && e.target.tagName === "INPUT") {
      e.preventDefault();
      ACCIONES["ok-dialogo"]();
      return;
    }
    if (e.key !== "Escape") return;
    if ($dlg.open) return; // lo cierra el propio <dialog>
    if (taski.abierto) { ACCIONES.taski(); return; }
    if ($search.value) { estado.consulta = ""; $search.value = ""; render(); }
  });

  $dlg.addEventListener("close", () => { dlgDraft = null; dlgOnOk = null; });

  /* ---------- arranque ---------- */
  aplicarTema(temaGuardado());

  const guardados = cargar();
  if (guardados) datos = Object.assign({ ejemplos: false }, guardados);
  else { datos = ejemplos(); guardar(); }

  render();
  if (!almacenamientoOk) {
    toast("Este navegador no guarda datos", "Podés usar la app, pero se borra al cerrar la pestaña.");
  }

  // El reloj de los recordatorios: una vez por minuto alcanza.
  setTimeout(function tick() {
    if (!$dlg.open && !estado.borrador && !estado.consulta.trim() && estado.vista === "hoy") render();
    setTimeout(tick, 60000);
  }, 60000 - (Date.now() % 60000));
</script>

</body>
</html>
