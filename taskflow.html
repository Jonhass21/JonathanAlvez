<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<style>
  :root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; background: #fafafa; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
<title>TaskFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,500&display=swap"
/>

<style>
  /* ---------- tokens ---------- */
  :root {
    --base: #fbfaf9;
    --soft: #f4f2f0;
    --surface: #ffffff;
    --surface-2: #f7f5f3;
    --line: #e7e3df;
    --line-2: #d6d0ca;
    --ink: #1a1718;
    --ink-2: #6b625f;
    --ink-3: #9a918d;
    --accent: #8c2f3d;
    --accent-ink: #93303e;
    --accent-soft: #f8eef0;
    --accent-fg: #ffffff;
    --gold: #a07422;
    --gold-soft: #faf4e8;
    --shadow-1: 0 1px 2px rgb(24 20 18 / 0.05);
    --shadow-2: 0 2px 6px rgb(24 20 18 / 0.06), 0 18px 40px rgb(24 20 18 / 0.12);
    --radius: 12px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --base: #121013;
      --soft: #171416;
      --surface: #1c1719;
      --surface-2: #241e20;
      --line: #2b2426;
      --line-2: #3a3134;
      --ink: #f1eae4;
      --ink-2: #a79a9c;
      --ink-3: #6f6567;
      --accent: #8c2f3d;
      --accent-ink: #e7a3ad;
      --accent-soft: #2a1b1e;
      --accent-fg: #fff8f9;
      --gold: #c9a15f;
      --gold-soft: #26200f;
      --shadow-1: 0 1px 2px rgb(0 0 0 / 0.3);
      --shadow-2: 0 2px 6px rgb(0 0 0 / 0.35), 0 18px 40px rgb(0 0 0 / 0.45);
    }
  }

  :root[data-theme="dark"] {
    --base: #121013;
    --soft: #171416;
    --surface: #1c1719;
    --surface-2: #241e20;
    --line: #2b2426;
    --line-2: #3a3134;
    --ink: #f1eae4;
    --ink-2: #a79a9c;
    --ink-3: #6f6567;
    --accent: #8c2f3d;
    --accent-ink: #e7a3ad;
    --accent-soft: #2a1b1e;
    --accent-fg: #fff8f9;
    --gold: #c9a15f;
    --gold-soft: #26200f;
    --shadow-1: 0 1px 2px rgb(0 0 0 / 0.3);
    --shadow-2: 0 2px 6px rgb(0 0 0 / 0.35), 0 18px 40px rgb(0 0 0 / 0.45);
  }

  /* ---------- base ---------- */
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--base);
    color: var(--ink);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; }
  :focus-visible { outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; }
  time, .num { font-variant-numeric: tabular-nums; }
  ::selection { background: color-mix(in srgb, var(--accent) 25%, transparent); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }

  /* ---------- shell ---------- */
  .app { display: flex; height: 100%; }

  .sidebar {
    display: none;
    width: 232px;
    flex: 0 0 232px;
    flex-direction: column;
    gap: 20px;
    padding: 22px 14px;
    border-right: 1px solid var(--line);
    background: var(--soft);
  }
  .wordmark {
    font-family: "Playfair Display", Georgia, serif;
    font-style: italic;
    font-size: 21px;
    letter-spacing: -0.01em;
    padding-inline: 8px;
  }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav button {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 9px;
    font-size: 13.5px; font-weight: 500; color: var(--ink-2); text-align: left;
    transition: background .12s, color .12s;
  }
  .nav button:hover { background: var(--surface); color: var(--ink); }
  .nav button[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }
  .nav button[aria-current="page"] .ic { color: var(--accent-ink); }
  .ic { width: 17px; height: 17px; flex: none; color: var(--ink-3); }
  .sidebar-foot { margin-top: auto; display: flex; align-items: center; gap: 9px; padding: 6px 10px; }
  .avatar {
    width: 26px; height: 26px; border-radius: 50%; flex: none;
    display: grid; place-items: center;
    background: var(--accent-soft); color: var(--accent-ink);
    font-size: 11.5px; font-weight: 600;
  }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }

  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--base);
  }
  .topbar .wordmark { font-size: 18px; padding: 0; }
  .search { position: relative; flex: 1; max-width: 340px; margin-left: auto; }
  .search .ic { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); pointer-events: none; }
  .search input {
    width: 100%; padding: 8px 10px 8px 32px;
    border: 1px solid var(--line); border-radius: 9px;
    background: var(--surface); font-size: 13px;
  }
  .search input::placeholder { color: var(--ink-3); }
  .search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  .scroll { flex: 1; overflow-y: auto; }
  .page { max-width: 720px; margin: 0 auto; padding: 24px 16px 96px; display: flex; flex-direction: column; gap: 26px; }

  .tabbar {
    position: fixed; inset: auto 0 0 0; z-index: 20;
    display: flex;
    border-top: 1px solid var(--line);
    background: color-mix(in srgb, var(--soft) 94%, transparent);
    backdrop-filter: blur(10px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .tabbar button {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 8px 2px; font-size: 10.5px; font-weight: 500; color: var(--ink-3);
  }
  .tabbar button[aria-current="page"] { color: var(--ink); }
  .tabbar button[aria-current="page"] .ic { color: var(--accent-ink); }
  .tabbar .ic { width: 19px; height: 19px; }

  @media (min-width: 768px) {
    .sidebar { display: flex; }
    .tabbar { display: none; }
    .topbar .wordmark, .topbar .only-mobile { display: none; }
    .page { padding: 32px 24px 48px; }
  }

  /* ---------- typography ---------- */
  h1 { font-size: 19px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  h2 { font-size: 11px; font-weight: 600; margin: 0; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); }
  .greet {
    font-family: "Playfair Display", Georgia, serif;
    font-style: italic; font-weight: 500;
    font-size: 27px; line-height: 1.15; margin: 4px 0 0;
    text-wrap: balance;
  }
  .eyebrow { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); margin: 0; }
  .sub { margin: 5px 0 0; font-size: 13.5px; color: var(--ink-2); }
  .muted { color: var(--ink-2); }
  .dim { color: var(--ink-3); }
  section { display: flex; flex-direction: column; gap: 9px; }

  /* ---------- capture ---------- */
  .capture { display: flex; flex-direction: column; gap: 8px; }
  .capture-row { position: relative; }
  .capture-row input {
    width: 100%; padding: 14px 46px 14px 14px;
    font-size: 15px;
    border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--surface); box-shadow: var(--shadow-1);
  }
  .capture-row input::placeholder { color: var(--ink-3); }
  .capture-row input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .capture-send {
    position: absolute; right: 7px; top: 50%; transform: translateY(-50%);
    width: 30px; height: 30px; border-radius: 8px;
    display: grid; place-items: center;
    background: var(--accent); color: var(--accent-fg);
    transition: opacity .12s;
  }
  .capture-send[disabled] { opacity: .22; cursor: default; }
  .hint { font-size: 11.5px; color: var(--ink-3); padding-inline: 3px; margin: 0; }

  .confirm {
    border: 1px solid var(--accent); border-radius: var(--radius);
    background: var(--surface); box-shadow: var(--shadow-1);
    padding: 14px; display: flex; flex-direction: column; gap: 12px;
  }
  .confirm-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field > label { font-size: 11px; font-weight: 500; color: var(--ink-3); display: flex; align-items: center; gap: 5px; }
  .guessed { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); flex: none; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 7px 9px;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--base); font-size: 13.5px;
  }
  .field textarea { resize: vertical; min-height: 54px; }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .seg { display: flex; gap: 6px; }
  .seg button {
    flex: 1; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px;
    font-size: 12.5px; font-weight: 500; color: var(--ink-2); transition: all .12s;
  }
  .seg button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
  .actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

  /* ---------- buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 13px; border-radius: 9px;
    font-size: 12.5px; font-weight: 600;
    border: 1px solid transparent; transition: background .12s, border-color .12s, color .12s;
  }
  .btn-primary { background: var(--accent); color: var(--accent-fg); }
  .btn-primary:hover { background: color-mix(in srgb, var(--accent) 88%, #000); }
  .btn-ghost { color: var(--ink-2); font-weight: 500; }
  .btn-ghost:hover { background: var(--surface-2); color: var(--ink); }
  .btn-outline { border-color: var(--line); color: var(--ink-2); font-weight: 500; }
  .btn-outline:hover { background: var(--surface-2); color: var(--ink); }
  .btn-danger { color: var(--ink-3); font-weight: 500; }
  .btn-danger:hover { background: var(--surface-2); color: var(--accent-ink); }
  .icon-btn {
    width: 30px; height: 30px; border-radius: 8px;
    display: grid; place-items: center; color: var(--ink-3);
    transition: background .12s, color .12s;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--ink); }
  .icon-btn.danger:hover { color: var(--accent-ink); }
  .icon-btn .ic { width: 15px; height: 15px; }

  /* ---------- task rows ---------- */
  .list { display: flex; flex-direction: column; gap: 7px; }
  .task {
    display: flex; align-items: flex-start; gap: 11px;
    padding: 11px 12px;
    border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--surface);
    transition: border-color .12s;
  }
  .task:hover { border-color: var(--line-2); }
  .check {
    margin-top: 1px; width: 18px; height: 18px; flex: none;
    border: 1px solid var(--line-2); border-radius: 50%;
    display: grid; place-items: center;
    transition: border-color .12s, background .12s;
  }
  .check:hover { border-color: var(--accent); }
  .check[data-done="1"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .check .ic { width: 11px; height: 11px; }
  .task-body { flex: 1; min-width: 0; text-align: left; }
  .task-title { font-size: 13.5px; font-weight: 500; margin: 0; }
  .task[data-done="1"] .task-title { color: var(--ink-3); text-decoration: line-through; }
  .task-note { margin: 2px 0 0; font-size: 12px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 6px; font-size: 11.5px; color: var(--ink-2); }
  .meta .client { font-weight: 500; }
  .tag { border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; font-size: 11px; }
  .when.overdue { color: var(--accent-ink); font-weight: 500; }
  .when.today { color: var(--gold); font-weight: 500; }
  .pill-progress { border-radius: 999px; padding: 1px 7px; font-size: 10.5px; font-weight: 500; background: var(--gold-soft); color: var(--gold); }
  .task-side { display: flex; align-items: center; gap: 2px; flex: none; }
  .dot { width: 6px; height: 6px; border-radius: 50%; margin-left: 4px; flex: none; }
  .dot.high { background: var(--accent); }
  .dot.medium { background: var(--gold); }
  .dot.low { background: var(--line-2); }
  @media (min-width: 768px) {
    .task-side .icon-btn { opacity: 0; transition: opacity .12s; }
    .task:hover .task-side .icon-btn, .task:focus-within .task-side .icon-btn { opacity: 1; }
  }

  /* ---------- cards / banners ---------- */
  .card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 14px; }
  .card-soft { border: 1px solid var(--line); border-radius: var(--radius); background: var(--soft); padding: 14px; }
  .banner {
    display: flex; align-items: center; flex-wrap: wrap; gap: 8px 11px;
    padding: 10px 13px; border-radius: var(--radius);
    border: 1px solid transparent; font-size: 12.5px;
  }
  .banner.gold { border-color: color-mix(in srgb, var(--gold) 40%, transparent); background: var(--gold-soft); }
  .banner.gold .ic { color: var(--gold); }
  .banner.red { border-color: color-mix(in srgb, var(--accent) 35%, transparent); background: var(--accent-soft); }
  .banner.red .ic { color: var(--accent-ink); }
  .banner .ic { flex: none; }
  .banner-body { flex: 1 1 180px; min-width: 0; }
  .banner strong { font-weight: 600; }
  .empty {
    border: 1px dashed var(--line); border-radius: var(--radius);
    padding: 30px 20px; text-align: center; color: var(--ink-2); font-size: 13.5px;
  }
  .empty p { margin: 4px 0 0; font-size: 12.5px; color: var(--ink-3); }

  /* ---------- clients ---------- */
  .client-row {
    display: flex; align-items: center; gap: 11px; width: 100%;
    padding: 13px 14px; text-align: left;
    border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface);
    transition: border-color .12s, background .12s;
  }
  .client-row:hover { border-color: var(--line-2); background: var(--surface-2); }
  .swatch { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .swatch.accent { background: var(--accent); }
  .swatch.gold { background: var(--gold); }
  .swatch.neutral { background: var(--line-2); }
  .client-name { font-size: 14px; font-weight: 500; margin: 0; }
  .client-next { margin: 2px 0 0; font-size: 12px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .count { font-size: 12px; color: var(--ink-3); }
  .badge { border-radius: 999px; padding: 2px 8px; font-size: 11px; font-weight: 600; background: var(--accent-soft); color: var(--accent-ink); }

  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); }
  .tabs button {
    padding: 8px 11px; margin-bottom: -1px;
    border-bottom: 2px solid transparent;
    font-size: 12.5px; font-weight: 500; color: var(--ink-3);
  }
  .tabs button:hover { color: var(--ink-2); }
  .tabs button[aria-selected="true"] { border-bottom-color: var(--accent); color: var(--ink); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    border: 1px solid var(--line); border-radius: 999px;
    padding: 4px 10px; font-size: 11.5px; font-weight: 500; color: var(--ink-3);
    transition: all .12s;
  }
  .chip:hover { color: var(--ink-2); }
  .chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }

  /* ---------- calendar ---------- */
  .cal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .cal-month { font-size: 13px; font-weight: 500; color: var(--ink-2); text-transform: capitalize; }
  .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
  .day {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 8px 2px; border: 1px solid var(--line); border-radius: 9px;
    transition: border-color .12s, background .12s;
  }
  .day:hover { border-color: var(--line-2); background: var(--surface-2); }
  .day[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .day .dow { font-size: 10px; font-weight: 500; text-transform: uppercase; color: var(--ink-3); letter-spacing: .04em; }
  .day .n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12.5px; font-weight: 500; color: var(--ink-2); }
  .day.is-today .n { background: var(--gold-soft); color: var(--gold); font-weight: 600; }
  .day[aria-pressed="true"] .n { color: var(--ink); }
  .day .marks { height: 4px; display: flex; gap: 2px; }
  .day .marks i { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
  .month-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
  .month-grid .dow-head { text-align: center; font-size: 10px; font-weight: 500; text-transform: uppercase; color: var(--ink-3); letter-spacing: .04em; padding-bottom: 4px; }
  .month-grid .day { border-color: transparent; padding: 6px 2px; }
  .month-grid .day:hover { border-color: var(--line); }
  .month-grid .day[aria-pressed="true"] { border-color: var(--accent); }
  .month-grid .day.out { opacity: .38; }
  .month-grid .day .n { width: 21px; height: 21px; font-size: 11.5px; }

  /* ---------- settings ---------- */
  .rows { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 14px; }
  .row + .row { border-top: 1px solid var(--line); }
  .row-label { font-size: 13.5px; font-weight: 500; }
  .row-desc { margin: 2px 0 0; font-size: 12px; color: var(--ink-3); }

  /* ---------- dialog ---------- */
  dialog {
    width: min(460px, calc(100% - 24px));
    padding: 0; border: 1px solid var(--line-2); border-radius: 14px;
    background: var(--surface); color: var(--ink);
    box-shadow: var(--shadow-2);
  }
  dialog::backdrop { background: rgb(24 20 18 / 0.32); backdrop-filter: blur(2px); }
  .dlg-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; padding: 16px 16px 0; }
  .dlg-title { font-size: 15px; font-weight: 600; margin: 0; }
  .dlg-desc { margin: 4px 0 0; font-size: 12.5px; color: var(--ink-2); }
  .dlg-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
  .dlg-foot { display: flex; gap: 8px; justify-content: flex-end; align-items: center; padding: 0 16px 16px; flex-wrap: wrap; }
  .dlg-foot .spacer { margin-right: auto; }

  /* ---------- toasts ---------- */
  .toasts {
    position: fixed; z-index: 60;
    left: 16px; right: 16px; bottom: calc(80px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    pointer-events: none;
  }
  @media (min-width: 768px) { .toasts { bottom: 24px; } }
  .toast {
    pointer-events: auto;
    width: 100%; max-width: 380px;
    display: flex; align-items: center; gap: 11px;
    padding: 11px 13px;
    border: 1px solid var(--line-2); border-radius: var(--radius);
    background: var(--surface); box-shadow: var(--shadow-2);
    animation: rise .16s ease-out;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .toast-body { flex: 1; min-width: 0; }
  .toast-title { font-size: 13px; font-weight: 500; margin: 0; }
  .toast-desc { margin: 1px 0 0; font-size: 12px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toast .undo { font-size: 12px; font-weight: 600; color: var(--accent-ink); padding: 4px 6px; border-radius: 7px; }
  .toast .undo:hover { background: var(--surface-2); }

  .backup-area {
    width: 100%; min-height: 130px; resize: vertical;
    padding: 9px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--base); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px;
  }
</style>

</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="wordmark">TaskFlow</div>
    <nav class="nav" id="nav-desktop" aria-label="Secciones"></nav>

    <header class="topbar">
      <div class="wordmark only-mobile">TaskFlow</div>
      <div class="search">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="7" /><path d="m20 20-3.2-3.2" stroke-linecap="round" />
