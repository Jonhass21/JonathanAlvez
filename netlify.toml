# El sitio publica la carpeta "panel", que ya trae el index.html, el
# manifiesto y los iconos. No hay build ni dependencias: Netlify sube los
# archivos tal cual.

[build]
  publish = "panel"

# La app es un archivo solo: cualquier ruta cae en la misma página.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# El HTML lleva la app adentro: nunca cachearlo, o un cambio tarda días en verse.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
