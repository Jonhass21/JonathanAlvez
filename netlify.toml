# Netlify publica la carpeta "site", que se arma en el momento a partir de
# taskflow.html. Así el archivo vive una sola vez en el repo y no hay copias
# que se desincronicen. No hace falta Node ni instalar dependencias.

[build]
  publish = "site"
  command = "mkdir -p site && cp taskflow.html site/index.html && cp manifest.webmanifest icon-*.png site/"

# La app es un archivo solo: cualquier ruta cae en la misma página.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# El HTML lleva la app adentro: nunca cachearlo, o un cambio tarda días en verse.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
